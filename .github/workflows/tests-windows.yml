name: Tests (Windows)

# Arbeits-Branches: nur testen, nichts veröffentlichen (Release macht build-exe.yml auf main/Tags).
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pytest-timeout
      - name: Systemlage (Symlinks, LongPaths, Netzwerkfreigabe)
        shell: pwsh
        run: |
          fsutil behavior query SymlinkEvaluation
          Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled
          Test-Path "\\localhost\C$\Windows"
      - name: Szenarien (nachgebautes PixInsight, UNC-Freigabe)
        run: pytest -v -p no:warnings --timeout=300 --timeout-method=thread tests/test_stack_scenarios.py tests/test_flat_groups.py
        timeout-minutes: 15
      - name: Alle Tests
        run: pytest -q -p no:warnings --timeout=240 --timeout-method=thread
        timeout-minutes: 20
