name: Windows-exe bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pyinstaller

      - name: Tests
        run: pytest -q -p no:warnings

      - name: exe bauen
        run: pyinstaller packaging/astrostack.spec --noconfirm

      - name: Selbsttest der exe
        run: dist\AstroStack.exe _selftest

      - name: Analyse mit der exe (Testdaten)
        shell: pwsh
        run: |
          $env:ASTROSTACK_SETTINGS = "$env:RUNNER_TEMP\as\settings.json"
          python packaging/make_testdata.py "$env:RUNNER_TEMP\as\NINA"
          dist\AstroStack.exe settings --set "workdir=$env:RUNNER_TEMP\as\work"
          dist\AstroStack.exe report "$env:RUNNER_TEMP\as\NINA"
          if (-not (Test-Path "$env:RUNNER_TEMP\as\work\projects\vdB 131\report.html")) { throw "kein Bericht" }
          dist\AstroStack.exe --json plan "vdB 131"

      - name: Oberfläche starten und abfragen
        shell: pwsh
        run: |
          $env:ASTROSTACK_SETTINGS = "$env:RUNNER_TEMP\as\settings.json"
          $p = Start-Process dist\AstroStack.exe -ArgumentList "gui","--no-browser" -PassThru
          Start-Sleep -Seconds 8
          $s = Invoke-RestMethod http://127.0.0.1:8765/api/state
          if ($s.projects.Count -lt 1) { throw "keine Projekte in der Oberfläche" }
          Write-Host "Oberfläche OK, Version $($s.version), RAM frei $($s.ram_free_gb) GB"
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AstroStack-exe
          path: dist/AstroStack.exe

      - name: Release (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AstroStack.exe
          body: |
            **AstroStack.exe herunterladen und doppelklicken** – die Oberfläche öffnet sich im Browser.
            Keine Installation, kein Python nötig. Voraussetzung: PixInsight.

            Windows SmartScreen kann beim ersten Start warnen („Unbekannter Herausgeber“):
            „Weitere Informationen“ → „Trotzdem ausführen“.
