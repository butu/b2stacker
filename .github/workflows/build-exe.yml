name: Windows-exe bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pyinstaller pytest-timeout

      - name: Tests
        run: pytest -v -p no:warnings --timeout=240 --timeout-method=thread
        timeout-minutes: 15

      - name: exe bauen
        # pytest muss weg: sonst bricht der astropy-Hook von PyInstaller (importorskip in wcsaxes)
        run: |
          pip uninstall -y pytest pytest-timeout
          pyinstaller packaging/astrostack.spec --noconfirm

      - name: Selbsttest der exe
        shell: pwsh
        run: |
          # Die exe hat kein Konsolenfenster – Ausgabe über Umleitung prüfen
          $p = Start-Process dist\b2stacker.exe -ArgumentList "_selftest" -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen" }

      - name: Analyse mit der exe (Testdaten, Kommandozeile)
        shell: pwsh
        run: |
          $env:ASTROSTACK_SETTINGS = "$env:RUNNER_TEMP\as\settings.json"
          python packaging/make_testdata.py "$env:RUNNER_TEMP\as\NINA"
          function Run-Exe($a) {
            $p = Start-Process dist\b2stacker.exe -ArgumentList $a -Wait -PassThru -NoNewWindow -RedirectStandardOutput out.txt
            Get-Content out.txt
            if ($p.ExitCode -ne 0) { throw "Fehler bei: $a" }
          }
          Run-Exe @("settings", "--set", "workdir=$env:RUNNER_TEMP\as\work")
          Run-Exe @("report", "`"$env:RUNNER_TEMP\as\NINA`"")
          if (-not (Test-Path "$env:RUNNER_TEMP\as\work\projects\vdB 131\report.html")) { throw "kein Bericht" }
          Run-Exe @("--json", "plan", "`"vdB 131`"")
          Run-Exe @("logs", "--last", "5")

      - name: Neue Oberfläche ohne Fenster (Projekt anlegen, einlesen, MCP)
        shell: pwsh
        run: |
          $env:ASTROSTACK_SETTINGS = "$env:RUNNER_TEMP\as\settings.json"
          python packaging/web_smoke.py dist\b2stacker.exe "$env:RUNNER_TEMP\as\NINA"
          Get-Process b2stacker -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

      - name: Alte Oberfläche ohne Fenster starten und abfragen (B2_OLD_UI=1)
        shell: pwsh
        run: |
          $env:ASTROSTACK_SETTINGS = "$env:RUNNER_TEMP\as\settings.json"
          $env:B2_OLD_UI = "1"
          $p = Start-Process dist\b2stacker.exe -ArgumentList "gui","--no-browser" -PassThru
          Start-Sleep -Seconds 8
          $s = Invoke-RestMethod http://127.0.0.1:8765/api/state
          if ($s.projects.Count -lt 1) { throw "keine Projekte in der Oberfläche" }
          Write-Host "Oberfläche OK, Version $($s.version), RAM frei $($s.ram_free_gb) GB"
          # Einzeldatei-exe = Starter + eigentliches Programm → alle Prozesse beenden
          Get-Process b2stacker -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

      - name: MCP-Server der exe (so wie Claude ihn startet)
        shell: pwsh
        run: |
          $env:ASTROSTACK_SETTINGS = "$env:RUNNER_TEMP\as\settings.json"
          python packaging/mcp_smoke.py dist\b2stacker.exe
          Get-Process b2stacker -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

      - name: Programmfenster öffnen (WebView2)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:ASTROSTACK_SETTINGS = "$env:RUNNER_TEMP\as\settings.json"
          $env:B2_AUTOCLOSE = "6"
          $p = Start-Process dist\b2stacker.exe -PassThru
          $ok = $p.WaitForExit(60000)
          Get-Process b2stacker -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "beendet: $ok  Exit: $($p.ExitCode)"
          $ev = Get-Content "$env:RUNNER_TEMP\as\work\logs\events-*.jsonl" | Select-Object -Last 12
          $ev | ForEach-Object { Write-Host $_ }
          Write-Host "--- b2stacker.log ---"
          Get-Content "$env:RUNNER_TEMP\as\work\logs\b2stacker.log" -Tail 40 | ForEach-Object { Write-Host $_ }
          if (-not ($ev -match "window_loaded")) { throw "Programmfenster wurde nicht geladen" }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "Programm hat sich nicht beendet" }
          Write-Host "Programmfenster OK (geöffnet, geladen, geschlossen)"

      - uses: actions/upload-artifact@v4
        with:
          name: AstroStack-exe
          path: dist/b2stacker.exe

      - name: Version lesen
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import astrostack; print(astrostack.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Release-Text aus CHANGELOG.md
        run: python packaging/release_notes.py ${{ steps.ver.outputs.version }} release-notes.md ${{ github.sha }}

      - name: Release veröffentlichen (main → v<Version>)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AstroStack ${{ steps.ver.outputs.version }}
          make_latest: true
          files: dist/b2stacker.exe
          body_path: release-notes.md
