[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrostack"
version = "0.5.1"
description = "Rohdaten sichten, bewerten und mit PixInsight stacken – automatisch, nachvollziehbar, per Klick oder per KI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary – private project" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5.3",
    "pillow>=10",
    "pywebview>=5; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
astrostack = "astrostack.__main__:run"

[project.gui-scripts]
b2stacker = "astrostack.__main__:run"

[tool.setuptools.packages.find]
include = ["astrostack*"]

[tool.setuptools.package-data]
astrostack = ["report/*.html", "report/vendor/*", "pjsr/*.js", "app/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
