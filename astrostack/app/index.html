<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>b2stacker</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0e0f12;--surface-1:#16181d;--surface-2:#1d2026;--surface-3:#252932;--line:#2a2e36;
  --text-primary:#f0efec;--text-secondary:#c3c2b7;--text-muted:#8d8c86;
  --accent:#3987e5;--accent-ink:#fff;--good:#2fb344;--warning:#fab219;--critical:#e05252;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;
  --radius:10px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;--bg:#f4f4f2;--surface-1:#fcfcfb;--surface-2:#f0f0ed;--surface-3:#e7e7e3;--line:#dcdcd7;
  --text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#7a7974;--accent:#2a78d6;--good:#1d9a34;--warning:#b67f00;--critical:#c73333;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;}}
:root[data-theme="light"]{color-scheme:light;--bg:#f4f4f2;--surface-1:#fcfcfb;--surface-2:#f0f0ed;--surface-3:#e7e7e3;--line:#dcdcd7;
  --text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#7a7974;--accent:#2a78d6;--good:#1d9a34;--warning:#b67f00;--critical:#c73333;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text-primary);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header{display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface-1);flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo svg.i{width:22px;height:22px;color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--text-secondary);white-space:nowrap}
.chip b{color:var(--text-primary);font-weight:600}
.chip svg.spark{width:56px;height:18px;display:block}
.minibar{width:46px;height:6px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.minibar>div{height:100%}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-muted);flex:none}
.dot.good{background:var(--good)}.dot.warning{background:var(--warning)}.dot.critical{background:var(--critical)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;text-decoration:none}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:12px 24px;font-size:16px;border-radius:10px}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--critical)}
.btn.ghost{background:none;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.icon{padding:6px 8px}
a.lnk,button.lnk{color:var(--accent);background:none;border:none;padding:0;cursor:pointer;text-decoration:none;display:inline-flex;gap:4px;align-items:center;font:inherit}
a.lnk:hover,button.lnk:hover{text-decoration:underline}
.main{flex:1;display:grid;grid-template-columns:270px 1fr;min-height:0}
aside{border-right:1px solid var(--line);background:var(--surface-1);padding:14px 12px;overflow:auto}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:18px 6px 8px;font-weight:600}
.proj{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer;margin-bottom:2px}
.proj:hover{background:var(--surface-2)}
.proj.on{background:var(--surface-2);border-color:var(--line)}
.proj b{display:block;font-weight:600}
.proj span{font-size:12px;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap}
section.view{overflow:auto;padding:22px 24px 60px;min-width:0}
.wrap{max-width:1080px}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
.sub{color:var(--text-secondary)}
.muted{color:var(--text-muted)}
.small{font-size:12.5px}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.steps{display:grid;gap:14px;margin-top:18px}
.step{display:grid;grid-template-columns:32px 1fr;gap:12px}
.num{width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-weight:700;font-size:13px}
.folders{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.frow{display:flex;gap:6px}
.frow input{flex:1;min-width:0}
input[type=text],input[type=number],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
textarea{width:100%;min-height:58px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.recent{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.recent button{background:none;border:1px dashed var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer;color:var(--text-secondary)}
.recent button:hover{border-color:var(--accent);color:var(--text-primary)}
/* Auftrag */
.progress{height:10px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.progress>div{height:100%;background:var(--accent);transition:width .5s}
.progress.indet>div{width:30%!important;animation:indet 1.6s infinite ease-in-out}
@keyframes indet{0%{margin-left:-30%}100%{margin-left:100%}}
.timeline{display:flex;gap:0;margin:14px 0 4px;overflow-x:auto;padding-bottom:4px}
.tl{flex:1;min-width:84px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;font-size:12px;color:var(--text-muted)}
.tl:not(:last-child)::after{content:"";position:absolute;top:15px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:var(--line)}
.tl.done:not(:last-child)::after{background:var(--good)}
.tl .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);border:2px solid var(--line);margin-bottom:5px;color:var(--text-muted)}
.tl.done .ic{background:color-mix(in srgb,var(--good) 18%,var(--surface-2));border-color:var(--good);color:var(--good)}
.tl.now .ic{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent);animation:pulse 2s infinite}
.tl.now{color:var(--text-primary);font-weight:600}
@keyframes pulse{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--accent) 6%,transparent)}}
.nowbox{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.nowbox .big-ic{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);display:grid;place-items:center}
.nowbox .big-ic svg.i{width:24px;height:24px}
.nowbox .what{color:var(--text-secondary);font-size:13px}
.nowbox .why{color:var(--text-muted);font-size:12.5px;margin-top:3px}
.eta{text-align:right;white-space:nowrap}
.eta b{font-size:20px;display:block;line-height:1.2}
pre.log{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:240px;overflow:auto;font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;margin:10px 0 0;color:var(--text-secondary)}
/* Projekt */
.ptitle{display:flex;align-items:center;gap:8px}
.ptitle input{font-size:22px;font-weight:700;padding:2px 8px;min-width:240px}
.desc{margin-top:8px}
.desc textarea{background:transparent;border-color:transparent;padding:6px 8px;margin-left:-8px;color:var(--text-secondary)}
.desc textarea:hover{border-color:var(--line)}
.desc textarea:focus{background:var(--surface-2);border-color:var(--accent)}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.src{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px}
.src button{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:0 4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:18px;overflow-x:auto}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--text-secondary);font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tabs button.on{border-color:var(--accent);color:var(--text-primary)}
.runs{display:grid;gap:12px;margin-top:14px}
.run{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
.run.off{opacity:.55}
.run h3{margin:0;font-size:16px}
.run .why{color:var(--text-secondary);font-size:13px;margin-top:4px}
.kv{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--text-secondary);align-items:center}
.kv b{color:var(--text-primary);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600}
.badge.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.badge.warning{background:color-mix(in srgb,var(--warning) 20%,transparent);color:var(--warning)}
.badge.critical{background:color-mix(in srgb,var(--critical) 18%,transparent);color:var(--critical)}
.badge.neutral{background:var(--surface-3);color:var(--text-secondary)}
.switch{position:relative;width:40px;height:22px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--surface-3);border-radius:999px;cursor:pointer;transition:.2s;border:1px solid var(--line)}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;border-radius:50%;background:var(--text-secondary);transition:.2s}
.switch input:checked+span{background:var(--accent);border-color:var(--accent)}
.switch input:checked+span:before{transform:translateX(18px);background:#fff}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 22px;margin-top:6px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.opt .t{font-weight:500}
.opt .d{font-size:12.5px;color:var(--text-muted)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.meter .bar{height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin:6px 0 4px;position:relative}
.meter .bar>div{height:100%;transition:width .6s}
.meter .bar>i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-primary)}
.meter .big{font-size:20px;font-weight:700}
.go{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:18px;padding:16px 18px;border-radius:var(--radius);background:var(--surface-2);border:1px solid var(--line)}
.go .msg{flex:1;min-width:200px;color:var(--text-secondary)}
table.why{width:100%;border-collapse:collapse;font-size:13px}
table.why td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
table.why td:first-child{color:var(--text-muted);white-space:nowrap}
table.why td:nth-child(2){font-weight:600}
iframe{width:100%;height:calc(100vh - 230px);border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);margin-top:14px}
.banner{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:8px;background:color-mix(in srgb,var(--warning) 14%,var(--surface-1));border:1px solid color-mix(in srgb,var(--warning) 40%,var(--line));margin-top:14px}
.banner.err{background:color-mix(in srgb,var(--critical) 14%,var(--surface-1));border-color:color-mix(in srgb,var(--critical) 40%,var(--line))}
.banner.info{background:color-mix(in srgb,var(--accent) 12%,var(--surface-1));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
/* Übersicht */
table.kt{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
table.kt th{font-size:12px;font-weight:500;color:var(--text-muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:help}
table.kt td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
table.kt td b{font-size:16px}
svg.i.tiny{width:12px;height:12px;opacity:.7}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--text-muted);display:flex;gap:5px;align-items:center}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px}
.kpi .v small{font-size:12px;font-weight:500;color:var(--text-muted)}
.kpi .dlt{font-size:12px;font-weight:600}
.dlt.up{color:var(--good)}.dlt.down{color:var(--critical)}.dlt.flat{color:var(--text-muted)}
.kpi .h{font-size:11.5px;color:var(--text-muted);margin-top:4px;line-height:1.35}
.stk{display:grid;grid-template-columns:150px 1fr auto;gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.stk:first-child{border-top:none}
.stk img{width:150px;height:100px;object-fit:cover;border-radius:8px;background:#000;cursor:zoom-in;display:block}
.stk .noimg{width:150px;height:100px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;color:var(--text-muted);font-size:12px}
.chartbox{position:relative;height:260px;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:none;padding:5px 10px;cursor:pointer;color:var(--text-secondary);font-size:12.5px}
.seg button.on{background:var(--surface-3);color:var(--text-primary);font-weight:600}
.copt{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;align-items:start}
.copt:hover{background:var(--surface-2)}
.copt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface-1))}
.copt.bad{opacity:.7}
.copt input{margin-top:3px;accent-color:var(--accent)}
.copt .r{font-size:12.5px;color:var(--text-muted)}
.calres{border-radius:8px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
/* Checkliste */
.cl{display:grid;gap:2px;margin-top:8px}
.cli{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 6px;border-radius:8px;cursor:pointer;align-items:start}
.cli:hover{background:var(--surface-2)}
.cli input{width:18px;height:18px;margin-top:2px;accent-color:var(--good)}
.cli.ok .t{text-decoration:line-through;color:var(--text-muted)}
.cli .t{font-weight:600}
.cli .tool{font-size:12.5px;color:var(--accent);font-weight:500}
.cli .w{font-size:12.5px;color:var(--text-muted)}
.phase{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:16px 0 4px;font-weight:600}
dialog{background:var(--surface-1);color:var(--text-primary);border:1px solid var(--line);border-radius:12px;padding:0;width:min(640px,94vw)}
dialog.wide{width:min(1400px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .hd{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
dialog .bd{padding:16px 20px;display:grid;gap:14px;max-height:72vh;overflow:auto}
dialog .ft{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
dialog img.full{width:100%;display:block;background:#000}
.field label{display:block;font-weight:500;margin-bottom:4px}
.field .d{font-size:12.5px;color:var(--text-muted);margin-top:3px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line);border-radius:8px;padding:9px 16px;box-shadow:0 6px 24px rgba(0,0,0,.3);z-index:9;max-width:90vw}
.toast.err{border-color:var(--critical)}
.empty{text-align:center;padding:30px 10px;color:var(--text-muted)}
@media (max-width:760px){.main{grid-template-columns:1fr}aside{border-right:none;border-bottom:1px solid var(--line);max-height:180px}section.view{padding:16px}
  .run{grid-template-columns:auto 1fr}.run>.side{grid-column:1/-1;text-align:left!important}.stk{grid-template-columns:1fr}.nowbox{grid-template-columns:1fr}.eta{text-align:left}}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.5 2.5M16.5 16.5 19 19M5 19l2.5-2.5M16.5 7.5 19 5"/></svg>b2stacker</div>
  <div class="chips" id="chips"></div>
  <button class="btn icon" id="themeBtn" title="Hell/Dunkel" aria-label="Hell/Dunkel umschalten"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  <button class="btn" id="setBtn"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Einstellungen</button>
</header>
<div class="main">
  <aside>
    <button class="btn primary" style="width:100%;justify-content:center" id="newBtn">＋ Neue Analyse</button>
    <h3>Projekte</h3>
    <div id="projList"></div>
  </aside>
  <section class="view"><div class="wrap" id="view"></div></section>
</div>

<dialog id="setDlg">
  <div class="hd"><h2 style="margin:0">Einstellungen</h2><button class="btn icon" onclick="setDlg.close()">✕</button></div>
  <div class="bd" id="setBody"></div>
  <div class="ft"><button class="btn" onclick="setDlg.close()">Abbrechen</button><button class="btn primary" id="setSave">Speichern</button></div>
</dialog>
<dialog id="calDlg"><div class="hd"><h2 style="margin:0" id="calTitle"></h2><button class="btn icon" onclick="calDlg.close()">✕</button></div>
  <div class="bd" id="calBody"></div>
  <div class="ft"><button class="btn" onclick="calDlg.close()">Abbrechen</button><button class="btn primary" id="calSave">Übernehmen</button></div></dialog>
<dialog id="imgDlg" class="wide"><div class="hd"><b id="imgTitle"></b><button class="btn icon" onclick="imgDlg.close()">✕</button></div><img class="full" id="imgFull" alt=""></dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=1)=>v==null||isNaN(v)?'–':Number(v).toLocaleString('de-AT',{minimumFractionDigits:d,maximumFractionDigits:d});

let S=null, STEPS=null, cur={view:'new',project:null,tab:'overview'}, P=null, dirty=false, folders=[''], lastJobState=null;

async function api(path,body){
  const o=body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Astrostack':'1'},body:JSON.stringify(body)};
  const r=await fetch(path,o); const j=await r.json().catch(()=>({error:'Antwort unlesbar'}));
  if(!r.ok||j.error) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),err?7000:3000);}
const openDir=p=>api('/api/open',{path:p}).catch(e=>toast(e.message,true));
const dirLink=(p,label)=>`<button class="lnk" title="${esc(p)} – im Explorer öffnen" onclick='openDir(${JSON.stringify(p)})'>${ic('folder')}${esc(label||p.split(/[\\/]/).slice(-2).join('/'))}</button>`;

// ---------- Abfragen
async function refresh(){
  try{S=await api('/api/state');}catch(e){$('#chips').innerHTML=`<span class="chip"><span class="dot critical"></span>Programm nicht erreichbar – läuft das schwarze Fenster noch?</span>`;return;}
  if(!STEPS){try{STEPS=await api('/api/steps')}catch(e){STEPS={analyze:[],stack:[]}}}
  renderChips();renderProjects();
  const j=S.job, active=j&&['queued','running'].includes(j.state);
  if(j&&lastJobState&&['queued','running'].includes(lastJobState)&&!active) onJobFinished(j);
  lastJobState=j?j.state:null;
  if(cur.view==='job')renderJob();
  if(S.first_run&&!refresh.didFirst){refresh.didFirst=true;openSettings(true);}
}
async function pollSys(){
  try{
    const y=await api('/api/sys');
    Object.assign(S,{ram_free_gb:y.ram_free_gb,ram_total_gb:y.ram_total_gb,disk_free_gb:y.disk_free_gb,disk_total_gb:y.disk_total_gb,pixinsight_running:y.pixinsight_running});
    if(y.ram_free_gb!=null){ramHist.push(y.ram_free_gb);if(ramHist.length>60)ramHist.shift();}
    const wasActive=S.job&&['queued','running'].includes(S.job.state);
    if(y.job)S.job=Object.assign(S.job||{},y.job);
    renderChips(); updateMeters();
    if(y.job&&(cur.view==='job'||cur.view==='project'))renderJob();
    if(wasActive&&!y.job)await refresh();
  }catch(e){}
  setTimeout(pollSys,2500);
}
setInterval(refresh,15000);

function spark(vals,max){
  if(vals.length<2)return '';
  const w=56,h=18,mx=max||Math.max(...vals),pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-1-(v/mx)*(h-3)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function renderChips(){
  if(!S)return;
  $('#logo').title='Version '+S.version;
  const c=[];
  c.push(`<span class="chip" title="${esc(S.settings.pixinsight)}"><span class="dot ${S.pixinsight_ok&&S.wbpp_ok?'good':'critical'}"></span>PixInsight ${S.pixinsight_ok?(S.wbpp_ok?'bereit':'– WBPP fehlt'):'nicht gefunden'}</span>`);
  if(S.pixinsight_running&&S.pixinsight_running.length) c.push(`<span class="chip" title="Vor dem Stacken schließen"><span class="dot warning"></span>PixInsight offen (${S.pixinsight_running.length})</span>`);
  const ramPct=S.ram_total_gb?100*(1-S.ram_free_gb/S.ram_total_gb):0, ramLow=S.ram_free_gb!=null&&S.ram_free_gb<S.settings.min_free_ram_gb;
  c.push(`<span class="chip" title="Freier Arbeitsspeicher (Verlauf der letzten Minuten)">${ic('ram')}<b>${fmt(S.ram_free_gb,1)}</b> / ${fmt(S.ram_total_gb,0)} GB frei ${spark(ramHist,S.ram_total_gb)}<span class="dot ${ramLow?'warning':'good'}"></span></span>`);
  const dPct=S.disk_total_gb?100*(1-S.disk_free_gb/S.disk_total_gb):null;
  c.push(`<span class="chip" title="${esc(S.settings.workdir)}">${ic('disk')}<b>${fmt(S.disk_free_gb,0)}</b> GB frei ${dPct!=null?`<span class="minibar"><div style="width:${dPct}%;background:var(${dPct>90?'--critical':dPct>75?'--warning':'--good'})"></div></span>`:''}</span>`);
  const j=S.job; if(j&&['queued','running'].includes(j.state)){const p=j.progress||{};
    c.push(`<span class="chip" style="cursor:pointer" onclick="go('job')">${ic('clock')}${esc(j.title)} · ${esc(p.stage||'…')}${p.eta_s!=null?' · noch ~'+dur(p.eta_s):''}</span>`);}
  $('#chips').innerHTML=c.join('');
}
function renderProjects(){
  const L=S.projects;
  $('#projList').innerHTML=L.length?L.map(p=>`<button class="proj ${cur.project===p.name&&cur.view==='project'?'on':''}" data-n="${esc(p.name)}"><b>${esc(p.title)}</b>
    <span>${p.stacks?`<span>${ic('layers')} ${p.stacks} Stack${p.stacks>1?'s':''}</span>`:'<span>noch nicht gestackt</span>'}${p.last_stack?`<span>${dshort(p.last_stack)}</span>`:''}</span></button>`).join(''):'<div class="muted small" style="padding:4px 8px">Noch keine. Starte mit „Neue Analyse“.</div>';
  document.querySelectorAll('.proj').forEach(b=>b.onclick=()=>openProject(b.dataset.n));
}
function go(v){cur.view=v;render();}
function render(){
  renderProjects();
  if(cur.view==='new')return renderNew();
  if(cur.view==='job')return renderJob();
  if(cur.view==='project')return renderProject();
}

    <div class="step"><div class="num">3</div><div><button class="btn primary big" id="anBtn">${ic('play')} Analysieren</button>
      <div class="muted small" style="margin-top:6px">Liest nur – an den Originaldateien wird nichts verändert. Dauert je nach Menge einige Minuten.</div></div></div>

// ---------- Auftrag (Ablauf, aktueller Schritt, Restzeit)
function jobCard(j){
  const active=['queued','running'].includes(j.state);
  const p=j.progress||{};
  const defs=j.kind==='stack'?STEPS.stack:j.kind==='analyze'?STEPS.analyze:[{key:'quality',title:'Qualität messen',icon:'gauge',what:'Kennzahlen werden berechnet.',why:''}];
  let keys=j.kind==='stack'?(p.run_steps&&p.run_steps.length?p.run_steps:defs.map(d=>d.key)):defs.map(d=>d.key);
  const curKey=p.step||(j.kind==='quality'?'quality':null);
  const ci=keys.indexOf(curKey);
  const doneSet=new Set(p.steps_done||[]);
  const tl=keys.map((k,i)=>{const d=defs.find(x=>x.key===k)||{title:k,icon:'info'};
    const st=!active&&j.state==='done'?'done':(doneSet.has(k)||(ci>=0&&i<ci))?'done':(k===curKey&&active?'now':'');
    return `<div class="tl ${st}" title="${esc(d.what||'')}"><div class="ic">${st==='done'?ic('check'):ic(d.icon)}</div>${esc(d.title)}</div>`}).join('');
  const d=defs.find(x=>x.key===curKey);
  const pct=p.total?Math.round(100*p.done/p.total):null;
  const overall=keys.length?Math.round(100*((Math.max(ci,0))+(pct!=null?pct/100:0.3))/keys.length):null;
  const runInfo=j.kind==='stack'&&p.runs_total?`Lauf ${p.run_index} von ${p.runs_total}: <b>${esc(p.run||'')}</b> · `:'';
  const stateTxt={queued:'wartet',running:'läuft',done:'fertig',failed:'fehlgeschlagen',cancelled:'abgebrochen'}[j.state];
  return `<div class="card" id="jobCard">
    <div class="row"><div class="grow"><h2 style="margin:0">${ic(j.kind==='stack'?'layers':j.kind==='analyze'?'star':'gauge')} ${esc(j.title)}</h2>
      <div class="muted small">${runInfo}${stateTxt}${active&&overall!=null?` · Schritt ${Math.max(ci,0)+1} von ${keys.length}`:''}${!active&&j.finished?' · '+dt(j.finished):''}</div></div>
      ${active?`<button class="btn danger" id="cancelBtn">Abbrechen</button>`:''}</div>
    <div class="timeline">${tl}</div>
    ${active&&d?`<div class="nowbox"><div class="big-ic">${ic(d.icon)}</div>
      <div><b>${esc(d.title)}</b>${p.total?` <span class="muted">· ${p.done} von ${p.total}</span>`:''}${p.target?` <span class="muted">· ${esc(p.target)}</span>`:''}
        <div class="what">${esc(d.what)}</div><div class="why">Wozu: ${esc(d.why)}</div>
        <div class="progress ${pct==null?'indet':''}"><div style="width:${pct??0}%"></div></div></div>
      <div class="eta"><span class="muted small">noch ca.</span><b>${p.eta_s!=null?dur(p.eta_s):'…'}</b><span class="muted small">läuft seit ${dur(p.step_elapsed_s)}</span></div></div>`:''}
    ${j.state==='failed'?`<div class="banner err"><div class="grow"><b>Fehler:</b> ${esc(j.error)}</div></div>`:''}
    <details ${j.state==='failed'?'open':''}><summary class="muted small" style="cursor:pointer;margin-top:10px">Protokoll</summary><pre class="log" id="jobLog">${esc((j.log||[]).join('\n'))}</pre></details></div>`;
}
function renderJob(){
  const j=S&&S.job; if(!j){if(cur.view==='job')go('new');return;}
  const active=['queued','running'].includes(j.state);
  const openDet=$('#jobCard details')?.open;
  if(cur.view==='job'){
    $('#view').innerHTML=`<h1>${j.kind==='stack'?'Stacking':j.kind==='analyze'?'Analyse':'Kennzahlen'}</h1><div class="sub" style="margin-top:4px">${active?'Du kannst das Fenster offen lassen und nebenbei etwas anderes machen.':''}</div>`+jobCard(j)+
      (!active&&j.kind==='analyze'&&Array.isArray(j.result)&&j.result.length?`<div class="card"><h2>Ergebnis</h2>${j.result.map(r=>`<button class="btn primary" onclick="openProject('${esc(r.project)}')">${esc(r.target)} öffnen →</button> `).join('')}</div>`:'');
  }else{
    const slot=$('#jobSlot'); if(!slot)return;
    const mine=P&&(j.title||'').endsWith(P.plan.target);
    slot.innerHTML=(active&&mine)||(!active&&mine&&j.state==='failed')?jobCard(j):'';
  }
  if(openDet&&$('#jobCard details'))$('#jobCard details').open=true;
  const lg=$('#jobLog'); if(lg)lg.scrollTop=lg.scrollHeight;
  const cb=$('#cancelBtn'); if(cb)cb.onclick=async()=>{if(!confirm('Wirklich abbrechen?'))return;await api('/api/job/'+j.id+'/cancel',{});refresh();};
}
function onJobFinished(j){
  if(j.state==='done'&&j.kind==='analyze'&&Array.isArray(j.result)&&j.result.length===1){dirty=false;openProject(j.result[0].project);toast('Analyse fertig');}
  else if(j.state==='done'&&j.kind==='stack'){toast('Stacking fertig');if(cur.project){cur.tab='overview';openProject(cur.project);}}
  else if(j.state==='done'&&j.kind==='quality'){if(cur.project)openProject(cur.project);}
  else if(j.state==='failed')toast(j.kind==='stack'?'Stacking fehlgeschlagen':'Auftrag fehlgeschlagen',true);
}

// ---------- Projekt
async function openProject(name){
  const keepTab=cur.project===name?cur.tab:null;
  try{P=await api('/api/project/'+encodeURIComponent(name));}catch(e){toast(e.message,true);return;}
  cur={view:'project',project:name,tab:keepTab||(P.stacks.length?'overview':'plan')};
  render();
}

function needs(){const en=P.plan.runs.filter(r=>r.enabled!==false);return {gb:Math.max(0,...en.map(r=>r.gb||0))+2,ram:Math.max(0,...en.map(r=>r.ram_gb||0)),en};}
function meterHtml(icon,title,need,free,total,unit,sub){
  const ok=free==null||free>=need;
  const used=total?100*(1-(free||0)/total):null, needPct=total?100*need/total:null;
  return `<div class="muted small">${ic(icon)} ${esc(title)}</div>
    <div><span class="big">${fmt(free,free<10?1:0)} ${unit}</span> <span class="muted">frei · ${fmt(need,0)} ${unit} nötig</span></div>
    <div class="bar" title="belegt / frei">${used!=null?`<div style="width:${used}%;background:var(--surface-3);filter:brightness(1.6)"></div>`:''}
      ${needPct!=null&&used!=null?`<div style="position:absolute;left:${used}%;top:0;bottom:0;width:${Math.min(needPct,100-used)}%;background:var(${ok?'--good':'--critical'})"></div>`:''}</div>
    <div class="muted small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(sub)}">${ok?'✓ reicht':'✗ reicht nicht'} · ${esc(sub)}</div>`;
}
function updateMeters(){

  const n=needs();
  $('#mDisk').innerHTML=meterHtml('disk','Platz im Arbeitsverzeichnis',n.gb,S.disk_free_gb,S.disk_total_gb,'GB',S.settings.workdir);
  $('#mRam').innerHTML=meterHtml('ram','Arbeitsspeicher',n.ram,S.ram_free_gb,S.ram_total_gb,'GB','gesamt '+fmt(S.ram_total_gb,0)+' GB');
  const active=S.job&&['queued','running'].includes(S.job.state);
  const bl=[],wn=[];
  if(!S.pixinsight_ok)bl.push('PixInsight wurde nicht gefunden – Pfad in den Einstellungen prüfen.');
  else if(!S.wbpp_ok)bl.push('WBPP-Skript nicht gefunden – PixInsight-Installation prüfen.');
  if(S.pixinsight_running&&S.pixinsight_running.length)bl.push('PixInsight ist geöffnet – bitte schließen, sonst teilen sich zwei Instanzen den Arbeitsspeicher.');
  if(S.disk_free_gb!=null&&S.disk_free_gb<n.gb)bl.push(`Zu wenig Platz: ${fmt(n.gb,0)} GB nötig, ${fmt(S.disk_free_gb,0)} GB frei.`);
  if(!n.en.length)bl.push('Kein Lauf ausgewählt.');
  if(active)bl.push('Es läuft gerade ein Auftrag.');
  if(S.ram_free_gb!=null&&S.ram_free_gb<Math.min(n.ram,S.settings.min_free_ram_gb))wn.push(`Wenig freier Arbeitsspeicher (${fmt(S.ram_free_gb,1)} GB). Andere Programme schließen.`);
  n.en.forEach(r=>{if(!r.flats.length)wn.push(`${r.name}: keine passenden Flats.`);else if(!r.flat_ok)wn.push(`${r.name}: Flats haben ein Problem – siehe Bericht.`);if(!r.bias.length)wn.push(`${r.name}: kein Bias – Flats werden ungenauer kalibriert.`);});
  const gb=$('#goBox'); if(!gb)return;
  const html=`<div class="msg">${bl.length?bl.map(x=>'⛔ '+esc(x)).join('<br>'):wn.length?wn.map(x=>'⚠ '+esc(x)).join('<br>'):'✓ Alles bereit. PixInsight läuft unsichtbar im Hintergrund, der PC bleibt wach. Fertige Dateien heißen z. B. <code>'+esc(P.plan.target.replace(/[^\w-]/g,''))+'_'+esc(n.en[0]?.name||'RGB')+'_'+new Date().toISOString().slice(0,10)+'_'+fmt(n.en[0]?.hours,1).replace(',','.')+'h.xisf</code>'}</div>
    <button class="btn primary big" id="goBtn" ${bl.length?'disabled':''}>${ic('play')} Los – stacken</button>`;
  if(gb.dataset.h!==html){gb.innerHTML=html;gb.dataset.h=html;
    $('#goBtn').onclick=async()=>{
      if(dirty&&!confirm('Du hast Frames ein-/ausgeschlossen, der Plan ist aber noch nicht neu berechnet. Trotzdem mit dem alten Plan stacken?'))return;
      $('#goBtn').disabled=true;try{await api('/api/project/'+encodeURIComponent(cur.project)+'/stack',{});await refresh();renderJob();
        document.querySelector('section.view').scrollTo({top:0,behavior:'smooth'});}catch(e){toast(e.message,true);$('#goBtn').disabled=false}};}
}
function renderDirty(){
  const s=$('#dirtySlot'); if(!s)return;
  s.innerHTML=dirty?`<div class="banner"><div class="grow">Frame-Auswahl geändert. Plan neu berechnen, damit die Änderung beim Stacken zählt (Messwerte bleiben erhalten, geht schnell).</div><button class="btn primary" id="dirtyBtn">Plan aktualisieren</button></div>`:'';
  const b=$('#dirtyBtn'); if(b)b.onclick=()=>$('#reBtn').click();
}
async function savePlan(edits){
  try{const plan=await api('/api/project/'+encodeURIComponent(cur.project)+'/plan',edits);P.plan=plan;renderTab();}catch(e){toast(e.message,true)}
}

// ---------- Kalibrierdaten wählen
const KNAME={flats:'Flats',bias:'Bias',darks:'Darks',darkflats:'Dark-Flats'};
const KHELP={flats:'Flats korrigieren Vignettierung und Staub. Gleicher Filter, Fokus und Kamera-Drehung wie die Lights, am besten aus derselben Session.',
  bias:'Bias (0-s-Aufnahmen) liefern das Ausleserauschen-Muster und kalibrieren die Flats. Gleicher Gain, Offset und Auslesemodus.',
  darks:'Darks (gleiche Belichtung und Temperatur wie die Lights) entfernen Hotpixel und Verstärkerglühen. Ohne Darks übernimmt die Rejection die Hotpixel – dank Dithering.',
  darkflats:'Dark-Flats (gleiche Belichtung wie die Flats) ersetzen Bias bei langen Flat-Belichtungen. Meist nicht nötig.'};
const manBadge=(r,k)=>(r.calib_manual||{})[k]?`<span class="badge neutral" title="von dir geändert">${ic('edit','tiny')} ${esc(r.calib_manual[k])}</span>`:'';
let calState=null;
function openCalib(run,kind){
  const ch=(run.calib_choices||{})[kind]||[];
  const curPaths=run[kind]||[], curSet=run[{flats:'flat_set',bias:'bias_set',darks:'dark_set',darkflats:'darkflat_set'}[kind]];
  const auto=ch.find(c=>c.usable);
  const manual=(run.calib_manual||{})[kind];
  const match=ch.find(c=>c.folder===curSet&&c.frames===curPaths.length);
  let sel=manual==='keine'?'none':manual==='eigener Ordner'?'folder':(!manual||!match||match===auto)?'auto':match.id;
  calState={run,kind,sel,folder:manual==='eigener Ordner'?curSet:'',inspect:null};
  $('#calTitle').textContent=KNAME[kind]+' für '+run.name;
  renderCalib(ch,auto);
  calDlg.showModal();
}
function renderCalib(ch,auto){
  const st=calState,k=st.kind;
  const opt=(id,title,sub,bad)=>`<label class="copt ${st.sel===id?'sel':''} ${bad?'bad':''}"><input type="radio" name="cal" value="${esc(id)}" ${st.sel===id?'checked':''}><div>${title}${sub?`<div class="r">${sub}</div>`:''}</div></label>`;
  $('#calBody').innerHTML=`<div class="muted small">${ic('info')} ${esc(KHELP[k])}</div>
    ${opt('auto',`<b>Vorschlag des Programms</b>${auto?` · ${esc(auto.label)} · ${auto.frames} Frames`:' · keine passenden gefunden'}`,'Wird bei jeder Neu-Analyse automatisch neu gewählt.')}
    ${ch.filter(c=>c!==auto).map(c=>opt(c.id,`${esc(c.label)} · <b>${c.frames}</b> Frames${c.sky?'':''}${c.verdict==='critical'?' <span class="badge critical">Problem</span>':c.verdict==='warning'?' <span class="badge warning">Hinweis</span>':''}`,
      (c.usable?'':'⚠ passt nicht: ')+esc((c.reasons||[]).filter(x=>!/unbekannt/.test(x)).join('; ')||'passt'),!c.usable)).join('')}
    ${opt('none','<b>Keine verwenden</b>',k==='bias'?'Nicht empfohlen – Flats werden dann ungenauer kalibriert.':k==='flats'?'Nicht empfohlen – Vignettierung und Staub bleiben im Bild.':'')}
    ${opt('folder','<b>Eigenen Ordner wählen …</b>','Alle FITS/XISF darin werden als '+KNAME[k]+' verwendet (auch wenn der Header anderes sagt).')}
    ${st.sel==='folder'?`<div class="frow"><input type="text" id="calFolder" value="${esc(st.folder||'')}" placeholder="Ordner mit ${KNAME[k]}"><button class="btn" id="calPick">Durchsuchen …</button><button class="btn" id="calCheck">Prüfen</button></div>
      <div id="calRes">${st.inspect?calResHtml(st.inspect):''}</div>`:''}`;
  $('#calBody').querySelectorAll('input[name=cal]').forEach(r=>r.onchange=()=>{st.sel=r.value;renderCalib(ch,auto)});
  const pick=$('#calPick'); if(pick)pick.onclick=async()=>{try{const r=await api('/api/pick-folder',{initial:st.folder||''});if(r.path){st.folder=r.path;await inspectCal();renderCalib(ch,auto);}}catch(e){toast(e.message,true)}};
  const chk=$('#calCheck'); if(chk)chk.onclick=async()=>{st.folder=$('#calFolder').value.trim();await inspectCal();renderCalib(ch,auto);};
  const fi=$('#calFolder'); if(fi)fi.onchange=()=>{st.folder=fi.value.trim();st.inspect=null;};
}
async function inspectCal(){
  const st=calState;
  try{st.inspect=await api('/api/project/'+encodeURIComponent(cur.project)+'/calib-inspect',{run:st.run.name,kind:st.kind,folder:st.folder});}
  catch(e){st.inspect={error:e.message};}
}
function calResHtml(r){
  if(r.error)return `<div class="calres" style="border-color:var(--critical)">✗ ${esc(r.error)}</div>`;
  return `<div class="calres" style="border-color:var(${r.ok?(r.warnings.length?'--warning':'--good'):'--critical'})"><b>${r.ok?'✓':'✗'} ${r.frames} Dateien</b> · erkannt: ${esc(Object.entries(r.types).map(([t,n])=>n+'× '+t).join(', '))}
    ${r.problems.map(x=>`<div style="color:var(--critical)">✗ ${esc(x)}</div>`).join('')}${r.warnings.map(x=>`<div class="muted">⚠ ${esc(x)}</div>`).join('')}
    ${!r.ok?'<div class="muted">Passt nicht zu den Lights – WBPP würde diese Dateien wahrscheinlich ignorieren oder falsch kalibrieren.</div>':''}</div>`;
}
$('#calSave').onclick=async()=>{
  const st=calState; let choice=st.sel;
  if(choice==='folder'){
    st.folder=($('#calFolder')||{}).value?.trim()||st.folder;
    if(!st.folder)return toast('Bitte einen Ordner wählen',true);
    if(!st.inspect||st.inspect.folder!==st.folder)await inspectCal();
    if(st.inspect.error)return renderCalib((st.run.calib_choices||{})[st.kind]||[],((st.run.calib_choices||{})[st.kind]||[]).find(c=>c.usable));
    if(!st.inspect.ok&&!confirm('Der Ordner passt nicht zu den Lights:\n'+st.inspect.problems.join('\n')+'\n\nTrotzdem verwenden?'))return;
    choice={folder:st.folder};
  }else if(choice!=='auto'&&choice!=='none'){
    const c=((st.run.calib_choices||{})[st.kind]||[]).find(x=>x.id===choice);
    if(c&&!c.usable&&!confirm('Dieser Satz passt laut Prüfung nicht:\n'+c.reasons.join('\n')+'\n\nTrotzdem verwenden?'))return;
  }
  calDlg.close();
  await savePlan({runs:{[st.run.name]:{calib:{[st.kind]:choice}}}});
  toast(KNAME[st.kind]+' für '+st.run.name+' geändert');
};

// ---------- Bearbeitungs-Checkliste
function renderChecklist(b){
  const done=P.meta.checklist||{}, L=P.checklist, n=L.filter(x=>done[x.key]).length;
  const grp=ph=>L.filter(x=>x.phase===ph).map(x=>`<label class="cli ${done[x.key]?'ok':''}"><input type="checkbox" data-ck="${x.key}" ${done[x.key]?'checked':''}>
    <div><div class="t">${esc(x.title)}</div><div class="tool">${esc(x.tool)}</div><div class="w">${esc(x.why)}</div></div></label>`).join('');
  b.innerHTML=`<div class="card"><div class="row"><h2 class="grow" style="margin:0">${ic('list')} Bearbeitung in PixInsight – Reihenfolge</h2>
      <span class="badge ${n===L.length?'good':'neutral'}">${n} / ${L.length} erledigt</span><button class="btn sm" id="ckReset">zurücksetzen</button></div>
    <div class="progress"><div style="width:${100*n/L.length}%;background:var(--good)"></div></div>
    <div class="muted small">Faustregel: Alles, was misst (Verläufe, Farbe, Schärfe, Rauschen), passiert <b>linear</b> – vor dem Strecken. Danach wird gestaltet. Die Liste passt sich an die Ergebnisse an (${esc([...new Set(P.stacks.flatMap(s=>s.outputs.map(o=>o.name)))].join(', ')||P.plan.runs.map(r=>r.name).join(', '))}).</div>
    <div class="phase">1 · Linear (vor dem Strecken)</div><div class="cl">${grp('linear')}</div>
    <div class="phase">2 · Nach dem Strecken</div><div class="cl">${grp('nonlinear')}</div></div>`;
  b.querySelectorAll('[data-ck]').forEach(c=>c.onchange=async()=>{const d=Object.assign({},P.meta.checklist||{});if(c.checked)d[c.dataset.ck]=new Date().toISOString().slice(0,10);else delete d[c.dataset.ck];
    try{P=await api('/api/project/'+encodeURIComponent(cur.project)+'/meta',{checklist:d});renderChecklist(b);}catch(e){toast(e.message,true)}});
  $('#ckReset').onclick=async()=>{if(!confirm('Alle Haken entfernen?'))return;P=await api('/api/project/'+encodeURIComponent(cur.project)+'/meta',{checklist:{}});renderChecklist(b);};
}

// ---------- Einstellungen
const SETF=[
  ['workdir','Arbeitsverzeichnis','text','Hier landen Zwischendateien, Berichte, Stacks und die Historie. Am besten eine schnelle, große Platte – nicht OneDrive.',true],
  ['pixinsight','PixInsight-Programm','text','Pfad zu PixInsight.exe',false],
  ['analysis_workers','Gleichzeitige Vermessungen','number','Mehr = schneller, braucht aber mehr Arbeitsspeicher (je ~1 GB).'],
  ['min_free_ram_gb','Mindestens freier Arbeitsspeicher (GB)','number','Darunter startet das Stacking nicht – schützt vor Abstürzen.'],
  ['keep_awake','PC während des Stackens wach halten','bool','Verhindert den Energiesparmodus (sonst kann ein Lauf Stunden länger dauern).'],
  ['cleanup_intermediate','Zwischendateien nach jedem Lauf löschen','bool','Spart sehr viel Platz. Masters, Stacks und Protokolle bleiben.'],
  ['open_results','Ergebnisse am Ende in PixInsight öffnen','bool',''],
  ['timezone','Zeitzone','text','Für Nächte und Himmelsdiagramme, z. B. Europe/Vienna.'],
];
function openSettings(first){
  const s=S.settings;
  $('#setBody').innerHTML=(first?`<div class="banner info" style="margin:0"><div>Willkommen! Bitte kurz prüfen: Wo soll gearbeitet werden, und wo ist PixInsight installiert?</div></div>`:'')+
    SETF.map(([k,l,t,d,pick])=>t==='bool'?`<label class="opt"><span class="switch"><input type="checkbox" data-k="${k}" ${s[k]?'checked':''}><span></span></span><span><div class="t">${l}</div><div class="d">${d}</div></span></label>`:
    `<div class="field"><label>${l}</label><div class="frow"><input type="${t}" data-k="${k}" value="${esc(s[k])}">${pick?`<button class="btn" data-pickset="${k}">Durchsuchen …</button>`:''}</div>${d?`<div class="d">${d}</div>`:''}</div>`).join('')+
    `<div class="muted small">Gespeichert in ${esc(S.settings_file)} · Version ${esc(S.version)}</div>`;
  document.querySelectorAll('[data-pickset]').forEach(b=>b.onclick=async()=>{const inp=document.querySelector(`[data-k="${b.dataset.pickset}"]`);try{const r=await api('/api/pick-folder',{initial:inp.value});if(r.path)inp.value=r.path;}catch(e){toast(e.message,true)}});
  setDlg.showModal();
}
$('#setSave').onclick=async()=>{
  const d={};document.querySelectorAll('#setBody [data-k]').forEach(i=>{const f=SETF.find(x=>x[0]===i.dataset.k);d[i.dataset.k]=f[2]==='bool'?i.checked:f[2]==='number'?Number(i.value):i.value.trim();});
  try{const r=await api('/api/settings',d);S=r;setDlg.close();toast('Gespeichert');
    if(r.move_offer&&r.move_offer.projects.length&&confirm(`Im bisherigen Arbeitsverzeichnis\n${r.move_offer.old}\nliegen ${r.move_offer.projects.length} Projekt(e): ${r.move_offer.projects.join(', ')}.\n\nIns neue Arbeitsverzeichnis verschieben?`)){
      const mv=await api('/api/move-projects',{old:r.move_offer.old,projects:r.move_offer.projects});toast(mv.moved.length+' Projekt(e) verschoben');}
    await refresh();render();}catch(e){toast(e.message,true)}
};
$('#setBtn').onclick=()=>openSettings(false);
$('#newBtn').onclick=()=>{cur={view:'new',project:null,tab:'overview'};render();};

refresh().then(()=>{pollSys();if(S&&S.job&&['queued','running'].includes(S.job.state))cur.view='job';else if(S&&S.projects.length)return openProject(S.projects[0].name);render();});
</script>
