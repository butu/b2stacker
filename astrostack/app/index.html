<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>b2stacker</title>
<link rel="stylesheet" href="/static/photoswipe.css">
<style>
:root{
  color-scheme:dark;
  /* Design-Tokens (b2stacker Design, Adwaita dunkel) */
  --bg:#0b0b0c;--card:#111113;--tab:#0f0f11;--pop:#141416;--sheet:#1c1c1c;
  --card-line:#222225;--div:#1f1f22;--ring:#26262a;
  --fill:rgba(255,255,255,.08);--fill-2:rgba(255,255,255,.12);--panel:rgba(255,255,255,.07);
  --accent:#3584e4;--info:#78aeed;--info-2:#99c1f1;
  --ok:#8ff0a4;--warn:#f8e45c;--err:#ff938c;
  --ok-bg:rgba(38,162,105,.22);--warn-bg:rgba(205,147,9,.25);--err-bg:rgba(192,28,40,.25);--info-bg:rgba(53,132,228,.25);
  --qa:#26a269;--qc:#cd9309;
  --shadow-pop:0 0 0 1px #26262a,0 12px 32px rgba(0,0,0,.6);
  --shadow-modal:0 0 0 1px #26262a,0 20px 48px rgba(0,0,0,.6);
  /* Aliase für ältere Stellen im Code */
  --text-primary:#fff;--text-secondary:rgba(255,255,255,.75);--text-muted:rgba(255,255,255,.55);
  --line:#1f1f22;--surface-1:#111113;--surface-2:rgba(255,255,255,.06);--surface-3:rgba(255,255,255,.1);
  --good:#8ff0a4;--warning:#f8e45c;--critical:#ff938c;
  --s1:#78aeed;--s2:#ffa348;--s3:#8ff0a4;--s4:#f8e45c;--s5:#dc8add;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
/* UI-Zoom: html wird skaliert, Höhen werden zurückgerechnet, damit alles genau ins Fenster passt */
:root{--z:1}
html{zoom:var(--z)}
html,body{margin:0;background:var(--bg);color:#fff}
body{height:calc(100vh / var(--z));display:flex;flex-direction:column;
  font:15px/1.45 "SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.45)}
a{color:#fff;text-decoration:none}
code{font-family:var(--mono);font-size:.92em;background:var(--fill);padding:1px 5px;border-radius:4px}
svg.i{width:16px;height:16px;flex:none;fill:currentColor;vertical-align:-3px}
svg.i.st{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.tiny{width:12px;height:12px;vertical-align:-1px}
svg.i.s14{width:14px;height:14px}
svg.i.s18{width:18px;height:18px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{opacity:.6}
.small{font-size:13px}
.mono{font-family:var(--mono)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--ok)}.warnc{color:var(--warn)}.errc{color:var(--err)}.infoc{color:var(--info)}

/* ---------- Knöpfe, Felder */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 12px;border:0;border-radius:6px;background:var(--fill);color:#fff;
  font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--fill-2)}
.btn.primary{background:#fff;color:#0b0b0c;font-weight:700}
.btn.primary:hover{background:#e6e6e6}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--fill)}
.btn.outline{background:transparent;box-shadow:inset 0 0 0 1px var(--ring)}
.btn.outline:hover{background:rgba(255,255,255,.06)}
.btn.icon{width:34px;padding:0}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.sm.icon{width:28px;padding:0}
.btn.big{height:40px;padding:0 24px;border-radius:999px;font-size:15px;font-weight:700}
.btn.danger{color:var(--err)}
.btn.dangerfill{background:var(--err-bg);color:var(--err);font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary:disabled{background:rgba(255,255,255,.25);color:rgba(11,11,12,.8)}
.lnk{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;color:var(--info);font-weight:700;cursor:pointer;font-size:14px}
.lnk:hover{text-decoration:underline}
.lnk.plain{color:inherit;font-weight:500}
input[type=text],input[type=number],input[type=search],select,textarea{height:34px;padding:0 10px;border:0;border-radius:6px;background:var(--fill);color:#fff;
  font-size:14px;outline:0;color-scheme:dark}
select{cursor:pointer;padding:0 8px}
textarea{height:auto;min-height:96px;padding:10px 12px;line-height:1.5;resize:vertical;width:100%}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 2px rgba(53,132,228,.6)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:13px;opacity:.6}
.field .d{font-size:13px;opacity:.6;text-wrap:pretty}
.frow{display:flex;gap:8px}
.frow input{flex:1;min-width:0}
.kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:5px;background:var(--fill-2);box-shadow:inset 0 -1px 0 rgba(0,0,0,.4);
  font:700 12px var(--mono)}
/* Schalter (Adwaita) */
.switch{position:relative;width:42px;height:24px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.15);cursor:pointer;transition:background .15s}
.switch span:before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:#fff;transition:left .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{left:21px}
.switch input:focus-visible+span{box-shadow:0 0 0 2px rgba(53,132,228,.6)}
/* Segmente */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:8px;background:rgba(255,255,255,.06)}
.seg button{height:30px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#fff;font-size:13.5px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--fill-2);font-weight:700}
.seg button:hover:not(.on){background:rgba(255,255,255,.05)}
/* Marken, Pillen */
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;background:var(--fill);font-size:12.5px;font-weight:700;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.ok,.badge.good{background:var(--ok-bg);color:var(--ok)}
.pill.warn,.badge.warning{background:var(--warn-bg);color:var(--warn)}
.pill.err,.badge.critical{background:var(--err-bg);color:var(--err)}
.pill.info{background:var(--info-bg);color:var(--info-2)}
.pill.neutral,.badge.neutral{background:var(--fill);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);flex:none;display:inline-block}
.dot.good{background:var(--ok)}.dot.warning{background:var(--warn)}.dot.critical{background:var(--err)}
/* Filter-Symbole */
.fic{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.fic.lg{width:20px;height:20px;border-radius:5px;vertical-align:-5px}
.fsw{width:44px;height:44px;flex:none;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.ftag{display:inline-flex;align-items:center;gap:6px;font-weight:700}

/* ---------- Kopfzeile */
header.hb{flex:none;position:relative;z-index:20;height:47px;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--bg);box-shadow:0 1px 0 var(--div)}
.wordmark{padding:0 10px;font-weight:700;font-size:16px;letter-spacing:-.01em;cursor:pointer;white-space:nowrap}
.hbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#fff;font-size:14px;cursor:pointer;white-space:nowrap;min-width:0}
.hbtn:hover{background:rgba(255,255,255,.1)}
.hbtn.dim{color:rgba(255,255,255,.7)}
.hbtn.icon{width:34px;padding:0;justify-content:center}
.hpill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:0;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.hpill.warn{background:var(--warn-bg);color:var(--warn)}
.hpill.err{background:var(--err-bg);color:var(--err)}
.hpill.upd{background:var(--ok-bg);color:var(--ok)}
#updBtn[hidden]{display:none}
.minibar{width:48px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden;flex:none}
.minibar>span{display:block;height:100%;background:var(--accent)}
/* Popover */
#popBack{position:fixed;inset:0;z-index:25}
#popBack[hidden],.pop[hidden]{display:none}
.pop{position:fixed;z-index:30;background:var(--pop);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;display:flex;flex-direction:column;max-width:calc(100vw - 16px)}
.pop .mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:14px;cursor:pointer;border:0;background:none;color:inherit;text-align:left;width:100%}
.pop .mi:hover{background:rgba(255,255,255,.1)}
.pop .mi.danger{color:var(--err)}
.pop .mi.sel::after{content:"";margin-left:auto}
.pop .sep{height:1px;background:var(--fill);margin:4px 6px}
.pop{max-height:min(70vh,520px);overflow:auto}
.pop .mi:disabled{opacity:.4;cursor:default}
.pop .mi:focus-visible{outline:2px solid rgba(53,132,228,.6);outline-offset:-2px}
/* Auswahllisten im App-Stil statt nativer Dropdowns */
select[data-ui]{display:none!important}
.sel{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;height:34px;padding:0 10px 0 12px;border:0;border-radius:6px;background:var(--fill);color:#fff;
  font-size:14px;cursor:pointer;max-width:100%;min-width:0;text-align:left}
.sel:hover{background:var(--fill-2)}
.sel:focus-visible{box-shadow:0 0 0 2px rgba(53,132,228,.6);outline:0}
.sel:disabled{opacity:.4;cursor:not-allowed}
.sel svg{opacity:.6;flex:none}
.fbar .sel{height:32px;font-size:13.5px}
.qrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:6px}
.qrow .qt{font-size:14px}.qrow .qd{font-size:12.5px;opacity:.6}
.qnum{width:20px;height:20px;border-radius:999px;background:var(--fill);display:grid;place-items:center;font-size:11.5px;font-weight:700}
.pop .zrow{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 8px 10px;font-size:14px}
.pop .zrow button{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;color:#fff;cursor:pointer}
.pop .zrow button:hover{background:rgba(255,255,255,.1)}
.pop .zrow span{min-width:48px;text-align:center;cursor:pointer}
.sysrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px}
.sysrow .l{font-size:14px}.sysrow .d{font-size:12.5px;opacity:.6}.sysrow .s{font-size:13px;font-weight:700}
.jobpop{padding:14px 16px;gap:10px;width:320px}
.bar6{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar6>div{height:100%;background:var(--accent);transition:width .5s}

/* ---------- Layout */
.main{flex:1;display:flex;min-height:0}
nav.side{flex:0 0 260px;background:var(--bg);border-right:1px solid var(--div);overflow:auto;padding:12px 8px;display:flex;flex-direction:column;gap:10px}
.sbar{display:flex;align-items:center;gap:6px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:6px;background:var(--fill)}
.search svg{opacity:.6}
.search input{flex:1;min-width:0;height:auto;padding:0;border:0;background:transparent;box-shadow:none!important;font-size:14px}
.nlist{display:flex;flex-direction:column;gap:2px}
.nitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:#fff;font-size:14.5px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.nitem:hover{background:var(--fill)}
.nitem.on{background:rgba(255,255,255,.1)}
.nitem svg{opacity:.75}
.ndiv{height:1px;background:var(--fill);margin:4px 6px}
.proj{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:6px;cursor:pointer;border:0;background:transparent;color:#fff;text-align:left;width:100%}
.proj:hover{background:var(--fill)}
.proj.on{background:rgba(255,255,255,.1)}
.proj .pn{display:flex;align-items:center;justify-content:space-between;gap:8px}
.proj b{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .ps{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;font-size:12.5px;color:rgba(255,255,255,.6)}
.proj .ps span{display:inline-flex;align-items:center;gap:4px}
section.view{flex:1;min-width:0;overflow:auto;padding:28px 24px 96px}
.wrap{width:100%;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.wrap.wide{max-width:1160px;gap:20px}

/* ---------- Typografie & Abschnitte */
h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
h3{margin:0;font-size:17px;font-weight:700}
.sub{margin:0;font-size:14px;opacity:.65;text-wrap:pretty}
.sec{display:flex;flex-direction:column;gap:12px}
.sechd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px}
.sechd>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.secs{display:flex;flex-direction:column;gap:52px;padding-top:12px}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:12px}
.panel{background:var(--panel);border-radius:12px}
.clickable{cursor:pointer;transition:background .15s}
.card.clickable:hover{background:rgba(255,255,255,.09)}
.panel.clickable:hover{background:rgba(255,255,255,.09)}
.empty{background:var(--tab);border-radius:12px;padding:48px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.empty .t{font-size:18px;font-weight:700}
.empty .x{font-size:14px;opacity:.7;max-width:420px;text-wrap:pretty}
.chev{display:inline-flex;opacity:.6;transition:transform .15s}
.chev.open{transform:rotate(180deg)}
.facts3{display:flex;gap:28px;font-variant-numeric:tabular-nums}
.facts3>div{display:flex;flex-direction:column;gap:1px;min-width:64px}
.facts3 span{font-size:12px;opacity:.55}
.facts3 b{font-size:20px;font-weight:700;white-space:nowrap}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;border-radius:12px;padding:12px 12px 12px 16px;background:var(--card);border:1px solid var(--card-line)}
.banner.warn{background:rgba(205,147,9,.18);border:0}
.banner.err{background:rgba(192,28,40,.2);border:0}
.banner.info{background:var(--card)}
.banner .bt{font-weight:700}
.banner .bx{font-size:14px;opacity:.8}

/* ---------- Startseite */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{background:var(--card);border:1px solid var(--card-line);border-radius:12px;overflow:visible;cursor:pointer;display:flex;flex-direction:column;transition:background .15s;text-align:left;padding:0;color:#fff}
.tile:hover{background:rgba(255,255,255,.11)}
.tile .ph{aspect-ratio:3/2;background:#0f0f0f center/cover no-repeat;position:relative;border-radius:11px 11px 0 0;display:grid;place-items:center;color:rgba(255,255,255,.3)}
.tile .ph>svg{width:36px;height:36px}
.tile .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.tile .tn{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tile .tn b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tn span{font-size:12.5px;opacity:.5;white-space:nowrap}
.tile .tm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:13px;color:rgba(255,255,255,.7)}
.tile .tm>span{position:relative;display:flex;align-items:center;gap:5px;cursor:help}
.tile .tc{position:relative;align-self:flex-start;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;cursor:help}
.tile.new{border:1px dashed rgba(255,255,255,.2);background:transparent;min-height:200px;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;color:rgba(255,255,255,.75)}
.tile.new:hover{background:rgba(255,255,255,.05);color:#fff}
.plus{width:44px;height:44px;border-radius:999px;background:var(--fill);display:grid;place-items:center}
.abadge{position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(15,15,15,.85);color:var(--info-2);font-size:12.5px;font-weight:700}
/* Hover-Erklärungen */
.tip{display:none;position:absolute;left:-8px;bottom:calc(100% + 8px);z-index:15;width:260px;background:var(--pop);border-radius:12px;padding:12px 14px;box-shadow:0 0 0 1px #26262a,0 6px 24px rgba(0,0,0,.5);
  flex-direction:column;gap:6px;color:#fff;cursor:default;white-space:normal;font-weight:400;text-align:left}
.tip.below{bottom:auto;top:calc(100% + 6px)}
.tip b{font-size:14px}
.tip .tt{font-size:13.5px;opacity:.8;text-wrap:pretty}
.tip .tg{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ok)}
.tip .tf{font-size:12.5px;opacity:.6;text-wrap:pretty}
.hastip:hover>.tip{display:flex}

/* ---------- Projektkopf */
.phead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 20px}
.phead .pl{display:flex;flex-direction:column;gap:4px;min-width:0}
.phead .pt{display:flex;align-items:center;gap:8px;min-width:0}
.phead .pdesc{margin:2px 0;max-width:70ch;font-size:15px;opacity:.8;text-wrap:pretty;white-space:pre-line}
.phead .pmeta{font-size:14px;opacity:.6}
.phead .pa{display:flex;align-items:center;gap:6px;position:relative}
.editbtn{width:32px;height:32px;flex:none;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;color:rgba(255,255,255,.55);cursor:pointer}
.editbtn:hover{background:var(--fill);color:#fff}
/* Bereichsumschalter */
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tabc{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:12px;background:var(--tab);box-shadow:inset 0 0 0 1px var(--card-line);color:#fff;text-align:left;cursor:pointer;min-width:0}
.tabc:hover:not(:disabled){background:rgba(255,255,255,.1)}
.tabc.on{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85)}
.tabc:disabled{opacity:.45;cursor:not-allowed}
.tabc .ti{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--fill);color:#fff}
.tabc.on .ti{background:#fff;color:#0b0b0c}
.tabc .tlab{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.tabc .tlab b{font-size:15px}
.tabc .tlab span{font-size:13px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Übersicht */
.hint{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 16px;border-radius:12px;background:var(--card);border:1px solid var(--card-line);cursor:pointer;color:#fff;text-align:left;width:100%}
.hint:hover{background:rgba(53,132,228,.2)}
.hint .hx{flex:1 1 300px;min-width:0;font-size:14.5px;text-wrap:pretty}
.hint .hc{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--info-2);white-space:nowrap}
.chan{padding:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.chan .cn{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:14px}
.chan .cn>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.chan .cn b{font-size:22px;letter-spacing:-.01em;line-height:1.1}
.chan .cn>div>span{font-size:13px;opacity:.55}
.collhd{padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;cursor:pointer;border:0;color:#fff;text-align:left;width:100%;font:inherit}
.collhd.open{border-radius:12px 12px 0 0}
.collbd{margin-top:-12px;border-radius:0 0 12px 12px;border-top:1px solid var(--div);display:flex;flex-direction:column}
.achip{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:13px}
.achip.good{background:var(--ok-bg);color:var(--ok)}
.achip.warning{background:var(--warn-bg);color:var(--warn)}
.achip.critical{background:var(--err-bg);color:var(--err)}
.achip.info{background:var(--fill);color:var(--info)}
.issue{border-top:1px solid var(--div)}
.issue:first-child{border-top:0}
.issue .ih{display:grid;grid-template-columns:110px minmax(0,1fr) auto 16px;align-items:center;gap:14px;padding:12px 16px;cursor:pointer}
.issue .ih:hover,.nrow .nh:hover{background:rgba(255,255,255,.03)}
.issue .ia{font-size:14px;opacity:.65}
.issue .it{font-size:14.5px;font-weight:600;min-width:0}
.issue .ix{padding:0 16px 14px 140px;font-size:14px;opacity:.8;text-wrap:pretty;max-width:820px}
.goodrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:10px 16px;border-top:1px solid var(--div);font-size:14px}
.okdot{display:inline-flex;width:20px;height:20px;flex:none;border-radius:999px;background:var(--ok-bg);color:var(--ok);align-items:center;justify-content:center}
.collbtn{border:0;border-top:1px solid var(--div);background:transparent;color:var(--info);font-size:14px;font-weight:700;padding:12px 16px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px}
.collbtn:hover{background:rgba(255,255,255,.03)}
.nbars{display:flex;align-items:flex-end;gap:3px;height:34px;flex:none}
.nbars span{width:10px;border-radius:3px}
.ngrid{display:grid;grid-template-columns:110px 84px minmax(90px,1fr) 80px 80px 70px 80px 16px;gap:10px;align-items:center;padding:9px 16px;font-size:14px}
.ngrid.hd{font-size:12.5px;font-weight:700;opacity:.55;padding:10px 16px}
.nrow{border-top:1px solid var(--div)}
.nrow .nh{cursor:pointer}
.nrow .nd{padding:6px 16px 18px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr);gap:16px 24px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;opacity:.75}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;border-radius:2px}
.kvgrid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kvgrid>span:nth-child(odd){opacity:.6}
.kvgrid>span:nth-child(even){text-align:right}
.moonbox{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.05)}
.moon{width:34px;height:34px;flex:none;border-radius:999px;background:#f6f5f4}
.r{text-align:right}
/* Ergebnisse */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rcard{background:var(--card);border:1px solid var(--card-line);border-radius:12px;display:flex;flex-direction:column;position:relative}
.rcard .ph{aspect-ratio:3/2;background:repeating-linear-gradient(135deg,#1c1c1c 0 8px,#222 8px 16px) center/cover no-repeat;border-radius:11px 11px 0 0;display:grid;place-items:center;font:12px var(--mono);color:rgba(255,255,255,.6)}
.rcard .ph.img{background-color:#000;cursor:zoom-in}
.rcard .rb{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rcard .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rcard .rd{font-size:12.5px;opacity:.55;white-space:nowrap}
.rcard .rk{font-size:12.5px;opacity:.7}
.rcard .ra{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rcard .mark{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:999px;background:rgba(15,15,15,.85);font-size:12px;font-weight:700}
.addtile{border:1px dashed rgba(255,255,255,.2);border-radius:12px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;
  color:rgba(255,255,255,.75);cursor:pointer;background:transparent}
.addtile:hover{background:rgba(255,255,255,.05);color:#fff}
.addtile .plus{width:40px;height:40px}
table.kt{width:100%;border-collapse:collapse;font-size:14px}
table.kt th{font-size:12.5px;font-weight:700;opacity:.55;text-align:left;padding:10px 16px;white-space:nowrap}
table.kt td{padding:10px 16px;border-top:1px solid var(--div);vertical-align:top;white-space:nowrap}
table.kt td b{font-size:16px}
.dlt{font-size:12px;font-weight:700}
.dlt.up{color:var(--ok)}.dlt.down{color:var(--err)}.dlt.flat{opacity:.55}
table.why{width:100%;border-collapse:collapse;font-size:13.5px}
table.why td{padding:9px 16px;border-top:1px solid var(--div);vertical-align:top}
table.why td:first-child{opacity:.6;white-space:nowrap}
table.why td:nth-child(2){font-weight:600}
.chartbox{position:relative;height:260px;padding:0 16px 16px}
.srcrow{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 44px;border-top:1px solid var(--div)}
.srcrow .p{flex:1;min-width:0;font:13.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Frames */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ftile{content-visibility:auto;contain-intrinsic-size:auto 130px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ftile .ph{position:relative;aspect-ratio:3/2;border-radius:8px;overflow:hidden;background:#0f0f0f;border:0;padding:0;width:100%;cursor:zoom-in;display:grid;place-items:center;
  color:rgba(255,255,255,.5);font-size:12px}
.ftile .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ftile.off .ph{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2)}
.ftile.off .ph img{opacity:.45}
.ftile .nopv{padding:0 8px;text-align:center}
.fcb{position:absolute;top:6px;left:6px;z-index:2;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;cursor:pointer;
  background:rgba(15,15,15,.6);box-shadow:inset 0 0 0 2px rgba(255,255,255,.75);color:#fff}
.fcb input{position:absolute;opacity:0;width:0;height:0}
.fcb svg{display:none;width:14px;height:14px}
.fcb:has(input:checked){background:var(--accent);box-shadow:none}
.fcb:has(input:checked) svg{display:block}
.fcb:has(input:focus-visible){outline:2px solid var(--info);outline-offset:1px}
.fmine{position:absolute;top:8px;right:8px;z-index:2;width:20px;height:20px;border-radius:999px;display:grid;place-items:center;background:rgba(15,15,15,.85);color:#fff}
.fwhy{position:absolute;left:6px;bottom:6px;z-index:2;max-width:calc(100% - 12px);padding:2px 8px;border-radius:999px;background:rgba(15,15,15,.88);font-size:11.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fwhy:empty{display:none}
.fwhy.warnc{color:var(--warn)}.fwhy.errc{color:var(--err)}
.ftile .fx{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;padding:0 2px;min-width:0}
.ftile .fx span:first-child{opacity:.85}
.ftile .fx .fmet{opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fbar select{height:32px;font-size:13.5px}
.fsum{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;margin-top:-6px}
.fsum>span{opacity:.6}
.fsum b{font-weight:700}
.keys{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;opacity:.6}
/* PhotoSwipe: Bild links, Entscheidungsleiste rechts (wie im Entwurf) */
.pswp.fvpswp{--pswp-bg:#0a0a0a}
.pswp.fvpswp .pswp__top-bar{height:52px;background:#0a0a0a;border-bottom:1px solid rgba(255,255,255,.06)}
.pswp.fvpswp .pswp__counter{display:none}
.fvtop{position:absolute;left:18px;top:0;height:52px;z-index:12;display:flex;align-items:center;gap:10px;pointer-events:none;color:#fff;font:15px/1.45 "SF Pro Text",-apple-system,"Segoe UI",system-ui,sans-serif}
.fvtop b{font-weight:700}.fvtop span{font-size:13.5px;opacity:.55}
.pswp.fvpswp .pswp__button--arrow{width:42px;height:42px;margin-top:-21px;border-radius:999px;background:rgba(255,255,255,.1)!important;top:calc(50% + 26px)}
.pswp.fvpswp .pswp__button--arrow:hover{background:rgba(255,255,255,.18)!important}
.pswp.fvpswp .pswp__button--arrow .pswp__icn{width:24px;height:24px;margin-top:-12px;left:9px;top:50%;position:absolute}
.pswp.fvpswp .pswp__button--arrow--prev{left:12px}
.pswp.fvpswp .pswp__button--arrow--next{right:352px}
.fvstrip{position:absolute;right:0;top:52px;bottom:0;width:340px;z-index:20;background:var(--sheet);border-left:1px solid rgba(0,0,0,.5);color:#fff;padding:18px;display:flex;flex-direction:column;gap:16px;
  overflow:auto;font:15px/1.45 "SF Pro Text",-apple-system,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.fvstrip .fvo{font-size:13px;opacity:.6}
.fvstrip .fvr{font-size:14px}
.fvstrip .fvbtns{display:flex;flex-direction:column;gap:6px}
.fvstrip .fvb{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:0;border-radius:8px;background:var(--fill);color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;text-align:left}
.fvstrip .fvb span.g{flex:1}
.fvstrip .fvb svg{width:16px;height:16px;flex:none}
.fvstrip .fvb.useon{background:#2a2a2e;box-shadow:inset 0 0 0 1px rgba(143,240,164,.5)}
.fvstrip .fvb.skipon{background:rgba(192,28,40,.45)}
.fvstrip .fvb.auto{height:36px;background:transparent;color:var(--info);font-size:14px}
.fvstrip .fvb.auto:hover{background:rgba(120,174,237,.1)}
.fvstrip .fvm{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.fvstrip .fvm>span:nth-child(odd){opacity:.6}.fvstrip .fvm>span:nth-child(even){text-align:right}
.fvstrip .fvf{font:12.5px var(--mono);opacity:.5;word-break:break-all}
.fvstrip .fvk{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;opacity:.6}
.fvstrip .fvfit{align-self:flex-start}
.pswp.fvpswp.pswp--closing .fvstrip{opacity:0;transition:opacity .12s}
@media (max-width:900px){.fvstrip{top:auto;left:0;width:auto;height:46%;border-left:0;border-top:1px solid rgba(0,0,0,.5)}.pswp.fvpswp .pswp__button--arrow--next{right:12px}}

/* ---------- Stacken */
.runs{display:flex;flex-direction:column;gap:12px}
.run{background:var(--panel);border-radius:14px;display:flex;flex-direction:column;transition:opacity .15s}
.run.off{opacity:.55}
.run .rtop{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:16px}
.run .rfoot{border-top:1px solid var(--div);display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px}
.rft{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#fff;font-size:13.5px;cursor:pointer}
.rft:hover,.rft.open{background:var(--fill)}
.run .rbody{border-top:1px solid var(--div);padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.calrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.04)}
.calrow .cl{font-weight:700}
.calrow .cv{min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.fgrp{display:grid;grid-template-columns:70px 60px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.04)}
.optrow{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--div)}
.optrow:first-child{border-top:0}
.optrow .ot{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.optrow .on{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px}
.optrow .od{font-size:13px;opacity:.6;text-wrap:pretty}
.rec{font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;background:rgba(53,132,228,.25);color:var(--info-2)}
.meters{display:flex;flex-direction:column}
.meter{display:grid;grid-template-columns:minmax(0,220px) minmax(80px,1fr) auto;align-items:center;gap:8px 16px;padding:12px 16px;border-top:1px solid var(--div)}
.meter:first-child{border-top:0}
.meter .mk{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.meter .mk svg{opacity:.7}
.meter .mb{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.meter .mb>div{height:100%}
.meter .mv{display:flex;align-items:center;gap:6px;font-size:13.5px;white-space:nowrap}
.meter .mv span{opacity:.75}
.go{position:sticky;bottom:12px;z-index:5;background:#262626;border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 6px 24px rgba(0,0,0,.45);padding:12px 12px 12px 18px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.go .gm{flex:1 1 300px;min-width:0;display:flex;flex-direction:column}
.go .gm b{font-weight:700}
.go .gm span{font-size:13.5px;opacity:.75;text-wrap:pretty}
/* ---------- Auftrag */
.timeline{display:flex;gap:0;margin:6px 0 2px;overflow-x:auto;padding-bottom:4px}
.tl{flex:1;min-width:84px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;font-size:12px;color:rgba(255,255,255,.55)}
.tl:not(:last-child)::after{content:"";position:absolute;top:15px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:rgba(255,255,255,.1)}
.tl.done:not(:last-child)::after{background:var(--qa)}
.tl .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--fill);margin-bottom:5px;color:rgba(255,255,255,.6)}
.tl.done .ic{background:var(--ok-bg);color:var(--ok)}
.tl.now .ic{background:var(--accent);color:#fff;box-shadow:0 0 0 5px rgba(53,132,228,.22)}
.tl.now{color:#fff;font-weight:700}
.tl.fail .ic{background:var(--err-bg);color:var(--err)}
.tl.fail{color:var(--err);font-weight:700}
.alertline{display:flex;gap:8px;align-items:flex-start;color:var(--err);font-size:13.5px;margin-top:8px}
.nowbox{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;background:var(--panel);border-radius:12px;padding:14px}
.nowbox .big-ic{width:44px;height:44px;border-radius:12px;background:var(--info-bg);color:var(--info-2);display:grid;place-items:center}
.nowbox .big-ic svg.i{width:22px;height:22px}
.nowbox .what{font-size:13.5px;opacity:.75}
.nowbox .why{font-size:13px;opacity:.55;margin-top:3px}
.eta{text-align:right;white-space:nowrap}
.eta b{font-size:20px;display:block;line-height:1.2}
.progress{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin:10px 0 4px}
.progress>div{height:100%;background:var(--accent);transition:width .5s}
.progress.indet>div{width:30%!important;animation:indet 1.6s infinite ease-in-out}
@keyframes indet{0%{margin-left:-30%}100%{margin-left:100%}}
pre.log{background:#0a0a0a;border-radius:8px;padding:10px 12px;max-height:240px;overflow:auto;font:12px/1.45 var(--mono);white-space:pre-wrap;margin:8px 0 0;color:rgba(255,255,255,.7)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
/* Ziel-Rückfrage */
.trow{display:grid;grid-template-columns:auto 1fr minmax(220px,300px);gap:14px;align-items:start;padding:14px 16px;border-top:1px solid var(--div)}
.trow:first-child{border-top:0}
.trow.off{opacity:.5}
.trow input[type=text]{width:100%}
.lo{font:12px var(--mono);opacity:.5;margin-top:2px}
/* Spickzettel */
.cl{display:flex;flex-direction:column}
.cli{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 16px;border-top:1px solid var(--div);align-items:start}
.cli .num{width:24px;height:24px;border-radius:999px;background:var(--fill);display:grid;place-items:center;font-weight:700;font-size:12px}
.cli .t{font-weight:600;font-size:14.5px}
.cli .tool{font-size:13px;color:var(--info);font-weight:500}
.cli .w{font-size:13px;opacity:.6}
.phase{font-size:12.5px;font-weight:700;opacity:.55;padding:12px 16px 6px}

/* ---------- Dialoge */
dialog{background:var(--pop);color:#fff;border:0;border-radius:14px;padding:0;width:min(560px,94vw);box-shadow:var(--shadow-modal)}
dialog.wide{width:min(1400px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .hd{padding:20px 20px 4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
dialog .hd h2{font-size:20px}
dialog .bd{padding:12px 20px 16px;display:flex;flex-direction:column;gap:16px;max-height:72vh;overflow:auto}
dialog .ft{padding:0 20px 20px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
dialog img.full{width:100%;display:block;background:#000;border-radius:0 0 14px 14px}
dialog input[type=text],dialog input[type=number],dialog textarea{background:var(--bg);box-shadow:inset 0 0 0 1px var(--ring);height:38px;border-radius:8px;padding:0 12px;font-size:15px}
dialog textarea{height:auto;padding:10px 12px;font-size:14px}
dialog input:focus,dialog textarea:focus{box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
dialog.ask{width:min(340px,92vw);background:#262626;border-radius:16px}
dialog.ask .at{padding:24px 22px 18px;text-align:center;display:flex;flex-direction:column;gap:8px}
dialog.ask .at b{font-size:18px}
dialog.ask .at div{font-size:14px;opacity:.8;text-wrap:pretty;white-space:pre-line}
dialog.ask .af{display:flex;gap:10px;padding:0 22px 22px}
dialog.ask .af .btn{flex:1;height:38px;font-weight:700}
.optline{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--div)}
.optline:first-child{border-top:0}
.optline .t{font-size:14.5px}
.optline .d{font-size:13px;opacity:.6}
#updDlg .notes{white-space:pre-wrap;max-height:260px;overflow:auto;background:rgba(255,255,255,.05);border-radius:8px;padding:10px 12px;font-size:13px}
#updDlg .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px}
#updDlg .bar>div{height:100%;background:var(--accent);width:0;transition:width .3s}
.copt{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;align-items:start;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px transparent}
.copt:hover{background:rgba(255,255,255,.07)}
.copt.sel{box-shadow:inset 0 0 0 1px rgba(255,255,255,.85)}
.copt.bad{opacity:.7}
.copt input{margin-top:4px;accent-color:var(--accent)}
.copt .r{font-size:13px;opacity:.6}
.calres{border-radius:8px;padding:10px 12px;background:rgba(255,255,255,.05);font-size:13.5px;border-left:3px solid var(--ring)}
/* Lightbox aus dem Bericht */
#frameDlg{width:min(1500px,96vw)}
#frameDlg .hd{padding:14px 18px;border-bottom:1px solid var(--div)}
#frameDlg .fimg{position:relative;background:#000;display:grid;place-items:center;min-height:300px}
#frameDlg .fimg img{max-width:100%;max-height:68vh;display:block;cursor:zoom-in}
#frameDlg .fimg img[hidden]{display:none}
#frameDlg .fimg img.zoom{max-width:none;max-height:none;cursor:zoom-out}
#frameDlg .fimg.zoomed{overflow:auto;max-height:72vh;display:block}
#frameDlg .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);color:#fff;border:none;width:42px;height:42px;border-radius:999px;cursor:pointer;display:grid;place-items:center}
#frameDlg .nav:hover{background:rgba(255,255,255,.18)}
#frameDlg .nav.l{left:12px}#frameDlg .nav.r{right:12px}
#frameDlg .fmeta{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px;font-size:13.5px;padding:14px 20px}
#frameDlg .fmeta span{display:block;font-size:12px;opacity:.55}
/* Vollbild-Blatt (Bericht, Spickzettel) */
.sheet{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.sheet .shd{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px 0 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.sheet .sbd{flex:1;min-height:0;overflow:auto;padding:20px 24px 48px}
.sheet .sbd>.inner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
iframe.report{width:100%;border:0;display:block;background:transparent;min-height:400px;height:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:#262626;border-radius:999px;padding:9px 20px;box-shadow:0 2px 10px rgba(0,0,0,.4);
  font-size:14px;max-width:90vw;text-wrap:pretty;text-align:center}
.toast.err{background:#3a1d20;color:#ffd5d1}
@media (max-width:860px){nav.side{display:none}section.view{padding:20px 16px 96px}h1{font-size:28px}
  .issue .ih{grid-template-columns:1fr auto 16px}.issue .ia{display:none}.issue .ix{padding-left:16px}
  .nrow .nd{grid-template-columns:1fr}.nowbox{grid-template-columns:1fr}.eta{text-align:left}.trow{grid-template-columns:auto 1fr}.trow>div:last-child{grid-column:1/-1}
  .meter{grid-template-columns:1fr auto}.meter .mb{grid-column:1/-1;grid-row:2}}
.topsl{display:flex;flex-direction:column;gap:4px;flex:1 1 220px;min-width:200px;align-items:stretch}
.topsl input[type=range]{width:100%;accent-color:var(--accent)}
.subs{display:flex;flex-direction:column;gap:2px;margin-top:8px;font-size:13px}
.subs .sub{display:grid;grid-template-columns:18px 1fr;align-items:center;opacity:.55}
.subs .sub.done{opacity:.75}.subs .sub.done span:first-child{color:var(--ok);display:flex}
.subs .sub.now{opacity:1;font-weight:600}
.alertline details.raw{margin-top:4px;color:var(--text-secondary);font-size:12.5px}
.alertline details.raw code{display:block;white-space:pre-wrap;word-break:break-word;margin-top:4px}
details.hints{margin-top:8px;font-size:13px;opacity:.6}details.hints summary{cursor:pointer;display:flex;gap:6px;align-items:center}
details.hints>div{padding-left:20px;margin-top:3px}
.fvstrip .fvthumb{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:8px;color:var(--ok);font-size:14px;font-weight:700}
.fvstrip .fvthumb svg{width:16px;height:16px}
.fvstrip .rvsec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.5;margin-bottom:-8px}
.fvstrip{overflow-y:auto}
.fvstrip .fvov{display:flex;flex-direction:column;gap:5px}
.fvstrip .ovc{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#fff;opacity:.65;font-size:13.5px;cursor:pointer;text-align:left}
.fvstrip .ovc i{width:12px;height:9px;border:2px solid;border-radius:50%;flex:none}
.fvstrip .ovc .kbd{margin-left:auto}.fvstrip .ovc.on{opacity:1;background:var(--fill)}
.pswp svg.fvsvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
</style>
</head>

const FCOL={ha:'#e01b24',oiii:'#2190a4',sii:'#a51d2d',r:'#e01b24',g:'#2ec27e',b:'#3584e4',l:'#deddda'};
function fkind(name){
  const n=String(name||'').toLowerCase().replace(/[\s_\-\/]+/g,'');
  if(/^(s(ii|2)).*o(iii|3)|sho/.test(n))return 'so3';
  if(/h(a|alpha).*o(iii|3)|^hao3|extreme|enhance|alpt|duo|quad|dualband|nbz|l-?ultimate/.test(n))return 'hao3';
  if(/^(ha|halpha|hα|h)$/.test(n)||/^ha\d/.test(n))return 'ha';
  if(/^(oiii|o3)/.test(n))return 'oiii';
  if(/^(sii|s2)/.test(n))return 'sii';
  if(/^(l|lum|luminance|clear)$/.test(n))return 'l';
  if(/^(r|red)$/.test(n))return 'r';if(/^(g|green)$/.test(n))return 'g';if(/^(b|blue)$/.test(n))return 'b';
  return 'rgb';
}
function fbg(name,deg){
  const k=fkind(name),C=FCOL;deg=deg||135;
  return {rgb:`linear-gradient(${deg}deg,${C.r} 0 33.3%,${C.g} 33.3% 66.6%,${C.b} 66.6%)`,
    hao3:`linear-gradient(${deg}deg,${C.ha} 0 50%,${C.oiii} 50%)`,so3:`linear-gradient(${deg}deg,${C.sii} 0 50%,${C.oiii} 50%)`}[k]||C[k];
}

// ---------- Auswahllisten: natives <select> bleibt die Quelle (Wert + change-Ereignis), sichtbar ist ein Knopf mit Popover
function enhanceSelects(root){
  (root||document).querySelectorAll('select:not([data-ui])').forEach(sel=>{
    if(sel.closest('dialog'))return;                 // Dialoge liegen über allem – dort bleibt das (dunkle) native Feld
    sel.dataset.ui='1';
    const b=document.createElement('button');b.type='button';b.className='sel';b.setAttribute('aria-haspopup','listbox');
    if(sel.getAttribute('aria-label'))b.setAttribute('aria-label',sel.getAttribute('aria-label'));
    if(sel.title)b.title=sel.title;
    const sync=()=>{const o=sel.options[sel.selectedIndex];b.innerHTML=`<span class="ell">${esc(o?o.text:'')}</span>${ic('down','s14')}`;b.disabled=sel.disabled;};
    sync();sel.addEventListener('change',sync);sel._sync=sync;
    sel.after(b);
    const pick=i=>{if(i<0||i>=sel.options.length||sel.options[i].disabled||i===sel.selectedIndex)return;sel.selectedIndex=i;sel.dispatchEvent(new Event('change',{bubbles:true}));};
    b.onclick=()=>openSelect(sel,b,pick);
    b.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();openSelect(sel,b,pick);}};
  });
}
function openSelect(sel,b,pick){
  const p=openPop('selPop',b,[...sel.options].map((o,i)=>`<button type="button" class="mi" role="option" data-i="${i}" ${o.disabled?'disabled':''} aria-selected="${i===sel.selectedIndex}">
    <span class="grow">${esc(o.text)}</span>${i===sel.selectedIndex?`<span class="infoc" style="display:inline-flex">${ic('check')}</span>`:''}</button>`).join(''),true);
  if(!p)return;
  p.style.minWidth=Math.max(160,b.offsetWidth)+'px';
  const items=[...p.querySelectorAll('[data-i]')];
  items.forEach(x=>x.onclick=()=>{closePops();pick(+x.dataset.i);b.focus();});
  p.onkeydown=e=>{const k=items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();(items[k+1]||items[0]).focus();}
    else if(e.key==='ArrowUp'){e.preventDefault();(items[k-1]||items[items.length-1]).focus();}
    else if(e.key==='Escape'||e.key==='Tab'){closePops();b.focus();}};
  (items[sel.selectedIndex]||items[0]).focus();
  (items[sel.selectedIndex]||items[0]).scrollIntoView({block:'nearest'});
}
new MutationObserver(()=>{if(!enhanceSelects.q){enhanceSelects.q=requestAnimationFrame(()=>{enhanceSelects.q=0;enhanceSelects();});}}).observe(document.body,{childList:true,subtree:true});

const JOBNAME={selftest:'Selbsttest läuft',stack:'Stacking läuft',analyze:'Analyse läuft',scan:'Ordner werden durchsucht',previews:'Vorschauen werden vorbereitet',assets:'Bilder werden vorbereitet',quality:'Kennzahlen werden gemessen'};
function jobProgress(j){
  const p=j.progress||{};
  const defs=!STEPS?[]:j.kind==='stack'?STEPS.stack:j.kind==='analyze'?STEPS.analyze:j.kind==='scan'?STEPS.analyze.slice(0,1)
    :j.kind==='assets'?[{key:'assets',title:'Bilder vorbereiten',icon:'image',what:'Bildbestand und Vorschauen werden lokal gespeichert.',why:''}]
    :j.kind==='selftest'?[{key:'scan',title:'Testdaten anlegen',icon:'folder',what:'Kleine Testbilder in einem Ordner mit Komma (Flats in zwei Kamerastellungen).',why:''},
      {key:'measure',title:'Analysieren',icon:'star',what:'Testbilder werden wie echte Aufnahmen vermessen.',why:''},
      {key:'stack',title:'Stacken mit PixInsight',icon:'layers',what:'Das echte PixInsight stackt die Testbilder.',why:''}]
    :j.kind==='previews'?[{key:'previews',title:'Vorschauen vorbereiten',icon:'image',what:'Miniaturen und Bildschirmvorschauen werden lokal gespeichert.',why:''}]
    :[{key:'quality',title:'Qualität messen',icon:'gauge',what:'Kennzahlen werden berechnet.',why:''}];
  const keys=j.kind==='stack'?(p.run_steps&&p.run_steps.length?p.run_steps:defs.map(d=>d.key)):defs.map(d=>d.key);
  const curKey=p.step||(['quality','previews','assets'].includes(j.kind)?j.kind:null);
  const ci=keys.indexOf(curKey);
  const pct=p.total?Math.round(100*p.done/p.total):null;
  const overall=p.final||!['queued','running'].includes(j.state)?100:keys.length?Math.min(100,Math.round(100*((Math.max(ci,0))+(pct!=null?pct/100:0.3))/keys.length)):null;
  return {p,defs,keys,curKey,ci,pct,overall};
}

// ---------- Rückfrage: gefundene Ziele → Projekte
async function startAnalysis(assign){
  try{await api('/api/analyze',{folders:preview.roots,assign});newTitle='';cur.view='job';await refresh();}catch(e){toast(e.message,true)}
}
function renderTargets(){
  const T=preview.targets, near=preview.near||[];
  const nearOf=k=>near.filter(n=>n.a===k||n.b===k).map(n=>({other:T.find(t=>t.key===(n.a===k?n.b:n.a)),deg:n.deg}));
  // Vorbelegung: bestehendes Projekt > benachbartes (größeres) Ziel > Titel (bei einem Ziel) > Objektname
  if(!renderTargets.init){renderTargets.init=true;
    T.forEach(t=>{t._on=true;t._proj=t.existing?t.existing.title:t.name;});
    T.forEach(t=>{const nb=nearOf(t.key).map(x=>x.other).filter(o=>T.indexOf(o)<T.indexOf(t));if(nb.length&&!t.existing)t._proj=nb[0]._proj;});
    if(newTitle&&T.length){const big=T[0];T.filter(t=>t._proj===big._proj).forEach(t=>t._proj=newTitle);}
  }
  const projs=()=>{const m={};T.filter(t=>t._on&&t._proj.trim()).forEach(t=>{(m[t._proj.trim()]=m[t._proj.trim()]||[]).push(t)});return m};
  const P2=projs(), ex=new Set((S.projects||[]).map(p=>p.title.toLowerCase()));
  const n=Object.keys(P2).length;
  $('#view').innerHTML=`<div style="display:flex;flex-direction:column;gap:6px"><h1>${T.length} Objekte gefunden</h1>
    <p class="sub" style="font-size:15px">Lege fest, was daraus werden soll. <b>Gleicher Projektname = zusammengelegt.</b> Haken weg = nicht anlegen.</p></div>
    <datalist id="projNames">${(S.projects||[]).map(p=>`<option value="${esc(p.title)}">`).join('')}</datalist>
    <div class="card">${T.map((t,i)=>{const nb=nearOf(t.key),sp=Object.keys(t.names||{});
      return `<div class="trow ${t._on?'':'off'}"><label class="switch" title="anlegen ja/nein" style="margin-top:2px"><input type="checkbox" data-on="${i}" ${t._on?'checked':''}><span></span></label>
      <div style="display:flex;flex-direction:column;gap:3px;min-width:0"><div class="row" style="gap:8px"><b style="font-size:17px">${esc(t.name)}</b>${t.filters.map(f=>`<span class="tag">${fic(f)}${esc(f)}</span>`).join(' ')}</div>
        <div class="small" style="opacity:.65">${t.frames} Lights · ${fmt(t.hours,1)} h · ${t.nights.length} Nächte${t.nights.length?' ('+dshort(t.nights[0])+(t.nights.length>1?' – '+dshort(t.nights[t.nights.length-1]):'')+')':''}${t.excluded?' · '+t.excluded+' aussortiert':''}</div>
        ${sp.length>1?`<div class="small" style="opacity:.65">Schreibweisen: ${sp.map(x=>esc(x)+' ('+t.names[x]+')').join(', ')} – als ein Objekt erkannt</div>`:''}
        ${t.existing?`<div class="small ok">${ic('check','tiny')} Projekt „${esc(t.existing.title)}“ gibt es schon – neue Nächte kommen dazu</div>`:''}
        ${nb.map(x=>`<div class="small warnc">${ic('warn','tiny')} nur ${fmt(x.deg,2)}° von „${esc(x.other.name)}“ entfernt – vermutlich dasselbe Feld</div>`).join('')}
        <div class="lo ell">${(t.folders||[]).map(f=>esc(f)).join(' · ')}</div></div>
      <div class="field"><label>Projekt</label><input type="text" list="projNames" data-proj="${i}" value="${esc(t._proj)}" ${t._on?'':'disabled'}>
        <div class="d">${!t._proj.trim()?'':ex.has(t._proj.trim().toLowerCase())?'→ bestehendes Projekt':(P2[t._proj.trim()]||[]).length>1?'→ neues Projekt, zusammengelegt':'→ neues Projekt'}</div></div></div>`}).join('')}</div>
    <div class="go"><span class="infoc" style="display:flex">${ic('info','s18')}</span><div class="gm"><b>${n?(n===1?'1 Projekt':n+' Projekte')+' anlegen bzw. aktualisieren':'Nichts ausgewählt'}</b>
      <span>${n?Object.entries(P2).map(([k,l])=>`${esc(k)}${l.length>1?' ('+l.length+' Objekte)':''}`).join(', '):'Mindestens ein Objekt einschalten.'}</span></div>
      <button class="btn" id="tBack">Zurück</button><button class="btn primary big" id="tGo" ${n?'':'disabled'}>${ic('play')} Projekte anlegen</button></div>`;
  document.querySelectorAll('[data-on]').forEach(c=>c.onchange=()=>{T[+c.dataset.on]._on=c.checked;renderTargets()});
  document.querySelectorAll('[data-proj]').forEach(c=>c.onchange=()=>{T[+c.dataset.proj]._proj=c.value;renderTargets()});
  $('#tBack').onclick=()=>{renderTargets.init=false;go('new')};
  $('#tGo').onclick=()=>{const a={};T.forEach(t=>a[t.key]=t._on&&t._proj.trim()?t._proj.trim():null);renderTargets.init=false;startAnalysis(a)};
}

// ---------- Neues Projekt: ein Formular, ein Anlegen-Knopf

    <input type="text" id="projName" value="${esc(newTitle)}" placeholder="z. B. Andromeda-Galaxie" style="width:min(440px,100%);height:38px;font-size:15px" autofocus></section>
  <section class="sec"><div class="sechd"><div><h2>Quellordner <span style="font-weight:400;opacity:.5;font-size:15px">optional</span></h2>
      <p class="sub">Hauptordner von NINA/ASIAIR – inklusive Flat- und Bias-Ordner. Mehrere Ordner sind möglich. b2stacker liest dort nur.</p></div></div>
    <div class="card" style="display:flex;flex-direction:column">

      <div style="padding:8px 12px;border-top:1px solid var(--div);display:flex;flex-wrap:wrap;align-items:center;gap:6px"><button class="btn ghost sm" id="addF">${ic('plus')} weiterer Ordner</button>
      ${rec.length?`<span class="small" style="opacity:.55;margin-left:8px">Zuletzt:</span>${rec.map(r=>`<button class="btn sm" data-rec="${esc(r)}" title="${esc(r)}"><span class="ell mono" style="max-width:260px;font-size:12.5px">${esc(r)}</span></button>`).join('')}`:''}</div>
    </div></section>
  <div class="go"><span class="infoc" style="display:flex">${ic('info','s18')}</span><div class="gm"><b>Bereit zum Anlegen</b><span>Ohne Ordner wird nichts gelesen oder verändert. Mit Ordnern wird zuerst geprüft, welche Objekte darin liegen.</span></div>
    <button class="btn primary big" id="createBtn">${ic('plus')} Projekt anlegen</button></div>`;
  const name=()=>$('#projName').value.trim();
  document.querySelectorAll('#fl input').forEach(i=>i.oninput=()=>folders[+i.dataset.i]=i.value);
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=async()=>{b.disabled=true;newTitle=name();try{const r=await api('/api/pick-folder',{initial:folders[+b.dataset.pick]||folders.find(x=>x)||''});if(r.path){if(hasPath(folders.filter((_,k)=>k!==+b.dataset.pick),r.path))toast('Dieser Ordner ist schon ausgewählt',true);else{folders[+b.dataset.pick]=r.path;renderNew();}}}catch(e){toast(e.message,true)}b.disabled=false;});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{newTitle=name();folders.splice(+b.dataset.del,1);renderNew();});
  document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{newTitle=name();if(hasPath(folders,b.dataset.rec))return toast('Dieser Ordner ist schon ausgewählt',true);const e=folders.findIndex(x=>!x.trim());if(e>=0)folders[e]=b.dataset.rec;else folders.push(b.dataset.rec);renderNew();});
  $('#addF').onclick=()=>{newTitle=name();folders.push('');renderNew();};

// ---------- Auftrag (Ablauf, aktueller Schritt, Restzeit)
function jobCard(j){
  const active=['queued','running'].includes(j.state);
  const g=jobProgress(j),p=g.p,defs=g.defs,keys=g.keys,curKey=g.curKey,ci=g.ci,pct=g.pct;
  const doneSet=new Set(p.steps_done||[]);
  const tl=keys.map((k,i)=>{const d=defs.find(x=>x.key===k)||{title:k,icon:'info'};
    const failK=j.state==='failed'?(p.failed_step||curKey):null;
    const st=!active&&j.state==='done'?'done':k===failK?'fail':(doneSet.has(k)||(ci>=0&&i<ci))?'done':(k===curKey&&active?'now':'');
    return `<div class="tl ${st}" title="${esc(d.what||'')}"><div class="ic">${st==='done'?ic('check'):st==='fail'?ic('close'):ic(d.icon)}</div>${esc(d.title)}${st==='fail'?'<br>fehlgeschlagen':''}</div>`}).join('');
  const d=defs.find(x=>x.key===curKey);
  const runInfo=j.kind==='stack'&&p.runs_total?`Lauf ${p.run_index} von ${p.runs_total}: <b>${esc(p.run||'')}</b> · `:'';
  const stateTxt={queued:'wartet',running:'läuft',done:'fertig',failed:'fehlgeschlagen',cancelled:'abgebrochen'}[j.state];
  return `<div class="card" id="jobCard" style="padding:16px;display:flex;flex-direction:column;gap:12px">
    <div class="row"><div class="grow">${j.project?`<div class="small" style="opacity:.6">Projekt</div><div class="row" style="gap:8px"><h3>${esc(ptitle(j.project))}</h3>${cur.view==='job'?`<button class="lnk" onclick='openProject(${jsArg(j.project)})'>öffnen ${ic('right','s14')}</button>`:''}</div>`:''}
      <div style="font-size:${j.project?'14px':'17px'};font-weight:${j.project?'500':'700'}">${esc(j.title)}</div>
      <div class="small" style="opacity:.6">${runInfo}${stateTxt}${active&&g.overall!=null?` · Schritt ${Math.max(ci,0)+1} von ${keys.length}`:''}${!active&&j.finished?' · '+dt(j.finished):''}</div></div>
      ${active?`<button class="btn danger" id="cancelBtn">${j.state==='queued'?'Aus der Warteschlange entfernen':'Abbrechen'}</button>`:''}</div>
    ${keys.length>1?`<div class="timeline">${tl}</div>`:''}
    ${active&&d?`<div class="nowbox"><div class="big-ic">${ic(d.icon)}</div>
      <div><b>${esc(d.title)}</b>${p.total?` <span style="opacity:.6">· ${p.done} von ${p.total}</span>`:''}${p.target?` <span style="opacity:.6">· ${esc(p.target)}</span>`:''}
        <div class="what">${esc(p.message&&/beendet/.test(p.message)?p.message:d.what)}</div>${d.why?`<div class="why">Wozu: ${esc(d.why)}</div>`:''}
        ${(p.substeps||[]).length?`<div class="subs">${p.substeps.map(x=>`<div class="sub ${x.state}"><span>${x.state==='done'?ic('check','s14'):x.state==='now'?'▸':''}</span><span>${esc(x.title)}${x.total?` <span style="opacity:.6">(${x.done}/${x.total})</span>`:''}</span></div>`).join('')}</div>`:''}
        ${p.alert?`<div class="alertline">${ic('warn','s14')}<div><span>PixInsight meldet: ${esc(p.alert)}</span>${p.alert_raw&&p.alert_raw!==p.alert?`<details class="raw"><summary>Originaltext</summary><code>${esc(p.alert_raw)}</code></details>`:''}</div></div>`:''}
        ${(p.hints||[]).length?`<details class="hints"><summary>${ic('info','s14')} ${p.hints.length===1?esc(p.hints[0]):p.hints.length+' Hinweise von PixInsight'}</summary>${p.hints.length>1?p.hints.map(h=>`<div>${esc(h)}</div>`).join(''):''}</details>`:''}
        <div class="progress ${pct==null?'indet':''}"><div style="width:${pct??0}%"></div></div></div>
      <div class="eta">${p.eta_s!=null?`<span class="small" style="opacity:.6">noch ca.</span><b>${dur(p.eta_s)}</b>`:`<span class="small" style="opacity:.6">Restzeit</span><b style="font-size:14px">wird geschätzt …</b>`}<span class="small" style="opacity:.6">läuft seit ${dur(p.step_elapsed_s)}</span></div></div>`:''}
    ${j.state==='failed'?failBanner(j,p):''}
    ${j.state==='cancelled'?`<div class="banner"><div class="grow"><div class="bt">Abgebrochen</div><div class="bx">Bisher Erledigtes bleibt erhalten.</div></div></div>`:''}
    <details ${j.state==='failed'||UI.log?'open':''} id="jobLogBox"><summary class="lnk plain small" style="opacity:.75">${ic('down','s14')} Protokoll${(j.log||[]).length?` <span style="opacity:.6;font-weight:400">· ${(j.log||[]).length>=120?'letzte 120 Zeilen':(j.log||[]).length+' Zeilen'}</span>`:''}</summary>
      <pre class="log" id="jobLog">${esc((j.log||[]).join('\n')||(active?'Noch keine Meldungen – sie erscheinen, sobald der erste Schritt beginnt.':'Keine Meldungen.'))}</pre></details></div>`;
}
function failBanner(j,p){
  const causes=(p.causes||(j.result&&j.result.causes)||[]).filter(c=>c&&c.text);
  const errs=causes.filter(c=>c.level==='error'),warns=causes.filter(c=>c.level!=='error');
  const step=(jobProgress(j).defs.find(x=>x.key===p.failed_step)||{}).title;
  return `<div class="banner err" style="align-items:flex-start"><span class="errc" style="display:flex;margin-top:2px">${ic('error','s18')}</span>
    <div class="grow" style="display:flex;flex-direction:column;gap:6px"><div class="bt">${esc(j.kind==='stack'?'Stacking':'Auftrag')} fehlgeschlagen${step?' beim '+esc(step):''}.</div>
      <div class="bx">${esc(j.error||'')}</div>
      ${errs.slice(1).concat(warns).map(c=>`<div class="bx" style="opacity:.75">• ${esc(c.text)}</div>`).join('')}
      <div class="row" style="gap:6px;margin-top:4px">${j.project?`<button class="btn sm" onclick='openProject(${jsArg(j.project)}).then(()=>goTab("plan"))'>Kalibrierdaten ändern</button>`:''}
        ${p.logdir?`<button class="btn sm" onclick='openDir(${jsArg(p.logdir)})'>${ic('folder-open')} WBPP-Protokoll öffnen</button>`:''}
        ${j.kind==='stack'&&j.project?`<button class="btn sm" onclick='retryStack(${jsArg(j.project)})'>${ic('refresh')} Erneut versuchen</button>`:''}</div></div></div>`;
}
async function retryStack(name){try{await startJob('/api/project/'+encodeURIComponent(name)+'/stack',{},'Stacking');}catch(e){toast(e.message,true)}}
function uiEvent(kind,data){try{fetch('/api/ui-event',{method:'POST',headers:{'Content-Type':'application/json','X-Astrostack':'1'},body:JSON.stringify(Object.assign({kind},data||{}))}).catch(()=>{});}catch(e){}}
function renderJob(){
  const j=S&&S.job; if(!j){if(cur.view==='job')go('new');return;}

  const lg0=$('#jobLog'),atEnd=!lg0||lg0.scrollTop+lg0.clientHeight>=lg0.scrollHeight-8;

      (!active&&j.kind==='analyze'&&Array.isArray(j.result)&&j.result.length?`<section class="sec"><div class="sechd"><div><h2>Ergebnis</h2></div></div><div class="row">${j.result.map(r=>`<button class="btn primary" onclick='openProject(${jsArg(r.project)})'>${esc(r.target)} öffnen ${ic('right')}</button>`).join('')}</div></section>`:'')+
      (Q.length?`<section class="sec">${secHd('Warteschlange','Startet automatisch nacheinander. Entfernen bricht nichts Laufendes ab.')}<div class="card" style="padding:6px">${Q.map((q,i)=>`<div class="qrow"><span class="qnum">${i+1}</span>

        <button class="btn sm ghost" data-jc="${esc(q.id)}">Entfernen</button></div>`).join('')}</div></section>`:'')+
      (done.length?`<section class="sec">${secHd('Zuletzt','')}<div class="card" style="padding:6px">${done.map(x=>`<div class="qrow"><span style="display:flex;color:${x.state==='done'?'var(--ok)':x.state==='failed'?'var(--err)':'rgba(255,255,255,.5)'}">${ic(x.state==='done'?'check':x.state==='failed'?'error':'unavail','s14')}</span>
        <div style="min-width:0"><div class="qt ell">${esc(x.title)}</div><div class="qd">${x.project?'Projekt '+esc(ptitle(x.project))+' · ':''}${{done:'fertig',failed:'fehlgeschlagen',cancelled:'abgebrochen'}[x.state]||x.state}${x.finished?' · '+dt(x.finished):''}</div></div><span></span></div>`).join('')}</div></section>`:'');

  }else{

function onJobFinished(j){
  if(j.kind==='scan'){
    if(j.state!=='done'){toast('Durchsuchen fehlgeschlagen',true);return;}
    preview=j.result; const T=preview.targets||[];
    if(!T.length){toast('Keine Light-Frames gefunden – sind die richtigen Ordner gewählt?',true);go('new');return;}
    if(T.length===1&&!(preview.near||[]).length){        // eindeutig: gleich analysieren
      const t=T[0];startAnalysis({[t.key]:t.existing?t.existing.title:(newTitle||t.name)});return;}
    go('targets');return;
  }
  if(j.state==='done'&&j.kind==='analyze'&&Array.isArray(j.result)&&j.result.length===1){dirty=false;INS=null;openProject(j.result[0].project);toast('Analyse fertig');}
  else if(j.state==='done'&&j.kind==='analyze'&&cur.view==='job'){toast('Analyse fertig');}
  else if(j.state==='done'&&j.kind==='stack'){toast('Stacking fertig');if(cur.project){cur.tab='overview';openProject(cur.project);}}
  else if(j.state==='done'&&j.kind==='quality'){if(cur.project)openProject(cur.project);}
  else if(j.state==='done'&&j.kind==='previews'){if(cur.project===j.project){fvDropList();if(cur.tab==='frames')renderTab();}toast('Vorschauen vorbereitet – jetzt auch offline verfügbar');}
  else if(j.state==='done'&&j.kind==='assets'){if(cur.project===j.project)openProject(cur.project);toast('Bilder vorbereitet – jetzt auch offline verfügbar');}
  else if(j.state==='failed')toast(j.kind==='stack'?'Stacking fehlgeschlagen':'Auftrag fehlgeschlagen',true);
}

function analysisModel(){
  const checks=[...(INS.diag||[]).map(c=>Object.assign({},c,{area:c.area||'Allgemein'})),...(INS.calib||[]).map(c=>Object.assign({},c,{area:'Kalibrierung'}))];

function nightsModel(){

async function linkAsset(){
  const AS=P.assets||[];let v='';
  try{const r=await api('/api/pick-file',{initial:'',kind:'image'});v=(r&&r.path)||'';}
  catch(e){v=(await askText('Bearbeitetes Bild hinzufügen','Pfad zur Bilddatei','','Der Dateidialog ist nicht verfügbar ('+e.message+'). Pfad z. B. D:\\Astro\\M31_final.psd','Verknüpfen'))||'';}
  if(!v)return;
  if(hasPath(AS.map(a=>a.path),v))return toast('Diese Datei ist schon verknüpft',true);
  try{P=await api('/api/project/'+encodeURIComponent(cur.project)+'/asset-link',{path:v});toast('Bild verknüpft');renderTab();}catch(e){toast(e.message,true)}
}
function stackMenu(anchor,id,outName){
  const s=P.stacks.find(x=>x.id===id);if(!s)return;const o=s.outputs.find(x=>x.name===outName)||s.outputs[0];
  const p=openPop('ctxPop',anchor,`${o.exists?`<button class="mi" data-a="pi">${ic('send')}In PixInsight öffnen</button><button class="mi" data-a="dir">${ic('folder-open')}Ordner öffnen</button>`:''}
    ${o.preview&&!isThumb(o.preview)?`<button class="mi" data-a="thumb">${ic('image')}Als Projektbild verwenden</button>`:''}
    ${o.exists&&!o.kpi?`<button class="mi" data-a="q">${ic('gauge')}Kennzahlen messen</button>`:''}
    <button class="mi" data-a="ren">${ic('edit')}Umbenennen …</button><div class="sep"></div>
    <button class="mi danger" data-a="del">${ic('minus')}Aus der Liste entfernen …</button>`);
  if(!p)return;
  p.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{closePops();const a=b.dataset.a;
    if(a==='pi')openPi([o.file]);else if(a==='dir')openDir(o.file.replace(/[\\/][^\\/]+$/,''));else if(a==='thumb')setThumb(o.preview);
    else if(a==='q')requality(s.id);else if(a==='ren')renameStack(s.id);else if(a==='del')removeStack(s.id);});
}
async function renameStack(id){
  const s=P.stacks.find(x=>x.id===id);if(!s)return;
  const n=await askText('Stack umbenennen','Anzeigename',s.name||'','Leer lassen = automatisch.');if(n===null)return;
  try{P=await api('/api/project/'+encodeURIComponent(cur.project)+'/stack-meta',{stack_id:id,name:n.trim()});toast('Name gespeichert');renderTab();}catch(e){toast(e.message,true)}
}
async function removeStack(id){
  const s=P.stacks.find(x=>x.id===id);if(!s)return;
  if(!await ask('Stack aus der Liste entfernen?',`„${stackName(s)}“ (${dt(s.date)}) verschwindet aus b2stacker. Alle Dateien bleiben erhalten – die Ergebnis-Dateien im Ordner final werden nicht gelöscht. Betrifft alle ${s.outputs.length} Ergebnis(se) dieses Stacks.`,'Entfernen',true))return;
  try{P=await api('/api/project/'+encodeURIComponent(cur.project)+'/stack-delete',{stack_id:id});toast('Stack aus der Liste entfernt – Dateien bleiben erhalten');renderTab();refresh();}catch(e){toast(e.message,true)}
}

// Shortcuts only while a viewer is open; typing in text fields must stay untouched (Esc is native to <dialog>).
function fvKey(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target, tag=t&&t.tagName;
  if(tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable)||(tag==='INPUT'&&!['checkbox','radio'].includes(t.type)))return;
  if(RVS&&RVS.pswp){
    if(!e.repeat&&String(e.key).toLowerCase()==='p'){e.preventDefault();rvThumbCur();}
    return;
  }
  if(FVS&&FVS.pswp){
    // PhotoSwipe owns arrows and Escape. Space is the review toggle, never auto-next.
    if(e.key===' '){
      if(e.repeat){e.preventDefault();return;}
      if(tag==='INPUT')return;
      if(tag==='BUTTON')t.blur();
      e.preventDefault();fvToggleCur();
    }else if(!e.repeat&&['s','x','h'].includes(String(e.key).toLowerCase())){
      e.preventDefault();fvToggleOv(String(e.key).toLowerCase());
    }else if(!e.repeat&&String(e.key).toLowerCase()==='p'){
      e.preventDefault();fvThumbCur();
    }else if(!e.repeat&&['v','n','a'].includes(String(e.key).toLowerCase())){
      // V/N decide and move on to the next frame (design: "nach V/N geht es automatisch weiter"), A resets to automatic.
      e.preventDefault();fvDecideCur(String(e.key).toLowerCase());
    }
    return;
  }
  if(!frameDlg.open)return;
  if(e.key==='ArrowLeft'){e.preventDefault();$('#fPrev').click()}
  else if(e.key==='ArrowRight'){e.preventDefault();$('#fNext').click()}
}

    if(x<y)return -dir;if(x>y)return dir;return a-b;});

async function openRV(key){

  const sizes=await Promise.all(items.map(x=>rvSize(x.src)));

  const pad=vp=>vp.x>900?{top:72,bottom:20,left:64,right:340+64}:{top:60,bottom:Math.round(vp.y*.46)+8,left:8,right:8};
  const pswp=new PhotoSwipe({dataSource:items.map((x,i)=>({src:x.src,width:sizes[i][0],height:sizes[i][1],alt:x.key})),index:at,
    showHideAnimationType:'fade',bgOpacity:.97,closeOnVerticalDrag:false,arrowKeys:true,escKey:true,counter:false,paddingFn:pad});
  state.pswp=pswp;
  pswp.on('afterInit',()=>{pswp.element.classList.add('fvpswp');
    const top=document.createElement('div');top.className='fvtop';pswp.element.appendChild(top);state.top=top;

  pswp.on('change',()=>{if(RVS===state)rvSync();});
  const done=()=>{if(RVS===state)RVS=null;};pswp.on('close',done);pswp.on('destroy',done);
  pswp.init();
}

  b.querySelectorAll('[data-cal]').forEach(x=>x.onclick=()=>{const [i,k]=x.dataset.cal.split('|');openCalib(runs[+i],k)});

  $('#optHd').onclick=()=>{UI.opts=!UI.opts;renderPlan(b)};
  b.querySelectorAll('[data-run]').forEach(c=>c.onchange=()=>savePlan({runs:{[runs[+c.dataset.run].name]:{enabled:c.checked}}}));

  b.querySelectorAll('[data-opt-sel]').forEach(c=>c.onchange=()=>savePlan({options:{[c.dataset.optSel]:c.value}}));
  b.querySelectorAll('[data-top]').forEach(c=>{const i=+c.dataset.top,r=runs[i];
    c.oninput=()=>{const p=+c.value;$(`[data-topp="${i}"]`).textContent=p+' %';$(`[data-topt2="${i}"]`).textContent=topText(r,p);
      const h=$(`[data-toph="${i}"]`);if(h)h.textContent=fmt(topHours(r,p),1)+' h';};
    c.onchange=()=>savePlan({runs:{[r.name]:{top_percent:+c.value}}});});
  b.querySelectorAll('[data-rren]').forEach(x=>x.onclick=async()=>{const r=runs[+x.dataset.rren];
    const v=await askText('Lauf umbenennen','Name',runName(r),`Automatisch erkannt: „${runName(Object.assign({},r,{label:''}))}“. Der Name erscheint in der Übersicht und im Dateinamen des Stacks. Leer lassen = automatischer Name.`);
    if(v===null)return;await savePlan({runs:{[r.name]:{label:v===r.name?'':v}}});toast(v&&v!==r.name?'Lauf heißt jetzt „'+v+'“':'Automatischer Name');});
  updateMeters();
}
function needs(){const en=P.plan.runs.filter(r=>r.enabled!==false);return {gb:Math.max(0,...en.map(r=>r.gb||0))+2,ram:Math.max(0,...en.map(r=>r.ram_gb||0)),en};}
function meterHtml(icon,title,need,free,total,unit,sub){
  // Balken = Anteil des freien Platzes, den der Lauf braucht (grün < 80 %, gelb bis 100 %, rot = reicht nicht)
  const ratio=free?need/free:null, pct=ratio==null?0:Math.min(100,ratio*100);
  const st=ratio==null?['rgba(255,255,255,.4)','info','rgba(255,255,255,.3)']:ratio>1?['var(--err)','error','#c01c28']:ratio>0.8?['var(--warn)','warn','var(--qc)']:['var(--ok)','check','var(--qa)'];
  return `<div class="meter" title="${esc(sub)}"><span class="mk">${ic(icon)}<span class="ell">${esc(title)}</span></span>
    <div class="mb" role="img" aria-label="${fmt(pct,0)} % des freien Platzes werden gebraucht"><div style="width:${Math.max(2,pct)}%;background:${st[2]}"></div></div>
    <span class="mv" style="color:${st[0]}">${ic(st[1],'s14')}<b>${fmt(need,need<10?1:0)} ${unit}</b><span>${ratio!=null&&ratio>1?'nötig, nur ':'von '}${fmt(free,free<10?1:0)} ${unit} frei</span></span></div>`;
}
function updateMeters(){
  if(cur.view!=='project'||cur.tab!=='plan'||!$('#meters')||!P)return;
  const n=needs();
  $('#meters').innerHTML=meterHtml('disk','Platz auf '+S.settings.workdir,n.gb,S.disk_free_gb,S.disk_total_gb,'GB','Arbeitsverzeichnis '+S.settings.workdir)+
    meterHtml('ram','Arbeitsspeicher',n.ram,S.ram_free_gb,S.ram_total_gb,'GB','gesamt '+fmt(S.ram_total_gb,0)+' GB · andere Programme schließen gibt mehr frei');
  const active=S.job&&['queued','running'].includes(S.job.state);
  const bl=[],wn=[];
  if(!S.pixinsight_ok)bl.push('PixInsight wurde nicht gefunden – Pfad in den Einstellungen prüfen.');
  else if(!S.wbpp_ok)bl.push('WBPP-Skript nicht gefunden – PixInsight-Installation prüfen.');
  if(S.pixinsight_running&&S.pixinsight_running.length)bl.push('PixInsight ist geöffnet – bitte schließen, sonst teilen sich zwei Instanzen den Arbeitsspeicher.');
  if(S.disk_free_gb!=null&&S.disk_free_gb<n.gb)bl.push(`Zu wenig Platz: ${fmt(n.gb,0)} GB nötig, ${fmt(S.disk_free_gb,0)} GB frei.`);
  if(needsAnalysis())bl.push('Quellordner geändert – erst „Neu analysieren“, danach kann gestackt werden.');
  if(!n.en.length)bl.push('Kein Lauf ausgewählt.');
  if(active)wn.push('Es läuft gerade ein Auftrag – das Stacking wird eingereiht und startet danach automatisch.');
  if(S.ram_free_gb!=null&&S.ram_free_gb<Math.min(n.ram,S.settings.min_free_ram_gb))wn.push(`Wenig freier Arbeitsspeicher (${fmt(S.ram_free_gb,1)} GB). Andere Programme schließen.`);
  n.en.forEach(r=>{if(!r.flats.length)wn.push(`${r.name}: keine passenden Flats.`);else if(!r.flat_ok)wn.push(`${r.name}: Flats haben ein Problem – siehe Kalibrierung.`);if(!r.bias.length)wn.push(`${r.name}: kein Bias – Flats werden ungenauer kalibriert.`);
    const g=(r.flat_groups||[]);if(g.length>1&&g.some(x=>!x.flats.length))wn.push(`${r.name}: nicht für jede Kamerastellung eigene Flats.`);});
  const outs=n.en.flatMap(r=>(r.outputs&&r.outputs.length)?r.outputs:[r.name]);
  const gb=$('#goBox'); if(!gb)return;
  const title=bl.length?'Stacken gesperrt':wn.length?'Bereit mit Hinweisen':'Bereit';
  const col=bl.length?'var(--err)':wn.length?'var(--warn)':'var(--ok)';
  const text=bl.length?bl.join(' '):(`Ergibt ${plural(outs.length,'Stack','Stacks')}: ${outs.join(', ')}. `+(n.en.some(r=>runTop(r,P.plan.options)<100)?'Nur die besten Frames: '+n.en.filter(r=>runTop(r,P.plan.options)<100).map(r=>`${runName(r)} ${runTop(r,P.plan.options)} % (${fmt(topHours(r,runTop(r,P.plan.options)),1)} h)`).join(', ')+'. ':'')+(wn.length?wn.join(' '):'PixInsight läuft unsichtbar im Hintergrund, der PC bleibt wach. Fertige Dateien heißen z. B. '+P.plan.target.replace(/[^\w-]/g,'')+'_'+(n.en[0]?.name||'RGB')+'_'+new Date().toISOString().slice(0,10)+'_'+fmt(n.en[0]?.hours,1).replace(',','.')+'h.xisf'));
  const html=`<span style="display:flex;color:${col}">${ic(bl.length?'error':wn.length?'warn':'check','s18')}</span>
    <div class="gm"><b style="color:${col}">${title}</b><span>${esc(text)}</span></div>
    <button class="btn primary big" id="goBtn" ${bl.length?'disabled':''}>${ic(active?'clock':'play')} ${active?'Stacking einreihen':outs.length>1?outs.length+' Stacks erzeugen':'Stacken'}</button>`;
  if(gb.dataset.h!==html){gb.innerHTML=html;gb.dataset.h=html;
    $('#goBtn').onclick=async()=>{
      if(dirty&&!await ask('Plan noch nicht neu berechnet','Du hast Frames ein- oder ausgeschlossen, der Plan ist aber noch nicht neu berechnet. Trotzdem mit dem alten Plan stacken?','Trotzdem stacken'))return;
      $('#goBtn').disabled=true;try{const busy=jobActive();await api('/api/project/'+encodeURIComponent(cur.project)+'/stack',{});await refresh();renderJob();
        if(busy)toast('Stacking eingereiht – startet nach dem laufenden Auftrag');
        document.querySelector('section.view').scrollTo({top:0,behavior:'smooth'});}catch(e){toast(e.message,true);$('#goBtn').disabled=false}};}
}
function renderDirty(){
  const s=$('#dirtySlot'); if(!s)return;

    <div class="bx">Quellordner oder Frames haben sich geändert. Bis zur neuen Analyse ist Stacken gesperrt, weil der Plan noch den alten Stand kennt.</div></div>${((P.sources||{}).roots||[]).length?'<button class="btn primary" id="raBtn">Neu analysieren</button>':''}</div>`:'';
