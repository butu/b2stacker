// ---------- Kalibrierdaten wählen
const KNAME={flats:'Flats',bias:'Bias',darks:'Darks',darkflats:'Dark-Flats'};
const KHELP={flats:'Flats korrigieren Vignettierung und Staub. Gleicher Filter, Fokus und Kamera-Drehung wie die Lights, am besten aus derselben Session.',
  bias:'Bias (0-s-Aufnahmen) liefern das Ausleserauschen-Muster und kalibrieren die Flats. Gleicher Gain, Offset und Auslesemodus.',
  darks:'Darks (gleiche Belichtung und Temperatur wie die Lights) entfernen Hotpixel und Verstärkerglühen. Ohne Darks übernimmt die Rejection die Hotpixel – dank Dithering.',
  darkflats:'Dark-Flats (gleiche Belichtung wie die Flats) ersetzen Bias bei langen Flat-Belichtungen. Meist nicht nötig.'};
const manBadge=(r,k)=>(r.calib_manual||{})[k]?`<span class="badge neutral" title="von dir geändert">${ic('lock','tiny')} ${esc(r.calib_manual[k])}</span>`:'';
let calState=null;
function openCalib(run,kind){
  const ch=(run.calib_choices||{})[kind]||[];
  const curPaths=run[kind]||[], curSet=run[{flats:'flat_set',bias:'bias_set',darks:'dark_set',darkflats:'darkflat_set'}[kind]];
  const auto=ch.find(c=>c.usable);
  const manual=(run.calib_manual||{})[kind];
  const match=ch.find(c=>c.folder===curSet&&c.frames===curPaths.length);
  let sel=manual==='keine'?'none':manual==='eigener Ordner'?'folder':(!manual||!match||match===auto)?'auto':match.id;
  calState={run,kind,sel,folder:manual==='eigener Ordner'?curSet:'',inspect:null};
  $('#calTitle').textContent=KNAME[kind]+' für '+run.name;
  renderCalib(ch,auto);
  calDlg.showModal();
}
function renderCalib(ch,auto){
  const st=calState,k=st.kind;
  const opt=(id,title,sub,bad)=>`<label class="copt ${st.sel===id?'sel':''} ${bad?'bad':''}"><input type="radio" name="cal" value="${esc(id)}" ${st.sel===id?'checked':''}><div>${title}${sub?`<div class="r">${sub}</div>`:''}</div></label>`;
  $('#calBody').innerHTML=`<div class="sub">${esc(KHELP[k])}</div>
    <div style="display:flex;flex-direction:column;gap:6px">
    ${opt('auto',`<b>Vorschlag von b2stacker</b>${auto?` · ${esc(auto.label)} · ${auto.frames} Frames`:' · keine passenden gefunden'}`,'Wird bei jeder Neu-Analyse automatisch neu gewählt.')}
    ${ch.filter(c=>c!==auto).map(c=>opt(c.id,`${esc(c.label)} · <b>${c.frames}</b> Frames${c.verdict==='critical'?' <span class="badge critical">Problem</span>':c.verdict==='warning'?' <span class="badge warning">Hinweis</span>':''}`,
      (c.usable?'':'⚠ passt nicht: ')+esc((c.reasons||[]).filter(x=>!/unbekannt/.test(x)).join('; ')||'passt'),!c.usable)).join('')}
    ${opt('none','<b>Keine verwenden</b>',k==='bias'?'Nicht empfohlen – Flats werden dann ungenauer kalibriert.':k==='flats'?'Nicht empfohlen – Vignettierung und Staub bleiben im Bild.':'')}
    ${opt('folder','<b>Eigenen Ordner wählen …</b>','Alle FITS/XISF darin werden als '+KNAME[k]+' verwendet (auch wenn der Header anderes sagt).')}</div>
    ${st.sel==='folder'?`<div class="frow"><input type="text" id="calFolder" value="${esc(st.folder||'')}" placeholder="Ordner mit ${KNAME[k]}" class="mono" style="font-size:13.5px"><button class="btn" id="calPick">Durchsuchen …</button><button class="btn" id="calCheck">Prüfen</button></div>
      <div id="calRes">${st.inspect?calResHtml(st.inspect):''}</div>`:''}`;
  $('#calBody').querySelectorAll('input[name=cal]').forEach(r=>r.onchange=()=>{st.sel=r.value;renderCalib(ch,auto)});
  const pick=$('#calPick'); if(pick)pick.onclick=async()=>{try{const r=await api('/api/pick-folder',{initial:st.folder||''});if(r.path){st.folder=r.path;await inspectCal();renderCalib(ch,auto);}}catch(e){toast(e.message,true)}};
  const chk=$('#calCheck'); if(chk)chk.onclick=async()=>{st.folder=$('#calFolder').value.trim();await inspectCal();renderCalib(ch,auto);};
  const fi=$('#calFolder'); if(fi)fi.onchange=()=>{st.folder=fi.value.trim();st.inspect=null;};
}
async function inspectCal(){
  const st=calState;
  try{st.inspect=await api('/api/project/'+encodeURIComponent(cur.project)+'/calib-inspect',{run:st.run.name,kind:st.kind,folder:st.folder});}
  catch(e){st.inspect={error:e.message};}
}
function calResHtml(r){
  if(r.error)return `<div class="calres" style="border-color:var(--err)">✗ ${esc(r.error)}</div>`;
  return `<div class="calres" style="border-color:${r.ok?(r.warnings.length?'var(--warn)':'var(--ok)'):'var(--err)'}"><b>${r.ok?'✓':'✗'} ${r.frames} Dateien</b> · erkannt: ${esc(Object.entries(r.types).map(([t,n])=>n+'× '+t).join(', '))}
    ${r.problems.map(x=>`<div class="errc">✗ ${esc(x)}</div>`).join('')}${r.warnings.map(x=>`<div style="opacity:.7">⚠ ${esc(x)}</div>`).join('')}
    ${!r.ok?'<div style="opacity:.7">Passt nicht zu den Lights – WBPP würde diese Dateien wahrscheinlich ignorieren oder falsch kalibrieren.</div>':''}</div>`;
}
$('#calSave').onclick=async()=>{
  const st=calState; let choice=st.sel;
  if(choice==='folder'){
    st.folder=($('#calFolder')||{}).value?.trim()||st.folder;
    if(!st.folder)return toast('Bitte einen Ordner wählen',true);
    if(!st.inspect||st.inspect.folder!==st.folder)await inspectCal();
    if(st.inspect.error)return renderCalib((st.run.calib_choices||{})[st.kind]||[],((st.run.calib_choices||{})[st.kind]||[]).find(c=>c.usable));
    if(!st.inspect.ok&&!confirm('Der Ordner passt nicht zu den Lights:\n'+st.inspect.problems.join('\n')+'\n\nTrotzdem verwenden?'))return;
    choice={folder:st.folder};
  }else if(choice!=='auto'&&choice!=='none'){
    const c=((st.run.calib_choices||{})[st.kind]||[]).find(x=>x.id===choice);
    if(c&&!c.usable&&!confirm('Dieser Satz passt laut Prüfung nicht:\n'+c.reasons.join('\n')+'\n\nTrotzdem verwenden?'))return;
  }
  calDlg.close();
  await savePlan({runs:{[st.run.name]:{calib:{[st.kind]:choice}}}});
  toast(KNAME[st.kind]+' für '+st.run.name+' geändert');
};

      <div class="d">MCP über HTTP, nur auf diesem Rechner erreichbar. Jede Verbindung braucht den Schlüssel – wie ein Passwort behandeln. Neu erzeugen macht alle bisherigen Verbindungen ungültig.</div></div>`+
    `<div class="row" style="border-top:1px solid var(--div);padding-top:14px"><div class="small grow" style="opacity:.55">Gespeichert in ${esc(S.settings_file)} · Version ${esc(S.version)}</div>
      <button class="btn sm" id="updChk" title="Auf GitHub nach einer neuen Version suchen">${ic('refresh')} Nach Updates suchen</button>
      <button class="btn sm danger" id="quitBtn" title="Programm komplett beenden">b2stacker beenden</button></div>`;
  $('#updChk').onclick=()=>{setDlg.close();openUpdate();checkUpdate();};
  $('#quitBtn').onclick=async()=>{const a=S.job&&['queued','running'].includes(S.job.state);
    if(!await ask('b2stacker beenden?',a?'Es läuft gerade ein Auftrag – er wird abgebrochen.':'','Beenden',true))return;
    try{await api('/api/quit',{})}catch(e){}
    document.body.innerHTML='<div style="display:grid;place-items:center;height:100vh;opacity:.6">b2stacker wurde beendet. Dieses Fenster kann geschlossen werden.</div>';};
  document.querySelectorAll('[data-pickset]').forEach(b=>b.onclick=async()=>{const inp=document.querySelector(`[data-k="${b.dataset.pickset}"]`);
    try{const r=await api(b.dataset.kind==='file'?'/api/pick-file':'/api/pick-folder',{initial:inp.value});if(r.path){inp.value=r.path;if(b.dataset.kind==='file')checkPi();}}catch(e){toast(e.message,true)}});
  const piIn=document.querySelector('[data-k="pixinsight"]'); if(piIn){piIn.onchange=checkPi;checkPi();}
  claudeStatus();
  mcpInfo();
  setDlg.showModal();
}
async function claudeStatus(r){
  const t=$('#claudeTxt'),b=$('#claudeBtn');if(!t)return;
  try{r=r||await api('/api/claude');}catch(e){t.textContent='Status nicht lesbar: '+e.message;return;}
  const ok=r.installed&&r.current;
  t.innerHTML=`<span style="color:${ok?'var(--ok)':r.claude_found?'inherit':'var(--err)'};font-weight:700">${ok?'✓ ':''}</span>${esc(r.text)}`;
  b.hidden=!r.claude_found&&!r.installed;b.className='btn'+(ok?' ghost':'');
  b.textContent=ok?'Verbindung entfernen':r.installed?'Neu verbinden':'Mit Claude verbinden';
  b.onclick=async()=>{b.disabled=true;try{const x=await api('/api/claude/'+(ok?'uninstall':'install'),{});
    toast(ok?'Verbindung entfernt – Claude-App neu starten':'Verbunden – jetzt die Claude-App ganz beenden und neu starten');claudeStatus(x);}
    catch(e){toast(e.message,true)}finally{b.disabled=false}};
}
async function mcpInfo(r){
  if(!$('#mcpUrl'))return;
  try{r=r||await api('/api/mcp-info',{});}catch(e){$('#mcpUrl').value='nicht verfügbar: '+e.message;return;}
  $('#mcpUrl').value=r.url;$('#mcpTok').value=r.token;$('#mcpOc').value=r.opencode;$('#mcpCc').value=r.claude_code;$('#mcpGen').value=r.generic;
  $('#mcpShow').onclick=()=>{const t=$('#mcpTok');t.type=t.type==='password'?'text':'password';$('#mcpShow').textContent=t.type==='password'?'Zeigen':'Verbergen';};
  $('#mcpNew').onclick=async()=>{if(!await ask('Neuen Schlüssel erzeugen?','Alle KI-Werkzeuge, die den alten Schlüssel verwenden, verlieren die Verbindung und müssen neu eingerichtet werden.','Neu erzeugen',true))return;
    try{mcpInfo(await api('/api/mcp-token',{}));toast('Neuer Schlüssel erzeugt');}catch(e){toast(e.message,true)}};
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText($('#'+b.dataset.copy).value);toast('Kopiert');}catch(e){$('#'+b.dataset.copy).select();toast('Bitte mit Strg+C kopieren');}});
}
async function checkPi(){
  const inp=document.querySelector('[data-k="pixinsight"]'), out=$('#piCheck'); if(!inp||!out)return;
  try{const r=await api('/api/check-pixinsight',{path:inp.value});
    if(r.path&&r.path!==inp.value&&r.exists)inp.value=r.path;
    out.innerHTML=`<span style="color:${r.ok?'var(--ok)':'var(--err)'};font-weight:700">${r.ok?'✓':'✗'}</span> ${esc(r.message)}`;}catch(e){out.textContent=''}
}
$('#setSave').onclick=async()=>{
  const d={};document.querySelectorAll('#setBody [data-k]').forEach(i=>{const f=SETF.find(x=>x[0]===i.dataset.k);d[i.dataset.k]=f[2]==='bool'?i.checked:f[2]==='number'?Number(i.value):i.value.trim();});
  document.querySelectorAll('#setBody [data-site]').forEach(i=>d[i.dataset.site]=i.value.trim());
  try{const r=await api('/api/settings',d);S=r;setDlg.close();toast('Gespeichert');
    if(r.move_offer&&r.move_offer.projects.length&&await ask('Projekte verschieben?',`Im bisherigen Arbeitsverzeichnis\n${r.move_offer.old}\nliegen ${r.move_offer.projects.length} Projekt(e): ${r.move_offer.projects.join(', ')}.\n\nIns neue Arbeitsverzeichnis verschieben?`,'Verschieben')){
      const mv=await api('/api/move-projects',{old:r.move_offer.old,projects:r.move_offer.projects});toast(mv.moved.length+' Projekt(e) verschoben');}
    await refresh();render();}catch(e){toast(e.message,true)}
};
$('#setBtn').onclick=()=>{closePops();openSettings(false);};

$('#pSearch').oninput=e=>{pFilter=e.target.value.trim();renderProjects();if(cur.view==='home')renderHome();};
async function offerInstall(){
  const i=S&&S.install; if(!i||!i.offer)return;
  let later=null; try{later=localStorage.getItem('b2-install-later');}catch(e){}
  if(later===S.version)return;
  if(!await ask('b2stacker installieren?',`b2stacker läuft gerade aus\n${i.exe}\n\nInstalliert liegt es immer an derselben Stelle:\n${i.target}\n\nDann funktionieren Updates zuverlässig, die Claude-Verbindung zeigt immer auf die aktuelle Version, und im Startmenü gibt es eine Verknüpfung. Die heruntergeladene Datei kann danach gelöscht werden.`,'Installieren')){
    try{localStorage.setItem('b2-install-later',S.version);}catch(e){} return;}
  try{const r=await api('/api/install',{});
    document.body.innerHTML=`<div style="display:grid;place-items:center;height:100vh;text-align:center;padding:24px"><div><div style="font-size:20px;font-weight:700;margin-bottom:10px">Installiert</div><div style="opacity:.75;max-width:520px">${esc(r.text)}</div></div></div>`;}
  catch(e){toast(e.message,true)}
}
refresh().then(()=>{pollSys();offerInstall();if(S&&S.job&&['queued','running'].includes(S.job.state))cur.view='job';else if(S&&!S.projects.length)cur.view='new';render();});
</script>
</body>
</html>
