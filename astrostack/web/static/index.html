// ---------- Installation und Update
function installLater(){try{return localStorage.getItem('b2-install-later')===(S.boot&&S.boot.version);}catch(e){return false;}}
let UPD=null,updTold=false;
async function pollUpdate(){
  clearTimeout(pollUpdate.t);
  try{UPD=await api('/api/update');}catch(e){UPD=null;}
  const b=$('#updBtn');b.hidden=!(UPD&&UPD.newer);if(UPD&&UPD.newer)b.innerHTML=ic('down-arrow','s14')+' Update '+esc(UPD.latest);
  if(UPD&&UPD.updated_from&&!updTold){updTold=true;toast('Aktualisiert: '+UPD.updated_from+' → '+UPD.current);}
  const dl=UPD&&UPD.download;
  if(dl&&['download','restart'].includes(dl.state)){renderUpdate();pollUpdate.t=setTimeout(pollUpdate,700);return;}
  if($('#updDlg').open)renderUpdate();
  pollUpdate.t=setTimeout(pollUpdate,UPD&&UPD.latest?30*60000:60000);
}
function renderUpdate(){
  const u=UPD||{},d=u.download,act=[...S.tasks.values()].length>0;
  $('#updTitle').textContent=u.newer?`Version ${u.latest} ist da`:'b2stacker';
  let h=`<div class="meta" style="border:0;padding:0;max-width:360px"><span>Installiert</span><span><b>${esc(u.current||(S.boot&&S.boot.version)||'?')}</b></span>${u.latest?`<span>Neueste</span><span>${esc(u.latest)}${u.published?' · '+ymd(u.published):''}</span>`:''}</div>`;
  if(u.notes)h+=`<div class="notes">${esc(u.notes)}</div>`;
  if(d&&d.state==='download'){const pc=d.total?Math.round(100*d.done/d.total):0;
    h+=`<div>Lade neue Version … ${pc} % (${num(d.done/1048576,0)} von ${num((d.total||0)/1048576,0)} MB)<div class="pbar"><div style="width:${pc}%"></div></div></div>`;}
  else if(d&&d.state==='restart')h+=`<div><b>Starte neu …</b> Ein kleines Fenster zeigt den Austausch; b2stacker öffnet sich gleich in der neuen Version.</div>`;
  else{
    if(d&&d.state==='error')h+=`<div class="errc">Update fehlgeschlagen: ${esc(d.error||'')}</div>`;
    if(u.newer&&!u.can_install)h+=`<div class="small muted">Aus dem Quellcode gestartet – bitte mit <span class="mono">git pull</span> aktualisieren.</div>`;
    else if(u.newer&&act)h+=`<div class="small muted">Gerade läuft ein Auftrag – das Update geht, sobald er fertig ist.</div>`;
    else if(u.latest&&!u.newer)h+=`<div class="okc">${ic('check','s14')} Du hast die neueste Version.</div>`;
    h+=`<div class="row" style="gap:8px">${u.newer&&u.can_install?`<button class="btn primary" id="updGo" ${act?'disabled':''}>Jetzt aktualisieren und neu starten</button>`:''}
      <button class="btn" id="updChk">${ic('refresh','s14')} Nach Updates suchen</button></div>`;
    if(u.error)h+=`<div class="small muted">Prüfung nicht möglich: ${esc(u.error)}</div>`;
  }
  $('#updBody').innerHTML=h;
  const g=$('#updGo');if(g)g.onclick=()=>busy(g,async()=>{const r=await api('/api/update/install',{});UPD=Object.assign(UPD||{},{download:r});renderUpdate();pollUpdate.t=setTimeout(pollUpdate,700);});
  const c=$('#updChk');if(c)c.onclick=()=>busy(c,async()=>{UPD=await api('/api/update/check',{});updTold=true;$('#updBtn').hidden=!UPD.newer;renderUpdate();});
}

$('#updBtn').onclick=openUpdate;
setTimeout(pollUpdate,1500);

}
function mRow(m){
  const i=m.info||{},bits=[];
  if(i.frames)bits.push(plural(i.frames,'Frame','Frames'));
  if(i.filter&&m.type==='flat')bits.push(esc(i.filter));
  if(i.exposure!=null&&m.type!=='bias')bits.push(num(i.exposure,i.exposure<10?2:0)+' s');
  if(i.gain!=null)bits.push('Gain '+int(i.gain));
  if(i.offset!=null)bits.push('Offset '+int(i.offset));
  if(i.temp!=null)bits.push(num(i.temp,0)+' °C');
  if(i.binning)bits.push('Bin '+esc(i.binning));
  const nights=(i.nights||[]).length?(i.nights.length===1?'Nacht '+ymd(i.nights[0]):`${i.nights.length} Nächte, ${ymd(i.nights[0])} – ${ymd(i.nights[i.nights.length-1])}`):'';
  const used=(m.projects||[]).map(p=>`<a class="lnk" href="#/p/${p.id}/stacks">${esc(p.name)}</a>`).join(', ');
  return `<div class="mrow ${m.exists?'':'off'}"><div class="mi">${ic(m.exists?'layers':'warn')}</div>
    <div class="mt"><div class="mn ell" title="${esc(m.path)}">${bits.join(' · ')||esc(m.name)}</div>
      <div class="mx">${i.camera?esc(i.camera)+' · ':''}${nights?nights+' · ':''}angelegt ${ago(m.created_at)} in ${esc(m.project)}${m.exists?'':' · <span class="errc">Datei fehlt</span>'}</div>
      <div class="mx">${m.stacks?`in ${plural(m.stacks,'Stack','Stacks')} verwendet${used?': '+used:''}`:'noch in keinem Stack'}</div></div>
    <div class="ms">${m.size?gb(m.size):''}</div><button class="btn sm ghost" data-mdel="${m.id}" title="Master entfernen">${ic('trash','s14')}</button></div>`;
}

async function renderSelftests(){
  const box=$('#stList');if(!box)return;
  let l;try{l=await api('/api/selftest');}catch(e){box.innerHTML='';return;}
  if(!$('#stList'))return;
  box.innerHTML=l.length?l.slice(0,3).map(r=>`<div class="bkr"><span class="pill ${r.ok?'ok':'err'}">${r.ok?'bestanden':'Problem'}</span><span class="bd2 grow">${esc(ymd(r.started)+' '+hm(r.started))}${r.environment&&r.environment.pixinsight_version?' · '+esc(r.environment.pixinsight_version):''}${r.environment&&r.environment.test_folder_remote?' · NAS':''}${r.duration_s?' · '+Math.max(1,Math.round(r.duration_s/60))+' min':''}
    ${r.ok?'':'<div class="small errc">'+esc((r.steps.filter(x=>!x.ok&&!x.optional).map(x=>x.name+(x.detail?': '+x.detail:'')).join(' · ')).slice(0,300))+'</div>'}</span></div>`).join(''):'';

// ---------- Datenbank-Sicherungen (Einstellungen)
async function renderBackups(){
  const box=$('#bkList');if(!box)return;
  let l=[];try{l=await api('/api/backups');}catch(e){box.innerHTML=`<div class="bkr"><span class="bd2">${esc(e.message)}</span></div>`;return;}
  const LBL={'vor-wiederherstellen':'vor dem Wiederherstellen'};
  const lab=x=>x.label?(LBL[x.label]||x.label.replace(/^vor-update-v(\d+)$/,'vor Update auf Version $1')):'';
  box.innerHTML=l.length?l.slice(0,20).map(x=>`<div class="bkr"><span class="bd1">${esc(x.at?ymd(x.at)+' '+hm(x.at):x.name)}${lab(x)?` <span class="small muted">· ${esc(lab(x))}</span>`:''}</span>
      <span class="bd2">${bytes(x.size)} · ${x.places.map(p=>p==='system'?'im Arbeitsverzeichnis':'am Sicherungsort').join(' und ')}</span>
      <button class="btn sm" type="button" data-restore="${esc(x.name)}">Wiederherstellen</button></div>`).join(''):
    `<div class="bkr"><span class="bd2">Noch keine Sicherung. Beim Start wird automatisch gesichert, sobald sich etwas geändert hat.</span></div>`;
  $$('[data-restore]',box).forEach(b=>b.onclick=async()=>{
    const x=l.find(y=>y.name===b.dataset.restore);
    if(!await ask('Sicherung zurückspielen?',`Stand vom ${x.at?ymd(x.at)+' '+hm(x.at):x.name}.\n\nDer jetzige Stand wird vorher gesichert – du kannst also zurück. Laufende Prüfungen werden abgebrochen, während gestackt wird geht es nicht. Deine Bilddateien bleiben unberührt.`,'Wiederherstellen',true))return;
    busy(b,async()=>{await api('/api/backups/restore',{name:x.name});setDlg.close();toast('Sicherung zurückgespielt – alles wird neu geladen.');S.P=null;S.F=null;GV.list=null;await reloadAll();});
  });
}

const SETF=[

  ['pixinsight','PixInsight-Programm','text','Normalerweise C:\\Program Files\\PixInsight\\bin\\PixInsight.exe','file'],
  ['backup_dir','Zusätzlicher Sicherungsort','text','Jede Datenbank-Sicherung landet im Arbeitsverzeichnis und zusätzlich hier – z. B. auf einer anderen Platte oder dem NAS. Je Ort bleiben die letzten 10. Leer = nur im Arbeitsverzeichnis.','folder'],
  ['analysis_workers','Gleichzeitige Vermessungen','number','Mehr = schneller, braucht aber mehr RAM (je ~1 GB).'],
  ['watch_interval_s','Neue Dateien suchen alle (s)','number','So oft schaut b2stacker in deine Ordner. Offline-Quellen werden übersprungen.'],

  ['open_results','Ergebnis nach dem Stacken in PixInsight öffnen','bool',''],
];
function openSettings(){
  const s=(S.boot&&S.boot.settings)||{};
  const pick=(k,kind)=>`<button class="btn" type="button" data-pick="${k}" data-kind="${kind}">Durchsuchen …</button>`;
  const one=([k,l,t,d,kind])=>`<div class="field"><label for="set_${k}">${l}</label>
      <div class="frow"><input type="${t}" id="set_${k}" data-k="${k}" value="${esc(s[k]??'')}" ${t==='text'&&k!=='timezone'?'class="mono" style="font-size:13.5px"':''}>${kind?pick(k,kind):''}</div>
      ${d?`<div class="d">${esc(d)}</div>`:''}${k==='pixinsight'?'<div class="d chk" id="piCheck"></div>':''}</div>`;
  const txt=SETF.filter(f=>f[2]!=='bool'&&f[0]!=='backup_dir');
  $('#setBody').innerHTML=txt.filter(f=>f[4]).map(one).join('')+`<div class="grid3">${txt.filter(f=>!f[4]).map(one).join('')}</div>`+
    `<div class="field"><label>Ersatz-Standort</label><div class="frow">
      ${[['site_lat','Breite','48,86'],['site_lon','Länge','15,01'],['site_elev','Höhe (m)','500']].map(([k,l,ph])=>`<input type="text" inputmode="decimal" data-site="${k}" aria-label="${l}" placeholder="${l}, z. B. ${ph}" value="${s[k]==null?'':esc(String(s[k]).replace('.',','))}" style="flex:1 1 0">`).join('')}</div>
      <div class="d">Gilt, wenn die Aufnahmen keinen Standort enthalten (Mondstand, Zuordnung zur Nacht). Leer lassen = keiner.</div></div>`+
    `<div>${SETF.filter(f=>f[2]==='bool').map(([k,l,,d])=>`<label class="optline"><span class="grow"><div class="t">${l}</div>${d?`<div class="d">${esc(d)}</div>`:''}</span><span class="switch"><input type="checkbox" data-k="${k}" ${s[k]?'checked':''}><span></span></span></label>`).join('')}</div>`+
    `<div class="dsec">Wartung</div>
    <div class="row"><button class="btn" id="bkBtn" type="button">${ic('disk','s14')} Datenbank jetzt sichern</button><button class="btn" id="tmpBtn" type="button">Temp-Dateien löschen</button></div>
    ${one(SETF.find(f=>f[0]==='backup_dir'))}
    <div class="field"><span class="lbl">Sicherungen der Datenbank</span><div class="bkl" id="bkList"><div class="bkr"><span class="bd2">wird geladen …</span></div></div>
      <div class="d">Wiederherstellen ersetzt Projekte, Entscheidungen, Pläne und Verlauf durch den gesicherten Stand – sofort, ohne Neustart. Vorher wird der jetzige Stand gesichert. Bilddateien und Stacks auf der Platte bleiben, wie sie sind.</div></div>
    <div class="field"><span class="lbl">Selbsttest mit PixInsight</span>
      <div class="frow"><input type="text" class="mono" id="stFolder" style="font-size:13.5px" placeholder="Ordner für die Testdaten (leer = Arbeitsverzeichnis)" aria-label="Ordner für die Testdaten">${pick('stFolder','folder')}<button class="btn" type="button" id="stBtn">Starten</button></div>
      <div class="bkl" id="stList"></div>
      <div class="d">Legt einen kleinen Testdatensatz an (Ordnername mit Komma), liest ihn ein und stackt zweimal mit PixInsight – das zweite Mal mit den gespeicherten Mastern. Für den NAS-Test einen Ordner auf dem NAS wählen. Dauert einige Minuten; deine Projekte bleiben unberührt.</div></div>`+
    `<div class="dsec">Handy (Heimnetz)</div>
    <div class="field"><label class="optline"><span class="grow"><div class="t">Vom Handy im Heimnetz erreichbar</div><div class="d">Frames sichten, aussortieren, Plan ändern und Stacken vom Handy oder Tablet im selben WLAN. Nur gekoppelte Geräte mit privater Adresse; Rohdaten löschen und Einstellungen gehen nur hier am Computer.</div></span><span class="switch"><input type="checkbox" id="lanOn"><span></span></span></label>
      <div id="lanBox"></div></div>`+
    `<div class="dsec">KI-Bedienung (MCP)</div>
    <div class="field"><div class="frow"><input type="text" class="mono" id="mcpUrl" readonly style="font-size:13px" aria-label="MCP-Adresse"><button class="btn sm" type="button" data-copy="mcpUrl">Kopieren</button></div>
      <div class="frow"><input type="password" class="mono" id="mcpTok" readonly style="font-size:13px" aria-label="Schlüssel"><button class="btn sm" type="button" id="mcpShow">Zeigen</button><button class="btn sm" type="button" data-copy="mcpTok">Kopieren</button><button class="btn sm" type="button" id="mcpNew" title="Der alte Schlüssel wird ungültig">Neu erzeugen</button></div>
      <details><summary class="small">Fertige Einstellungen zum Kopieren</summary>
        <div class="small" style="margin:8px 0 4px">OpenCode (<span class="mono">opencode.json</span>):</div><textarea id="mcpOc" class="mono" readonly rows="6" style="font-size:12px"></textarea>
        <div class="small" style="margin:8px 0 4px">Claude Code (Terminal):</div><textarea id="mcpCc" class="mono" readonly rows="2" style="font-size:12px"></textarea>
        <div class="small" style="margin:8px 0 4px">Andere (mcpServers-Format):</div><textarea id="mcpGen" class="mono" readonly rows="6" style="font-size:12px"></textarea></details>
      <div class="d">MCP über HTTP, nur auf diesem Rechner erreichbar. Den Schlüssel wie ein Passwort behandeln.</div></div>`+
    `<div class="row" style="border-top:1px solid var(--div);padding-top:14px"><div class="small grow muted">Version ${esc(S.boot?S.boot.version:'')} (<button class="lnk small" type="button" id="setUpd">nach Updates suchen</button>) · Arbeitsverzeichnis jetzt: <span class="mono">${esc(S.boot?S.boot.workdir:'')}</span></div>
      <button class="btn sm danger" id="quitBtn" type="button">b2stacker beenden</button></div>`;
  $$('#setBody [data-pick]').forEach(b=>b.onclick=()=>busy(b,async()=>{const inp=$('#set_'+b.dataset.pick)||$('#'+b.dataset.pick);
    const r=await api(b.dataset.kind==='file'?'/api/pick-file':'/api/pick-folder',{initial:inp.value});if(r.path){inp.value=r.path;if(b.dataset.kind==='file')checkPi(inp,$('#piCheck'));}}));
  const pi=$('#set_pixinsight');pi.onchange=()=>checkPi(pi,$('#piCheck'));checkPi(pi,$('#piCheck'));
  $('#bkBtn').onclick=e=>busy(e.currentTarget,async()=>{const r=await api('/api/backup',{});toast('Gesichert: '+r.path);renderBackups();});
  renderBackups();renderSelftests();
  $('#stBtn').onclick=e=>busy(e.currentTarget,async()=>{await api('/api/selftest',{folder:$('#stFolder').value.trim()});toast('Selbsttest gestartet – Fortschritt oben bei den Aufträgen');});
  $('#tmpBtn').onclick=e=>busy(e.currentTarget,async()=>{const r=await api('/api/clear-temp',{});toast(r.removed?plural(r.removed,'Eintrag','Einträge')+' gelöscht':'Temp-Ordner war schon leer');});
  $('#quitBtn').onclick=async()=>{const a=[...S.tasks.values()].some(t=>t.state==='running');
    if(!await ask('b2stacker beenden?',a?'Es läuft gerade ein Auftrag – er wird abgebrochen.':'','Beenden',true))return;
    try{await api('/api/quit',{});}catch(e){}
    if(ES)ES.close();clearTimeout(esRetry);
    document.body.innerHTML='<div style="display:grid;place-items:center;height:100vh;opacity:.6">b2stacker wurde beendet. Dieses Fenster kann geschlossen werden.</div>';};
  $('#setUpd').onclick=()=>{setDlg.close();openUpdate();};
  lanInfo();
  $('#lanOn').onchange=e=>{const on=e.target.checked;e.target.disabled=true;
    api('/api/lan',{enabled:on}).then(r=>lanInfo(r)).catch(err=>{toast(err.message,true);e.target.checked=!on;}).finally(()=>{e.target.disabled=false;});};
  mcpInfo();
  setDlg.showModal();
}
async function lanInfo(r){
  const box=$('#lanBox');if(!box)return;
  try{r=r||await api('/api/lan-info',{});}catch(e){box.innerHTML=`<div class="d errc">${esc(e.message)}</div>`;return;}
  if(!$('#lanBox'))return;
  $('#lanOn').checked=!!r.enabled;
  if(!r.enabled){box.innerHTML='';return;}
  if(!r.running){box.innerHTML=`<div class="d errc">${ic('warn','s14')} Nicht erreichbar: ${esc(r.error||'Zugang startet nicht')}</div>`;return;}
  if(!r.urls.length){box.innerHTML=`<div class="d warnc">${ic('warn','s14')} Kein Heimnetz gefunden – ist der Computer per WLAN oder Kabel verbunden?</div>`;return;}
  box.innerHTML=`<div class="lanqr">${r.qr?`<div class="qr" aria-label="QR-Code zum Koppeln">${r.qr}</div>`:''}
    <div class="sec" style="gap:8px;flex:1;min-width:220px"><div class="d" style="margin:0">Mit der Kamera des Handys scannen – das Handy ist danach gekoppelt und kann b2stacker unter dieser Adresse öffnen (Tipp: zum Startbildschirm hinzufügen):</div>
      <div class="mono small">${r.urls.map(esc).join('<br>')}</div>
      <div class="d" style="margin:0">Fragt Windows beim ersten Mal nach der Firewall, „Private Netzwerke“ erlauben.</div>
      <div class="row"><button class="btn sm" type="button" id="lanKey" title="Alle gekoppelten Geräte müssen den QR-Code neu scannen">Alle Handys abmelden</button></div></div></div>`;
  $('#lanKey').onclick=async()=>{if(!await ask('Alle Handys abmelden?','Jedes Gerät muss danach den neuen QR-Code scannen.','Abmelden',true))return;
    try{lanInfo(await api('/api/lan-key',{}));toast('Neuer QR-Code – alle Handys sind abgemeldet');}catch(e){toast(e.message,true);}};
}
async function mcpInfo(r){
  try{r=r||await api('/api/mcp-info',{});}catch(e){$('#mcpUrl').value='nicht verfügbar: '+e.message;return;}
  $('#mcpUrl').value=r.url;$('#mcpTok').value=r.token;$('#mcpOc').value=r.opencode;$('#mcpCc').value=r.claude_code;$('#mcpGen').value=r.generic;
  $('#mcpShow').onclick=()=>{const t=$('#mcpTok');t.type=t.type==='password'?'text':'password';$('#mcpShow').textContent=t.type==='password'?'Zeigen':'Verbergen';};
  $('#mcpNew').onclick=async()=>{if(!await ask('Neuen Schlüssel erzeugen?','Alle KI-Werkzeuge mit dem alten Schlüssel verlieren die Verbindung und müssen neu eingerichtet werden.','Neu erzeugen',true))return;
    try{mcpInfo(await api('/api/mcp-token',{}));toast('Neuer Schlüssel erzeugt');}catch(e){toast(e.message,true);}};
  $$('#setBody [data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText($('#'+b.dataset.copy).value);toast('Kopiert');}catch(e){$('#'+b.dataset.copy).select();toast('Bitte mit Strg+C kopieren');}});
}
async function checkPi(inp,out){
  if(!inp||!out)return false;
  try{const r=await api('/api/check-pixinsight',{path:inp.value});
    if(r.path&&r.path!==inp.value&&r.exists)inp.value=r.path;
    out.innerHTML=`<span class="${r.ok?'okc':'errc'}" style="font-weight:700">${r.ok?'✓':'✗'}</span> ${esc(r.message)}`;return r.ok;}
  catch(e){out.textContent='';return false;}
}
$('#setSave').onclick=()=>busy($('#setSave'),async()=>{
  const d={};
  $$('#setBody [data-k]').forEach(i=>{const f=SETF.find(x=>x[0]===i.dataset.k);d[i.dataset.k]=f[2]==='bool'?i.checked:f[2]==='number'?i.value.trim():i.value.trim();});
  $$('#setBody [data-site]').forEach(i=>d[i.dataset.site]=i.value.trim());
  const r=await api('/api/settings',d);
  setDlg.close();
  toast(r.restart_needed?'Gespeichert – das neue Arbeitsverzeichnis gilt nach einem Neustart von b2stacker.':'Gespeichert');
  await refreshBoot();
});
async function refreshBoot(){try{const b=await api('/api/bootstrap');S.boot=b;S.projects=b.projects;}catch(e){}if(S.route.view==='home')renderHome();}

// Ersteinrichtung: PixInsight finden, Arbeitsverzeichnis wählen, erstes Projekt anlegen
function renderSetup(){
  const b=S.boot||{},s=b.settings||{};
  $('#view').innerHTML=`<div class="setup">
    <div><h1>Willkommen bei b2stacker</h1><p class="sub" style="margin-top:6px">Drei kurze Schritte, dann geht es los. Alles lässt sich später in den Einstellungen ändern.</p></div>
    <div class="card step" id="st1"><span class="num">1</span><div class="sb"><h3>PixInsight finden</h3>
      <div class="small muted">Zum Stacken braucht b2stacker PixInsight mit WBPP. Analysieren und Sortieren geht auch ohne.</div>
      <div class="frow"><input type="text" class="mono" id="suPi" style="font-size:13.5px" value="${esc(s.pixinsight||'')}" aria-label="PixInsight-Programm"><button class="btn" id="suPiPick">Durchsuchen …</button></div>
      <div class="chk" id="suPiChk"></div></div></div>
    <div class="card step" id="st2"><span class="num">2</span><div class="sb"><h3>Arbeitsverzeichnis wählen</h3>
      <div class="small muted">Hier liegen Datenbank, Vorschaubilder und deine Stacks. Am besten eine schnelle, große Platte – nicht OneDrive. Deine Originale bleiben, wo sie sind.</div>
      <div class="frow"><input type="text" class="mono" id="suWd" style="font-size:13.5px" value="${esc(s.workdir||b.workdir||'')}" aria-label="Arbeitsverzeichnis"><button class="btn" id="suWdPick">Durchsuchen …</button></div></div></div>
    <div class="card step" id="st3"><span class="num">3</span><div class="sb"><h3>Erstes Projekt anlegen</h3>
      <div class="small muted">Name und Ordner mit Aufnahmen genügen – b2stacker liest und vermisst alles im Hintergrund.</div>
      <div class="row"><button class="btn primary" id="suGo">Speichern und erstes Projekt anlegen</button><button class="btn ghost" id="suLater">Später</button></div>
      <div class="small" id="suMsg"></div></div></div></div>`;
  const pi=$('#suPi'),chk=$('#suPiChk');
  const mark=ok=>$('#st1').classList.toggle('done',!!ok);
  pi.onchange=async()=>mark(await checkPi(pi,chk));checkPi(pi,chk).then(mark);
  $('#suPiPick').onclick=e=>busy(e.currentTarget,async()=>{const r=await api('/api/pick-file',{initial:pi.value});if(r.path){pi.value=r.path;mark(await checkPi(pi,chk));}});
  $('#suWdPick').onclick=e=>busy(e.currentTarget,async()=>{const p=await pickFolder($('#suWd').value);if(p)$('#suWd').value=p;});
  const finish=()=>{S.setupSkipped=true;try{localStorage.setItem('b2-setup-skip','1');}catch(e){}};
  $('#suLater').onclick=()=>{finish();go('#/');route();};
  $('#suGo').onclick=e=>busy(e.currentTarget,async()=>{
    const r=await api('/api/settings',{pixinsight:pi.value.trim(),workdir:$('#suWd').value.trim()});
    finish();await refreshBoot();
    if(r.restart_needed){$('#suMsg').innerHTML=`<span class="warnc">${ic('info','s14')} Gespeichert. Das neue Arbeitsverzeichnis gilt nach einem Neustart von b2stacker – bitte jetzt neu starten und dann das erste Projekt anlegen.</span>`;return;}
    go('#/');route();openNewProject();
  });
}
