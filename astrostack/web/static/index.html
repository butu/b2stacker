<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="b2stacker">
<title>b2stacker</title>
<style>
/* Neue Oberfläche (Neubau, Teil 1): Startseite, Projekt, Frames, Plan, Einstellungen, Ersteinrichtung.
   Gleiche Gestaltung wie die alte App (Design-Tokens, Symbole, Bauteile), aber ein neuer, schlanker Aufbau. */
:root{
  color-scheme:dark;
  --bg:#0b0b0c;--card:#111113;--tab:#0f0f11;--pop:#141416;--sheet:#1c1c1c;
  --card-line:#222225;--div:#1f1f22;--ring:#26262a;
  --fill:rgba(255,255,255,.08);--fill-2:rgba(255,255,255,.12);--panel:rgba(255,255,255,.05);
  --accent:#3584e4;--info:#78aeed;--info-2:#99c1f1;
  --ok:#8ff0a4;--warn:#f8e45c;--err:#ff938c;
  --ok-bg:rgba(38,162,105,.22);--warn-bg:rgba(205,147,9,.25);--err-bg:rgba(192,28,40,.25);--info-bg:rgba(53,132,228,.25);
  --shadow-pop:0 0 0 1px #26262a,0 12px 32px rgba(0,0,0,.6);
  --shadow-modal:0 0 0 1px #26262a,0 20px 48px rgba(0,0,0,.6);
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#fff;height:100%}
body{display:flex;flex-direction:column;overflow:hidden;
  font:15px/1.45 "SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.4)}
a{color:inherit;text-decoration:none}
svg.i{width:16px;height:16px;flex:none;fill:currentColor;vertical-align:-3px}
svg.i.tiny{width:12px;height:12px;vertical-align:-1px}
svg.i.s14{width:14px;height:14px}
svg.i.s18{width:18px;height:18px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{opacity:.6}
.small{font-size:13px}
.mono{font-family:var(--mono)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.okc{color:var(--ok)}.warnc{color:var(--warn)}.errc{color:var(--err)}.infoc{color:var(--info)}
[hidden]{display:none!important}

/* ---------- Knöpfe, Felder, Schalter */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 12px;border:0;border-radius:6px;background:var(--fill);color:#fff;
  font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--fill-2)}
.btn.primary{background:#fff;color:#0b0b0c;font-weight:700}
.btn.primary:hover{background:#e6e6e6}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--fill)}
.btn.outline{background:transparent;box-shadow:inset 0 0 0 1px var(--ring)}
.btn.outline:hover{background:rgba(255,255,255,.06)}
.btn.icon{width:34px;padding:0}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.sm.icon{width:28px;padding:0}
.btn.big{height:44px;padding:0 28px;border-radius:999px;font-size:16px;font-weight:700}
.btn.danger{color:var(--err)}
.btn.dangerfill{background:var(--err-bg);color:var(--err);font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary:disabled{background:rgba(255,255,255,.25);color:rgba(11,11,12,.8)}
.btn.busy{pointer-events:none;opacity:.7}
.lnk{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;color:var(--info);font-weight:700;cursor:pointer;font-size:14px}
.lnk:hover{text-decoration:underline}
input[type=text],input[type=number],input[type=search],input[type=password],select,textarea{height:34px;padding:0 10px;border:0;border-radius:6px;background:var(--fill);color:#fff;
  font-size:14px;outline:0;color-scheme:dark;min-width:0}
select{cursor:pointer;padding:0 8px}
select option{background:#1c1c1c}
textarea{height:auto;min-height:80px;padding:10px 12px;line-height:1.5;resize:vertical;width:100%}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 2px rgba(53,132,228,.6)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:13px;opacity:.65}
.field .d{font-size:13px;opacity:.6;text-wrap:pretty}
.frow{display:flex;gap:8px;align-items:center}
.frow input{flex:1;min-width:0}
.kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:5px;background:var(--fill-2);box-shadow:inset 0 -1px 0 rgba(0,0,0,.4);
  font:700 12px var(--mono)}
.switch{position:relative;width:42px;height:24px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.15);cursor:pointer;transition:background .15s}
.switch span:before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:#fff;transition:left .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{left:21px}
.switch input:focus-visible+span{box-shadow:0 0 0 2px rgba(53,132,228,.6)}
.switch input:disabled+span{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:8px;background:rgba(255,255,255,.06);flex-wrap:wrap}
.seg button{height:28px;padding:0 11px;border:0;border-radius:6px;background:transparent;color:#fff;font-size:13.5px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--fill-2);font-weight:700}
.seg button:hover:not(.on){background:rgba(255,255,255,.05)}
.seg button .n{opacity:.55;font-weight:400;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.err{background:var(--err-bg);color:var(--err)}
.pill.info{background:var(--info-bg);color:var(--info-2)}
.pill.neutral{background:var(--fill);color:#fff}
.fic{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.fic.lg{width:20px;height:20px;border-radius:5px;vertical-align:-5px}
.ftag{display:inline-flex;align-items:center;gap:6px;font-weight:700}

/* ---------- Kopfzeile */
header.hb{flex:none;position:relative;z-index:20;height:48px;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--bg);box-shadow:0 1px 0 var(--div)}
.wordmark{padding:0 10px;font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;font-size:14px;opacity:.7}
.crumb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#fff;font-size:14px;cursor:pointer;white-space:nowrap;min-width:0}
.hbtn:hover{background:rgba(255,255,255,.1)}
.hbtn.icon{width:34px;padding:0;justify-content:center}
.tind{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border:0;border-radius:999px;background:var(--info-bg);color:var(--info-2);font-size:13.5px;font-weight:700;cursor:pointer;max-width:420px;min-width:0}
.tind:hover{background:rgba(53,132,228,.35)}
.tind.idle{background:transparent;color:rgba(255,255,255,.55);font-weight:500}
.tind.idle:hover{background:var(--fill)}
.tind.fail{background:var(--err-bg);color:var(--err)}
.tind .ell{min-width:0}
.minibar{width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;flex:none}
.minibar>span{display:block;height:100%;background:currentColor}
.conn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:700}
/* Popover */
#popBack{position:fixed;inset:0;z-index:25}
.pop{position:fixed;z-index:30;background:var(--pop);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;display:flex;flex-direction:column;max-width:calc(100vw - 16px);max-height:min(70vh,560px);overflow:auto}
.pop .mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:14px;cursor:pointer;border:0;background:none;color:inherit;text-align:left;width:100%}
.pop .mi:hover{background:rgba(255,255,255,.1)}
.pop .sep{height:1px;background:var(--fill);margin:4px 6px}
.pop .ph{font-size:12px;font-weight:700;opacity:.5;padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.05em}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px;border-radius:8px;align-items:center}
.trow+.trow{border-top:1px solid var(--div)}
.trow .tt{font-size:14px;font-weight:600;min-width:0}
.trow .ts{font-size:13px;opacity:.7;grid-column:1/-1}
.trow .bar6{grid-column:1/-1}
.trow.fin .tt{font-weight:500;opacity:.8}
.bar6{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar6>div{height:100%;background:var(--accent);transition:width .4s}
.bar6.indet>div{width:30%!important;animation:indet 1.6s infinite ease-in-out}
@keyframes indet{0%{margin-left:-30%}100%{margin-left:100%}}

/* ---------- Layout */
main.view{flex:1;min-height:0;overflow:auto;padding:28px 24px 80px;scroll-padding-top:60px}
.wrap{width:100%;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
h3{margin:0;font-size:16px;font-weight:700}
.sub{margin:0;font-size:14px;opacity:.65;text-wrap:pretty}
.sec{display:flex;flex-direction:column;gap:12px}
.sechd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:12px}
.empty{background:var(--tab);border-radius:12px;padding:48px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.empty .t{font-size:18px;font-weight:700}
.empty .x{font-size:14px;opacity:.7;max-width:460px;text-wrap:pretty}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;border-radius:12px;padding:12px 14px 12px 16px;background:var(--card);border:1px solid var(--card-line)}
.banner.warn{background:rgba(205,147,9,.16);border-color:transparent}
.banner.err{background:rgba(192,28,40,.18);border-color:transparent}
.banner.ok{background:rgba(38,162,105,.14);border-color:transparent}
.banner .bt{font-weight:700}
.banner .bx{font-size:14px;opacity:.85;text-wrap:pretty}
/* Live-Hinweis (dezent, nie blockierend) */
.live{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--info-2);min-height:20px}
.live .bar6{width:120px;flex:none}
.live .lt{min-width:0}
.live+.live{margin-top:4px}
#pLive:empty{display:none}
.live.q{color:rgba(255,255,255,.55)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:#262626;border-radius:999px;padding:9px 20px;box-shadow:0 2px 10px rgba(0,0,0,.4);
  font-size:14px;max-width:90vw;text-wrap:pretty;text-align:center}
.toast.err{background:#3a1d20;color:#ffd5d1}

/* ---------- Startseite */
.homehd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:6px;background:var(--fill);flex:0 1 300px;min-width:180px}
.search svg{opacity:.6}
.search input{flex:1;min-width:0;height:auto;padding:0;border:0;background:transparent;box-shadow:none!important;font-size:14px}
.tog{display:inline-flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;user-select:none}
.mhd{font-size:13px;font-weight:700;opacity:.55;text-transform:uppercase;letter-spacing:.06em;margin:6px 0 -6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.tile{background:var(--card);border:1px solid var(--card-line);border-radius:12px;cursor:pointer;display:flex;flex-direction:column;transition:background .15s,border-color .15s;text-align:left;padding:0;color:#fff;min-width:0}
.tile:hover{background:#18181b;border-color:#2c2c30}
.tile:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.tile .ph{aspect-ratio:16/9;background:#0d0d10 center/cover no-repeat;position:relative;border-radius:11px 11px 0 0;overflow:hidden}
.tile .ph .ini{position:absolute;left:14px;bottom:10px;font-size:13px;font-weight:700;letter-spacing:.04em;opacity:.45}
.tile .badges{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;justify-content:space-between;pointer-events:none}
.tile .badges .pill{background:rgba(15,15,15,.85)}
.tile .badges .pill.err{color:var(--err)}
.tile .badges .pill.busy{color:var(--info-2);margin-left:auto}
.tile .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .tn{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .obj{font-size:12.5px;opacity:.5;font-weight:500;margin-left:6px}
.hrs{display:flex;align-items:baseline;gap:6px}
.hrs b{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.hrs .u{font-size:15px;font-weight:700;opacity:.8}
.hrs .l{font-size:13px;opacity:.55;margin-left:4px}
.fbars{display:flex;flex-direction:column;gap:4px}
.fbr{display:grid;grid-template-columns:minmax(52px,auto) minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:12.5px}
.fbr .fn{display:flex;align-items:center;gap:6px;opacity:.8;white-space:nowrap;overflow:hidden}
.fbr .fb{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.fbr .fb>i{display:block;height:100%;border-radius:3px}
.fbr .fh{text-align:right;opacity:.7}
.tnew{font-size:13px;color:var(--info-2);font-weight:600}
.tmeta{font-size:12.5px;opacity:.45;display:flex;flex-wrap:wrap;gap:2px 12px}
.tbusy{font-size:13px;color:var(--info-2);display:flex;align-items:center;gap:6px;min-width:0}
.tbusy span{min-width:0}
.tile.new{border:1px dashed rgba(255,255,255,.2);background:transparent;min-height:260px;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;color:rgba(255,255,255,.75)}
.tile.new:hover{background:rgba(255,255,255,.04);color:#fff}
.plus{width:44px;height:44px;border-radius:999px;background:var(--fill);display:grid;place-items:center}

/* ---------- Projektseite */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;opacity:.65;align-self:flex-start}
.back:hover{opacity:1}
.back svg{transform:rotate(180deg)}
.phead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 20px}
.phead .pl{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 420px}
.phead .pt{display:flex;align-items:center;gap:8px;min-width:0}
.phead h1{min-width:0;overflow-wrap:anywhere}
.phead .pt input{font-size:26px;font-weight:700;height:44px;flex:1;max-width:560px}
.pdesc{margin:0;max-width:75ch;font-size:15px;opacity:.8;text-wrap:pretty;white-space:pre-line;cursor:text;border-radius:6px;padding:2px 4px;margin-left:-4px}
.pdesc:hover{background:var(--panel)}
.pdesc.none{opacity:.45;font-style:italic}
.pmeta{font-size:14px;opacity:.6;display:flex;flex-wrap:wrap;gap:2px 14px}
.editbtn{width:32px;height:32px;flex:none;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;color:rgba(255,255,255,.5);cursor:pointer}
.editbtn:hover{background:var(--fill);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--div);overflow-x:auto;scrollbar-width:none}
.tabs a{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:2px solid transparent;font-size:14.5px;opacity:.65;white-space:nowrap;margin-bottom:-1px}
.tabs a:hover{opacity:1}
.tabs a.on{opacity:1;font-weight:700;border-bottom-color:#fff}
.tabs a .n{font-weight:400;opacity:.6;font-size:13px}
.tabs a .soon{font-size:11px;font-weight:700;opacity:.6;padding:1px 6px;border-radius:5px;background:var(--fill)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat span{font-size:12.5px;opacity:.55}
.stat b{font-size:24px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{font-size:13px;opacity:.6}
.cols2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.clist{display:flex;flex-direction:column}
.citem{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--div);font-size:14px}
.citem:first-child{border-top:0}
.citem .ci{flex:none;margin-top:1px}
.citem .cx{min-width:0;text-wrap:pretty}
.citem .cx small{display:block;opacity:.6;font-size:13px;margin-top:2px}
.cardhd{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.srcrow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--div)}
.srcrow .p{flex:1;min-width:0;font:13px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.srcrow .n{font-size:13px;opacity:.6;white-space:nowrap}
.srcadd{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--div)}
.srcadd input{flex:1}

/* ---------- Frames */
.fbar{position:sticky;top:-28px;z-index:5;background:var(--bg);padding:10px 0;margin:-10px 0 -8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;box-shadow:0 1px 0 var(--div)}
.fsum{font-size:13.5px;opacity:.65;display:flex;flex-wrap:wrap;gap:2px 12px}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:10px;background:var(--info-bg)}
.selbar b{font-size:14px;margin-right:6px}
.vgrid{position:relative;width:100%}
.vt{position:absolute;left:0;top:0;display:flex;flex-direction:column;gap:5px;cursor:pointer;user-select:none}
.vt .ph{position:relative;flex:1;border-radius:8px;overflow:hidden;background:#101013;display:grid;place-items:center;color:rgba(255,255,255,.35);font-size:12px}
.vt .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vt.skip .ph img{opacity:.38}
.vt.skip .ph{box-shadow:inset 0 0 0 1.5px rgba(255,147,140,.35)}
.vt.sel .ph{box-shadow:inset 0 0 0 3px var(--accent)}
.vt:hover .ph{filter:brightness(1.12)}
.vt .cb{position:absolute;top:6px;left:6px;z-index:2;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:rgba(15,15,15,.6);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.7);color:#fff;opacity:0;transition:opacity .1s}
.vt:hover .cb,.vgrid.selmode .vt .cb,.vt.sel .cb{opacity:1}
.vt.sel .cb{background:var(--accent);box-shadow:none}
.vt .cb svg{display:none;width:14px;height:14px}
.vt.sel .cb svg{display:block}
.vt .mk{position:absolute;top:6px;right:6px;z-index:2;padding:1px 7px;border-radius:999px;background:rgba(15,15,15,.85);font-size:11px;font-weight:700}
.vt .why{position:absolute;left:6px;right:6px;bottom:6px;z-index:2;justify-self:start;max-width:calc(100% - 12px);padding:2px 8px;border-radius:999px;background:rgba(15,15,15,.88);
  font-size:11.5px;font-weight:700;color:var(--err);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:max-content}
.vt .fx{display:flex;justify-content:space-between;gap:6px;font-size:12px;padding:0 2px;min-width:0;height:17px;line-height:17px}
.vt .fx span:first-child{opacity:.85;white-space:nowrap}
.vt .fx .m{opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dotok{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.dotno{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--err);margin-right:5px;vertical-align:1px}
.vt.del .ph{box-shadow:inset 0 0 0 2px var(--err)}
.vt .mk.del{color:var(--err);display:inline-flex;align-items:center;gap:4px}
.dlist{display:flex;flex-direction:column;border-radius:10px;background:var(--card);max-height:42vh;overflow:auto}
.dl{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:12px;align-items:center;padding:7px 12px;font-size:13.5px;border-top:1px solid var(--card-line)}
.dl:first-child{border-top:0}.dl .m{opacity:.6;white-space:nowrap}.dl.off{opacity:.55}
.dbtn.del.on{box-shadow:inset 0 0 0 2px var(--err)}
.lh{font-size:15px;margin:0;display:flex;gap:8px;align-items:center}.lh .n{opacity:.5;font-weight:600}
.mlist{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--card-line)}
.mrow:first-child{border-top:0}.mrow.off{opacity:.6}.mrow .mi{opacity:.7;display:grid;place-items:center}
.mrow .mn{font-weight:700;font-size:14.5px}.mrow .mx{font-size:13px;opacity:.65;margin-top:2px}.mrow .ms{font-size:13px;opacity:.7;white-space:nowrap}
.keys{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;opacity:.55}

/* ---------- Großansicht (Lightbox) */
.lb{position:fixed;inset:0;z-index:50;background:#08080a;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:52px minmax(0,1fr)}
.lbtop{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 8px 0 18px;border-bottom:1px solid rgba(255,255,255,.06);min-width:0}
.lbtop .lbn{min-width:0;font-size:14px;opacity:.6}
.lbimg{position:relative;display:grid;place-items:center;overflow:hidden;min-height:0;background:#000;touch-action:none}
.lbimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.lbimg img.soft{filter:blur(1px);opacity:.85}
.zoomt{position:absolute;inset:0;transform-origin:0 0}
.zoomt.zoomed{cursor:grab}.zoomt.zoomed:active{cursor:grabbing}
.stsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.stsvg ellipse{fill:none;stroke-width:1.5}
.zoomi{position:absolute;left:12px;bottom:12px;z-index:3;padding:3px 10px;border-radius:999px;background:rgba(15,15,15,.85);font-size:12.5px;font-weight:700;pointer-events:none}
.cmpbox{transform-origin:0 0}
.hbtn.on{background:rgba(255,255,255,.16)}
.hbtn.upd{background:var(--info-bg);color:var(--info-2);font-weight:700}
#updDlg .notes{white-space:pre-wrap;max-height:260px;overflow:auto;background:var(--card);border-radius:8px;padding:10px 12px;font-size:13px}
.pbar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}.pbar>div{height:100%;background:var(--accent)}
.stinfo{font-size:13px;opacity:.75;text-wrap:pretty}
.touchonly{display:none}
body.remote #setBtn,body.remote #updBtn,body.remote [data-mdel],body.remote #instBtn,body.remote #instLater,body.remote #hPi{display:none!important}
.lanqr{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.lanqr .qr{background:#fff;border-radius:10px;padding:6px;line-height:0}.lanqr .qr svg{width:168px;height:168px}
@media (pointer:coarse){.touchonly{display:inline}.dbtn .kbd,.lbkeys>span:not(.touchonly){display:none}}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;display:grid;place-items:center}
.lbnav:hover{background:rgba(255,255,255,.2)}
.lbnav.l{left:14px}.lbnav.r{right:14px}
.lbnav:disabled{opacity:.15;cursor:default}
.lbmsg{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:8px 18px;border-radius:999px;background:rgba(20,20,22,.92);box-shadow:0 0 0 1px #2a2a2e;font-size:14px;font-weight:700;pointer-events:none}
.lbload{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:8px;font-size:13px;opacity:.7;padding:4px 10px;border-radius:999px;background:rgba(20,20,22,.8)}
.lbside{background:var(--sheet);border-left:1px solid rgba(0,0,0,.5);padding:18px;display:flex;flex-direction:column;gap:16px;overflow:auto;min-height:0}
.lbst{display:flex;flex-direction:column;gap:4px}
.lbst .r{font-size:13.5px;opacity:.75;text-wrap:pretty}
.dbtns{display:flex;flex-direction:column;gap:6px}
.dbtn{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:0;border-radius:8px;background:var(--fill);color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;text-align:left}
.dbtn:hover{background:var(--fill-2)}
.dbtn .g{flex:1}
.dbtn.on.use{background:rgba(38,162,105,.35);box-shadow:inset 0 0 0 1px rgba(143,240,164,.45)}
.dbtn.on.skip{background:rgba(192,28,40,.45)}
.dbtn.auto{height:36px;background:transparent;color:var(--info);font-size:14px}
.dbtn.auto:hover{background:rgba(120,174,237,.1)}
.dbtn.del{height:36px;background:transparent;color:var(--err);font-size:14px}.dbtn.del:hover{background:rgba(192,28,40,.15)}.dbtn.del.on{background:rgba(192,28,40,.2)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.meta>span:nth-child(odd){opacity:.6}
.meta>span:nth-child(even){text-align:right;min-width:0;overflow-wrap:anywhere}
.lbkeys{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbkeys>span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.fpath{font:12px var(--mono);opacity:.55;word-break:break-all}

/* ---------- Plan */
.runs{display:flex;flex-direction:column;gap:14px}
.run{background:var(--card);border:1px solid var(--card-line);border-radius:14px;display:flex;flex-direction:column}
.run.off>.rtop,.run.off>.rbody{opacity:.55}
.rtop{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;padding:16px}
.rtop .rn{display:flex;align-items:center;gap:12px;flex:1 1 240px;min-width:0}
.rtop .rn>div{min-width:0}
.rtop .rn b{font-size:20px;letter-spacing:-.01em}
.rtop .rn .pr{font-size:13px;opacity:.6;text-wrap:pretty}
.facts{display:flex;gap:22px;flex-wrap:wrap}
.facts>div{display:flex;flex-direction:column;gap:1px;min-width:54px}
.facts span{font-size:12px;opacity:.55}
.facts b{font-size:18px;font-weight:700;white-space:nowrap}
.rbody{border-top:1px solid var(--div);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.rbody>div{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rbody>div+div{border-left:1px solid var(--div)}
.rlab{font-size:12px;font-weight:700;opacity:.5;text-transform:uppercase;letter-spacing:.05em}
.calrow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:4px 10px;align-items:start;font-size:13.5px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04)}
.calrow .cl{font-weight:700}
.calrow .cv{min-width:0;opacity:.85;text-wrap:pretty}
.whyoff{display:flex;gap:8px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--div);font-size:14px;color:var(--warn)}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:9px 0;border-top:1px solid var(--div)}
.setrow:first-of-type{border-top:0}
.setrow .sn{font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.setrow .sw{font-size:12.5px;opacity:.6;text-wrap:pretty;grid-column:1/-1}
.setrow .sc{display:flex;align-items:center;gap:6px}
.setrow select{height:30px;font-size:13px}
.setrow.pending{opacity:.6}
.adj{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--info-bg);color:var(--info-2)}
.rst{border:0;background:none;color:var(--info);font-size:12.5px;font-weight:700;cursor:pointer;padding:0}
.rst:hover{text-decoration:underline}
.ro{font-size:13px;opacity:.7}
.chev{display:inline-flex;opacity:.7;transition:transform .15s}
.chev.open{transform:rotate(180deg)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.meter{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.meter .mt{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.meter .mt b{font-weight:700}
.meter .bar6>div.bad{background:var(--err)}
.stackbox{padding:18px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.stackbox .sx{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:4px}
.stackbox .sx b{font-size:17px}
.stackbox .why{font-size:14px;opacity:.7;text-wrap:pretty}
.prog{display:flex;flex-direction:column;gap:6px;width:100%}
.prog .pt{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.prog .pt span:last-child{opacity:.7;white-space:nowrap}

/* ---------- Ersteinrichtung */
.setup{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.step{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;padding:18px}
.step .num{width:32px;height:32px;border-radius:999px;background:var(--fill);display:grid;place-items:center;font-weight:700}
.step.done .num{background:var(--ok-bg);color:var(--ok)}
.step .sb{display:flex;flex-direction:column;gap:10px;min-width:0}
.chk{font-size:13.5px}

/* ---------- Dialoge */
dialog{background:var(--pop);color:#fff;border:0;border-radius:14px;padding:0;width:min(600px,94vw);box-shadow:var(--shadow-modal)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog .hd{padding:20px 20px 4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
dialog .bd{padding:12px 20px 16px;display:flex;flex-direction:column;gap:16px;max-height:72vh;overflow:auto}
dialog .ft{padding:4px 20px 20px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
dialog input[type=text],dialog input[type=number],dialog input[type=password],dialog textarea,dialog select{background:var(--bg);box-shadow:inset 0 0 0 1px var(--ring);height:38px;border-radius:8px;padding:0 12px;font-size:14.5px}
dialog textarea{height:auto;padding:10px 12px;font-size:14px}
dialog input:focus,dialog textarea:focus,dialog select:focus{box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
dialog.ask{width:min(360px,92vw);background:#262626;border-radius:16px}
dialog.ask .at{padding:24px 22px 18px;text-align:center;display:flex;flex-direction:column;gap:8px}
dialog.ask .at b{font-size:18px}
dialog.ask .at div{font-size:14px;opacity:.8;text-wrap:pretty;white-space:pre-line}
dialog.ask .af{display:flex;gap:10px;padding:0 22px 22px}
dialog.ask .af .btn{flex:1;height:38px;font-weight:700}
.optline{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--div);cursor:pointer}
.optline:first-child{border-top:0}
.optline .t{font-size:14.5px}
.optline .d{font-size:13px;opacity:.6}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;align-items:start}
.dsec{font-size:12px;font-weight:700;opacity:.5;text-transform:uppercase;letter-spacing:.05em;padding-top:8px;border-top:1px solid var(--div)}
details>summary{cursor:pointer}

/* ---------- Stacks (Teil 2) */
.stks{display:flex;flex-direction:column;gap:14px}
.stk{display:grid;grid-template-columns:300px minmax(0,1fr);background:var(--card);border:1px solid var(--card-line);border-radius:14px;overflow:hidden;min-width:0}
.stk.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stk.nopv{grid-template-columns:minmax(0,1fr)}
.stk.nopv .sp{display:none}
.stk .sp{position:relative;background:#0d0d10;min-height:200px;display:grid;place-items:center;color:rgba(255,255,255,.45);font-size:13px;text-align:center;padding:0;border:0;cursor:pointer}
.stk .sp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.stk .sp .badges{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;justify-content:space-between;pointer-events:none}
.stk .sp .badges .pill{background:rgba(15,15,15,.85)}
.stk .sb{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.stk .st{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.stk .st h3{font-size:18px;min-width:0;overflow-wrap:anywhere}
.stk .smeta{font-size:13.5px;opacity:.65;display:flex;flex-wrap:wrap;gap:2px 14px}
.qv{display:flex;flex-wrap:wrap;gap:8px 22px}
.qv>div{display:flex;flex-direction:column;gap:1px;min-width:60px}
.qv span{font-size:12px;opacity:.55}
.qv b{font-size:17px;font-weight:700;white-space:nowrap}
.qv.pend{font-size:13.5px;color:var(--info-2);flex-direction:row;align-items:center;gap:8px}
.snote{font-size:14px;opacity:.85;white-space:pre-line;text-wrap:pretty;cursor:text;border-radius:6px;padding:4px 6px;margin-left:-6px;background:transparent;border:0;text-align:left;color:inherit;font:inherit}
.snote:hover{background:var(--panel)}
.snote.none{opacity:.45;font-style:italic}
.sacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto}
.sacts .grow{flex:1}
.serr{font-size:14px;color:var(--err);text-wrap:pretty}
.cmpbar{position:sticky;top:-28px;z-index:5;background:var(--bg);padding:10px 0;margin:-10px 0 -4px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;box-shadow:0 1px 0 var(--div)}

/* ---------- Vergleich (Überlagerung mit Schieber) */
.cmp{position:fixed;inset:0;z-index:55;background:#08080a;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:52px minmax(0,1fr)}
.cmptop{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 8px 0 18px;border-bottom:1px solid rgba(255,255,255,.06);min-width:0}
.cmptop select{max-width:260px}
.cmptop .vs{opacity:.5;font-size:13px}
.cmpimg{position:relative;overflow:hidden;min-height:0;background:#000;display:grid;place-items:center;touch-action:none}
.cmpbox{position:relative;user-select:none;cursor:ew-resize}
.cmpbox img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.cmpbox .cb{clip-path:inset(0 0 0 var(--x,50%))}
.cmph{position:absolute;top:0;bottom:0;left:var(--x,50%);width:calc(2px / var(--zs,1));margin-left:calc(-1px / var(--zs,1));background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none}
.cmph:after{content:"";position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:999px;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.5);background-image:linear-gradient(90deg,transparent 9px,#0b0b0c 9px 11px,transparent 11px 19px,#0b0b0c 19px 21px,transparent 21px);transform:scale(calc(1 / var(--zs,1)))}
.cmplab{position:absolute;top:12px;padding:3px 10px;border-radius:999px;background:rgba(15,15,15,.85);font-size:12.5px;font-weight:700;pointer-events:none;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmplab.a{left:12px}.cmplab.b{right:12px}
.cmpmsg{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:rgba(20,20,22,.92);box-shadow:0 0 0 1px #2a2a2e;font-size:13.5px;text-align:center;max-width:90%}
.cmpside{background:var(--sheet);border-left:1px solid rgba(0,0,0,.5);padding:18px;display:flex;flex-direction:column;gap:16px;overflow:auto;min-height:0}
.cmprange{width:100%;accent-color:#fff}
.mtab{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:0;font-size:13.5px}
.mtab>div{padding:8px 6px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:6px}
.mtab>div.h{border-top:0;font-size:12px;font-weight:700;opacity:.55;text-transform:uppercase;letter-spacing:.04em}
.mtab>div.v{flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;white-space:nowrap;font-weight:600;min-width:78px;padding-left:10px}
.mtab>div.h.v{flex-direction:row}
.mtab .better{color:var(--ok)}
.mtab .worse{color:var(--err);opacity:.85}
.mtab .mk{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:5px;line-height:16px}
.mtab .better .mk{background:var(--ok-bg)}
.mtab .worse .mk{background:var(--err-bg)}
.cnote{display:flex;flex-direction:column;gap:6px}
.cnote textarea{min-height:60px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--ring);font-size:13.5px}

/* ---------- Galerie */
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gt{background:var(--card);border:1px solid var(--card-line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;position:relative}
.gt .ph{position:relative;aspect-ratio:4/3;background:#0d0d10;display:grid;place-items:center;color:rgba(255,255,255,.45);font-size:12.5px;cursor:pointer;border:0;padding:0;width:100%}
.gt .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.gt .ph .noimg{display:flex;flex-direction:column;align-items:center;gap:6px}
.gt .ph .noimg svg{width:28px;height:28px;opacity:.6}
.gt .badges{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;justify-content:space-between;pointer-events:none}
.gt .badges .pill{background:rgba(15,15,15,.85)}
.gt.miss .ph img{opacity:.3}
.gt .gx{padding:9px 12px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gt .gn{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt .gm{font-size:12.5px;opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt .ga{position:absolute;top:calc(8px);right:8px;display:flex;gap:4px;opacity:0;transition:opacity .1s}
.gt:hover .ga,.gt:focus-within .ga{opacity:1}
.gt .ga .btn{background:rgba(15,15,15,.85)}
.gt .ga .btn:hover{background:rgba(40,40,44,.95)}
.gt .ga .btn.on{color:var(--warn)}
.gadd{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gadd input{flex:1 1 260px}
/* Großansicht der Galerie */
.gv{position:fixed;inset:0;z-index:55;background:#08080a;display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:52px minmax(0,1fr)}
.gv .lbtop{grid-column:1/-1}
.gv img:not([src]){display:none}
.lbload.center{top:50%;left:50%;transform:translate(-50%,-50%);font-size:14.5px;padding:10px 18px;opacity:.85}

/* ---------- Verlauf */
.tl{display:flex;flex-direction:column}
.tlhd{font-size:13px;font-weight:700;opacity:.55;text-transform:uppercase;letter-spacing:.06em;padding:18px 0 8px}
.tlhd:first-child{padding-top:0}
.tli{display:grid;grid-template-columns:130px 36px minmax(0,1fr);gap:4px 12px;align-items:start;padding:10px 0;border-top:1px solid var(--div)}
.tlhd+.tli{border-top:0}
.tli .tw{font-size:13px;opacity:.6;padding-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tli .tic{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;background:var(--fill)}
.tli .tic.ok{background:var(--ok-bg);color:var(--ok)}.tli .tic.err{background:var(--err-bg);color:var(--err)}
.tli .tic.warn{background:var(--warn-bg);color:var(--warn)}.tli .tic.info{background:var(--info-bg);color:var(--info-2)}
.tli .tx{min-width:0;padding-top:5px}
.tli .tt{font-size:15px;font-weight:600;text-wrap:pretty}
.tli .td{font-size:13.5px;opacity:.65;text-wrap:pretty;overflow-wrap:anywhere;margin-top:1px}
.tli .tp{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--fill);margin-right:8px;vertical-align:1px}
.tli .tp:hover{background:var(--fill-2)}
/* Sicherungen in den Einstellungen */
.bkl{display:flex;flex-direction:column;border-radius:10px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--ring);max-height:260px;overflow:auto}
.bkr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:9px 12px;border-top:1px solid var(--div)}
.bkr:first-child{border-top:0}
.bkr .bd1{font-size:14px;font-weight:600}
.bkr .bd2{font-size:12.5px;opacity:.6;grid-column:1}
.bkr .btn{grid-row:1/3;grid-column:2}
@media (max-width:1000px){
  .stk{grid-template-columns:200px minmax(0,1fr)}
  .cmp{grid-template-columns:1fr;grid-template-rows:52px minmax(0,1fr) 40%}
  .cmpside{border-left:0;border-top:1px solid rgba(0,0,0,.5)}
  .gv{grid-template-columns:1fr;grid-template-rows:52px minmax(0,1fr) 34%}
  .tli{grid-template-columns:104px 32px minmax(0,1fr)}.tli .tw{white-space:normal}
  .cmpbar{top:-20px}
}
@media (max-width:640px){
  .cmptop{padding:0 4px 0 10px;gap:6px}.cmptop .ct,.cmptop .vs,#cmpSwap .hl{display:none}.cmptop select{flex:1 1 0;min-width:0;max-width:none!important}
  .mrow{grid-template-columns:minmax(0,1fr) auto;padding:10px 12px}.mrow .mi{display:none}.mrow .mn{white-space:normal}.mrow .ms{grid-column:1;grid-row:2;justify-self:start}
  .mrow [data-mdel]{grid-column:2;grid-row:1/3}
  .dl{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}.dl .m:nth-of-type(2){display:none}
  .lbtop .hl{display:none}
  .tabs{overflow-x:auto;scrollbar-width:none}
}
@media (max-width:640px){.stk{grid-template-columns:1fr}.stk .sp{min-height:180px}.tli{grid-template-columns:32px minmax(0,1fr)}.tli .tw{grid-column:2;padding-top:0;order:3}.cmptop select{max-width:120px}}
@media (max-width:1000px){
  main.view{padding:20px 16px 72px}
  h1{font-size:27px}
  .cols2{grid-template-columns:1fr}
  .rbody{grid-template-columns:1fr}.rbody>div+div{border-left:0;border-top:1px solid var(--div)}
  .lb{grid-template-columns:1fr;grid-template-rows:52px minmax(0,1fr) 44%}
  .lbside{border-left:0;border-top:1px solid rgba(0,0,0,.5)}
  .fbar{top:-20px}
}
@media (max-width:640px){.tind .ell{display:none}.crumb{display:none}#histBtn .hl,#libBtn .hl{display:none}}
.hbtn.on{background:rgba(255,255,255,.1)}
</style>

<header class="hb">

  <span id="conn"></span>
  <button class="tind idle" id="tind" title="Aufträge"></button>

<main class="view" id="view"></main>

<div id="popBack" hidden></div>
<div class="pop" id="taskPop" hidden style="width:380px"></div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Frame-Ansicht">
  <div class="lbtop"><span id="lbTitle" class="ftag"></span><span class="lbn ell" id="lbN"></span><span class="grow"></span>
    <button class="hbtn" id="lbStars" title="Erkannte Sterne einblenden (S)" aria-pressed="false"></button>

    <div class="zoomi" id="lbZoomI" hidden></div>
    <button class="lbnav l" id="lbPrev" aria-label="vorheriges Bild"></button><button class="lbnav r" id="lbNext" aria-label="nächstes Bild"></button>
    <div class="lbload" id="lbLoad" hidden></div><div class="lbmsg" id="lbMsg" hidden></div></div>
  <aside class="lbside" id="lbSide"></aside>
</div>

    <span class="cmplab a" id="cmpLa"></span><span class="cmplab b" id="cmpLb"></span><div class="cmpmsg" id="cmpMsg" hidden></div></div>
  <aside class="cmpside" id="cmpSide"></aside>

  <aside class="lbside" id="gvSide"></aside>

  </div>
  <div class="ft"><button class="btn outline" data-close>Abbrechen</button><button class="btn primary" id="npOk">Anlegen</button></div>

   b2stacker – neue Oberfläche, Teil 1
   Aufbau:
   - Daten: /api/bootstrap beim Start, danach hält /api/events (Server-Sent Events) alles aktuell.
   - Ansichten (Hash-Routen): #/ Startseite · #/p/<id>/<tab> Projekt (overview|frames|plan|stacks|history)
   - Alles, was dauert, läuft auf dem Server als Auftrag; hier gibt es nur dezente Live-Hinweise.
   Haken für Teil 2: TABS.stacks / TABS.history ersetzen, coverUrl() für Projektbilder, Sortierung in SORTS.

const $=s=>document.querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=1)=>v==null||isNaN(v)?'–':Number(v).toLocaleString('de-AT',{minimumFractionDigits:d,maximumFractionDigits:d});

const ymd=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'.'+m[2]+'.'+m[1]:'–'};
const dm=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'.'+m[2]+'.':'–'};
const hm=s=>{const m=String(s||'').match(/T(\d{2}):(\d{2})/);return m?m[1]+':'+m[2]:''};
const MONTHS=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

const RTF=new Intl.RelativeTimeFormat('de',{numeric:'auto'});
function ago(s){
  if(!s)return '';const t=Date.parse(s);if(isNaN(t))return '';
  const d=(t-Date.now())/1000,a=Math.abs(d);
  if(a<60)return 'gerade eben';if(a<3600)return RTF.format(Math.round(d/60),'minute');
  if(a<86400)return RTF.format(Math.round(d/3600),'hour');if(a<86400*30)return RTF.format(Math.round(d/86400),'day');
  return 'am '+ymd(s);
}
// Restzeit in Klartext
function eta(s){
  if(s==null)return '';if(s<45)return 'gleich fertig';
  const m=Math.round(s/60);if(m<60)return 'noch etwa '+m+' min';
  return 'noch etwa '+Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min';
}

// ---------- Filterfarben (wie alte App)
const FCOL={ha:'#e01b24',oiii:'#2190a4',sii:'#a51d2d',r:'#e01b24',g:'#2ec27e',b:'#3584e4',l:'#deddda'};
function fkind(name){
  const n=String(name||'').toLowerCase().replace(/[\s_\-\/]+/g,'');
  if(/^(s(ii|2)).*o(iii|3)|sho/.test(n))return 'so3';
  if(/h(a|alpha).*o(iii|3)|^hao3|extreme|enhance|alpt|duo|quad|dualband|nbz|l-?ultimate/.test(n))return 'hao3';
  if(/^(ha|halpha|hα|h)$/.test(n)||/^ha\d/.test(n))return 'ha';
  if(/^(oiii|o3)/.test(n))return 'oiii';
  if(/^(sii|s2)/.test(n))return 'sii';
  if(/^(l|lum|luminance|clear)$/.test(n))return 'l';
  if(/^(r|red)$/.test(n))return 'r';if(/^(g|green)$/.test(n))return 'g';if(/^(b|blue)$/.test(n))return 'b';
  return 'rgb';
}
function fbg(name,deg){
  const k=fkind(name),C=FCOL;deg=deg||135;
  return {rgb:`linear-gradient(${deg}deg,${C.r} 0 33.3%,${C.g} 33.3% 66.6%,${C.b} 66.6%)`,
    hao3:`linear-gradient(${deg}deg,${C.ha} 0 50%,${C.oiii} 50%)`,so3:`linear-gradient(${deg}deg,${C.sii} 0 50%,${C.oiii} 50%)`}[k]||C[k];
}
const fic=(name,big)=>`<span class="fic${big?' lg':''}" style="background:${fbg(name)}"></span>`;
const ftag=(name,big)=>`<span class="ftag">${fic(name,big)}${esc(name||'?')}</span>`;

// ---------- Server
async function api(path,body){
  const o=body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Astrostack':'1'},body:JSON.stringify(body)};
  const r=await fetch(path,o);const j=await r.json().catch(()=>({error:'Antwort unlesbar (HTTP '+r.status+')'}));
  if(!r.ok||(j&&j.error))throw new Error((j&&j.error)||('HTTP '+r.status));
  return j;
}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),err?7000:3000);}
// Knopf sofort als „arbeitet“ zeigen, solange die Anfrage läuft
async function busy(btn,fn){
  if(btn){btn.classList.add('busy');btn.disabled=true;}
  try{return await fn();}catch(e){toast(e.message,true);return undefined;}
  finally{if(btn&&btn.isConnected){btn.classList.remove('busy');btn.disabled=false;}}
}
// Bestätigung im Stil der App; liefert true/false
function ask(title,text,ok,danger){
  return new Promise(res=>{
    $('#askT').textContent=title;$('#askX').textContent=text||'';
    const b=$('#askOk');b.textContent=ok||'OK';b.className='btn '+(danger?'dangerfill':'primary');
    const done=v=>{askDlg.onclose=null;askDlg.close();res(v)};
    b.onclick=()=>done(true);$('#askNo').onclick=()=>done(false);askDlg.onclose=()=>res(false);
    askDlg.showModal();b.focus();
  });
}
$$('dialog [data-close]').forEach(b=>{if(!b.textContent.trim())b.innerHTML=ic('close');b.onclick=()=>b.closest('dialog').close();});
async function pickFolder(initial){

// ---------- Aufträge: Klartext für Fortschritt
const ACTIVE=['queued','running'];
const projTasks=pid=>[...S.tasks.values()].filter(t=>t.project_id===pid&&ACTIVE.includes(t.state));
const pname=pid=>{const p=S.projects.find(x=>x.id===pid);return p?p.name:'';};
// „38 neue Lights werden eingelesen · noch etwa 2 min“
function taskText(t,withTitle){
  if(t.state==='queued')return 'wartet: '+t.title;
  const st=t.step||'',n=t.total,d=t.done;
  let s;
  if(/^Header lesen/.test(st)&&n)s=plural(n,'neue Datei wird','neue Dateien werden')+' eingelesen';
  else if(/^Frames vermessen/.test(st)&&n)s=plural(n,'Frame wird','Frames werden')+' vermessen';
  else if(/^Neue Dateien suchen/.test(st))s='Ordner werden durchsucht';
  else if(/^Frames bewerten/.test(st))s='Frames werden bewertet';
  else if(/^Plan aktualisieren/.test(st))s='Plan wird aktualisiert';
  else s=st||(t.title+' …');
  const who=withTitle?(pname(t.project_id)||t.title):'';
  const parts=[who?who+': '+s:s];
  if(n&&d<n&&!/^(Header|Frames vermessen)/.test(st))parts.push(int(d)+' von '+int(n));
  else if(n&&d<n)parts.push(int(d)+' von '+int(n)+' fertig');
  const e=eta(t.eta_s);if(e&&n)parts.push(e);
  return parts.join(' · ');
}
const pct=t=>t.total?Math.max(2,Math.min(100,100*t.done/t.total)):0;
const bar=t=>`<div class="bar6${t.total?'':' indet'}"><div style="width:${pct(t)}%"></div></div>`;
function liveHtml(pid){
  const ts=projTasks(pid);
  return ts.map(t=>`<div class="live${t.state==='queued'?' q':''}">${t.state==='running'?bar(t):ic('clock','s14')}<span class="lt ell">${esc(taskText(t))}</span></div>`).join('');
}

function renderTaskIndicator(){
  const b=$('#tind'),act=[...S.tasks.values()].filter(t=>ACTIVE.includes(t.state));
  const run=act.filter(t=>t.state==='running');
  const failed=S.finished.find(t=>t.state==='failed'&&!t._seen);
  if(!act.length){
    b.className='tind idle'+(failed?' fail':'');
    b.innerHTML=failed?`${ic('warn','s14')}<span class="ell">Fehler: ${esc(failed.title)}</span>`:`${ic('check','s14')}<span class="ell">Alles erledigt</span>`;
  }else{
    const t=run[0]||act[0];
    b.className='tind';
    b.innerHTML=`${ic('spinner','s14 spin')}<span class="ell">${esc(t.state==='running'?taskText(t,true):'wartet: '+t.title)}</span>`+
      (t.total?`<span class="minibar"><span style="width:${pct(t)}%"></span></span>`:'')+(act.length>1?`<span style="opacity:.7">+${act.length-1}</span>`:'');
  }

}
function renderTaskPop(){
  const act=[...S.tasks.values()].filter(t=>ACTIVE.includes(t.state));
  const row=t=>`<div class="trow${ACTIVE.includes(t.state)?'':' fin'}"><div class="tt ell">${esc(t.title)}</div>
    ${ACTIVE.includes(t.state)?`<button class="btn sm" data-cancel="${esc(t.id)}">Abbrechen</button>`:
      `<span class="pill ${t.state==='done'?'ok':t.state==='failed'?'err':'neutral'}">${{done:'fertig',failed:'Fehler',cancelled:'abgebrochen'}[t.state]||t.state}</span>`}
    ${t.state==='running'?bar(t):''}
    <div class="ts">${esc(ACTIVE.includes(t.state)?taskText(t):t.state==='failed'?(t.error||'Fehler'):ago(t.finished))}</div></div>`;
  $('#taskPop').innerHTML=(act.length?`<div class="ph">Läuft und wartet</div>${act.map(row).join('')}`:`<div class="trow"><div class="tt">Gerade läuft nichts.</div><div class="ts">Neue Daten werden automatisch im Hintergrund eingelesen und vermessen.</div></div>`)+
    (S.finished.length?`<div class="sep"></div><div class="ph">Zuletzt</div>${S.finished.slice(0,6).map(row).join('')}`:'');
  $$('#taskPop [data-cancel]').forEach(x=>x.onclick=()=>busy(x,async()=>{const t=await api('/api/tasks/'+encodeURIComponent(x.dataset.cancel)+'/cancel',{});onTask(t);}));

function openPop(id,anchor){

// ---------- Live-Ereignisse (SSE) mit Wiederverbindung
let ES=null,esRetry=null;
function connect(){
  if(ES)ES.close();
  ES=new EventSource('/api/events?last='+S.lastEvent);
  const seq=e=>{const n=parseInt(e.lastEventId,10);if(!isNaN(n))S.lastEvent=n;};
  ES.onopen=()=>{$('#conn').innerHTML='';};
  ES.addEventListener('task',e=>{seq(e);onTask(JSON.parse(e.data));});
  ES.addEventListener('projects',e=>{seq(e);soon('projects',loadProjects,300);});
  ES.addEventListener('project',e=>{seq(e);const d=JSON.parse(e.data)||{};onProjectChanged(d.id);});
  ES.addEventListener('library',e=>{seq(e);if(S.route.view==='library')soon('lib',renderLibrary,200);});
  ES.addEventListener('reset',e=>{seq(e);reloadAll();});
  ES.onerror=()=>{
    $('#conn').innerHTML=`<span class="conn">${ic('warn','s14')} Verbindung getrennt – verbinde neu …</span>`;

  };
}
const TIMERS={};
function soon(key,fn,ms){clearTimeout(TIMERS[key]);TIMERS[key]=setTimeout(fn,ms);}
function onTask(t){
  if(!t||!t.id)return;
  const was=S.tasks.get(t.id);
  // Antworten von POST-Anfragen können nach den Live-Ereignissen ankommen: nie einen älteren Stand übernehmen
  if(S.finished.some(x=>x.id===t.id))return;
  if(was&&was.state==='running'&&t.state==='queued')return;
  if(ACTIVE.includes(t.state)){S.tasks.set(t.id,t);}
  else{
    S.tasks.delete(t.id);
    if(!S.finished.some(x=>x.id===t.id)){
      S.finished.unshift(t);S.finished.length=Math.min(S.finished.length,12);
      if(t.state==='failed')toast('Fehler bei „'+t.title+'“: '+(t.error||'unbekannt'),true);
      if(t.kind==='selftest'&&t.state==='done')api('/api/selftest').then(l=>{renderSelftests();const r=l[0];if(r)toast(r.ok?'Selbsttest bestanden':'Selbsttest: Problem gefunden – Details in den Einstellungen',!r.ok);}).catch(()=>{});
      else if(t.state==='done'&&t.kind==='stack')toast('Fertig gestackt: '+t.title.replace(/ stacken.*$/,''));
      if(t.project_id!=null){soon('projects',loadProjects,250);
        if(S.P&&S.P.id===t.project_id){if(S.F&&S.F.pid===t.project_id)S.F.stale=true;soon('project',reloadProject,150);}}
    }
  }
  if(!was&&t.project_id!=null)soon('projects',loadProjects,400);   // neuer Auftrag: Kachel zeigt „arbeitet“
  renderTaskIndicator();
  updateLive();
}
// Projekt hat sich geändert (Auftrag fertig, Entscheidung, Planänderung): Daten nachladen, ohne zu blockieren
function onProjectChanged(pid){
  soon('projects',loadProjects,400);
  if(S.route.view==='history')soon('ghist',renderGlobalHistory,800);
  if(S.route.view==='library')soon('lib',renderLibrary,800);

async function reloadAll(first){
  try{
    const b=await api('/api/bootstrap');
    S.boot=b;S.projects=b.projects;S.lastEvent=b.tasks.last_event;document.body.classList.toggle('remote',!!b.remote);
    S.tasks=new Map();[...b.tasks.running,...b.tasks.queued].forEach(t=>S.tasks.set(t.id,t));
    S.finished=b.tasks.finished||[];S.finished.forEach(t=>t._seen=true);
    renderTaskIndicator();connect();
    if(first)route(true);                                  // erster Aufbau
    else if(S.route.view==='project'&&S.P)reloadProject(); // nach „reset“: nur nachladen, nicht neu öffnen
    else route();
  }catch(e){
    $('#conn').innerHTML=`<span class="conn">${ic('warn','s14')} Server nicht erreichbar – neuer Versuch …</span>`;
    clearTimeout(esRetry);esRetry=setTimeout(()=>reloadAll(first),3000);

}

const SORTS={
  opened:['Zuletzt geöffnet',(a,b)=>cmpDesc(a.opened_at||a.created_at,b.opened_at||b.created_at)],
  hours:['Gesamtbelichtung',(a,b)=>(b.hours||0)-(a.hours||0)],
  first:['Erstes Light',(a,b)=>cmpAsc(a.first_light,b.first_light)],
  last:['Letztes Light',(a,b)=>cmpDesc(a.last_light,b.last_light)],
};
// fehlende Werte immer ans Ende
function cmpDesc(a,b){if(!a&&!b)return 0;if(!a)return 1;if(!b)return -1;return a<b?1:a>b?-1:0;}
function cmpAsc(a,b){if(!a&&!b)return 0;if(!a)return 1;if(!b)return -1;return a<b?-1:a>b?1:0;}
// Teil 2 liefert Projektbilder (letzter Stack oder gewähltes Bild); bis dahin der Platzhalter
const coverUrl=p=>p.cover_url||p.image_url||null;
function hashStr(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}
// Platzhalter: kleiner Sternenhimmel mit Nebelschleier, je Projekt gleich (aus dem Namen berechnet)
function placeholder(p){
  let h=hashStr(p.name);const rnd=()=>{h=Math.imul(h^(h>>>15),2246822507)>>>0;h=Math.imul(h^(h>>>13),3266489909)>>>0;return ((h^=h>>>16)>>>0)/4294967296;};
  const f=(p.filters||[])[0],k=fkind(f?f.filter:''),col={ha:'224,27,36',oiii:'33,144,164',sii:'165,29,45',hao3:'190,40,70',so3:'120,40,90',l:'150,150,170'}[k]||'53,132,228';
  const stars=[];for(let i=0;i<26;i++){const x=(rnd()*100).toFixed(1),y=(rnd()*100).toFixed(1),r=rnd()<.15?1.6:.8,a=(.35+rnd()*.6).toFixed(2);
    stars.push(`radial-gradient(${r}px ${r}px at ${x}% ${y}%,rgba(255,255,255,${a}) 99%,transparent)`);}
  const nx=(20+rnd()*60).toFixed(0),ny=(25+rnd()*50).toFixed(0);
  return stars.join(',')+`,radial-gradient(60% 70% at ${nx}% ${ny}%,rgba(${col},.30),transparent 70%),radial-gradient(40% 50% at ${100-nx}% ${100-ny}%,rgba(${col},.12),transparent 70%),linear-gradient(160deg,#101018,#07070a)`;
}
function fbars(p){
  const fs=(p.filters||[]).slice().sort((a,b)=>b.hours-a.hours),max=Math.max(...fs.map(f=>f.hours),0.0001);
  if(!fs.length)return '';
  return `<div class="fbars">${fs.slice(0,4).map(f=>`<div class="fbr" title="${esc(f.filter)}: ${int(f.lights)} Lights, ${num(f.hours,1)} h">
    <span class="fn">${fic(f.filter)}<span class="ell">${esc(f.filter)}</span></span>
    <span class="fb"><i style="width:${Math.max(3,100*f.hours/max)}%;background:${fbg(f.filter,90)}"></i></span><span class="fh">${hrs(f.hours)} h</span></div>`).join('')}
    ${fs.length>4?`<div class="small muted">+ ${fs.length-4} weitere Filter</div>`:''}</div>`;
}
function tile(p){
  const ts=projTasks(p.id),t=ts.find(x=>x.state==='running')||ts[0];
  const cov=coverUrl(p);
  const meta=[p.opened_at?'geöffnet '+ago(p.opened_at):'',p.stacked_at?'gestackt '+ago(p.stacked_at):'noch nicht gestackt'].filter(Boolean);
  return `<button class="tile" data-pid="${p.id}" title="${esc(p.description||p.name)}">
    <div class="ph" style="background:${cov?`#000 url('${esc(cov)}') center/cover`:placeholder(p)}">
      <div class="badges">${p.offline?`<span class="pill err">${ic('unavail','tiny')} Quelle offline</span>`:'<span></span>'}
        <span class="pill busy" ${t?'':'hidden'}>${ic('spinner','tiny spin')} arbeitet</span></div>
      ${cov?'':`<span class="ini">${esc((p.object||'').toUpperCase())}</span>`}</div>
    <div class="tx">
      <div class="tn">${esc(p.name)}</div>
      <div class="hrs"><b>${hrs(p.hours)}</b><span class="u">h</span><span class="l">${p.lights?plural(p.lights,'Light','Lights'):'noch keine Lights'}</span></div>
      ${fbars(p)}
      ${p.new_since_stack?`<div class="tnew">+${int(p.new_since_stack)} Frames seit dem letzten Stack</div>`:''}
      <div class="tbusy" ${t?'':'hidden'}>${t?`${ic('spinner','s14 spin')}<span class="ell">${esc(taskText(t))}</span>`:''}</div>
      <div class="tmeta">${meta.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
    </div></button>`;
}

function renderTiles(){
  const box=$('#tiles');if(!box)return;
  const q=S.home.q.trim().toLowerCase();
  const all=S.projects;
  const list=all.filter(p=>!q||(p.name+' '+(p.object||'')+' '+(p.description||'')).toLowerCase().includes(q)).sort(SORTS[S.home.sort][1]);
  const total=all.reduce((s,p)=>s+(p.hours||0),0);
  $('#homeSub').textContent=all.length?plural(all.length,'Projekt','Projekte')+' · '+hrs(total)+' h Belichtung insgesamt':'';
  const newTile=`<button class="tile new" id="newTile"><span class="plus">${ic('plus','s18')}</span><b>Neues Projekt</b><span class="small muted">Ordner wählen – den Rest erledigt b2stacker im Hintergrund.</span></button>`;
  if(!all.length){
    box.innerHTML=`<div class="empty"><div class="t">Noch keine Projekte</div><div class="x">Lege dein erstes Projekt an: Name eingeben, Ordner mit Aufnahmen wählen. b2stacker liest und vermisst alles im Hintergrund.</div>
      <button class="btn primary" id="emptyNew" style="margin-top:8px">${ic('plus')} Erstes Projekt anlegen</button></div>`;
    $('#emptyNew').onclick=()=>openNewProject();return;
  }
  if(!list.length){box.innerHTML=`<div class="empty"><div class="t">Nichts gefunden</div><div class="x">Kein Projekt passt zu „${esc(S.home.q)}“.</div></div>`;return;}
  if(S.home.group){
    // ein Projekt erscheint in JEDEM Monat, in dem fotografiert wurde
    const groups=new Map();
    for(const p of list){const ms=(p.months||[]).length?p.months:[''];for(const m of ms){if(!groups.has(m))groups.set(m,[]);groups.get(m).push(p);}}
    const keys=[...groups.keys()].sort((a,b)=>!a?1:!b?-1:a<b?1:-1);
    box.innerHTML=keys.map(k=>`<div class="mhd">${esc(monthName(k))} <span style="opacity:.7;font-weight:400">· ${groups.get(k).length}</span></div><div class="tiles">${groups.get(k).map(tile).join('')}</div>`).join('');
  }else box.innerHTML=`<div class="tiles">${list.map(tile).join('')}${q?'':newTile}</div>`;
  $$('.tile[data-pid]',box).forEach(el=>el.onclick=()=>go('#/p/'+el.dataset.pid));
  const nt=$('#newTile');if(nt)nt.onclick=()=>openNewProject();
}

// ---------- Übersicht
function problems(plan){
  const out=[];if(!plan)return out;
  for(const r of plan.runs||[]){
    for(const x of r.problems||[])out.push({lvl:'warn',t:r.name+': '+x});
    if(!r.enabled&&r.why_off&&!(r.problems||[]).length)out.push({lvl:'info',t:r.name+' ist aus: '+r.why_off});
    for(const f of r.flats||[])if(f.verdict==='critical'||f.verdict==='warning')out.push({lvl:f.verdict==='critical'?'err':'warn',t:r.name+', Nacht '+ymd(f.night)+': '+f.reason});
  }
  if(plan.free_gb!=null&&plan.need_gb>plan.free_gb)out.push({lvl:'err',t:'Zu wenig Speicherplatz: '+num(plan.need_gb)+' GB nötig, '+num(plan.free_gb)+' GB frei.'});
  return out;
}

const FTYPES=[['light','Lights'],['flat','Flats'],['bias','Bias'],['dark','Darks']];
const FSTAT=[['all','Alle'],['use','Verwendet'],['skip','Aussortiert'],['delete','Zum Löschen'],['manual','Manuell']];
const fstate=f=>f.status==='use'?'use':f.status==='delete'?'delete':'skip';
const FCHUNK=5000;
const FV={type:'light',status:'all',asc:true,sel:new Set(),anchor:null,view:[],geo:null,nodes:new Map(),raf:0};
async function loadFrames(keep){
  const p=S.P;if(!p)return;const pid=p.id,type=FV.type;
  const tok=(S.F&&S.F.tok||0)+1;
  if(!keep||!S.F||S.F.type!==type)S.F={pid,type,list:[],total:null,loading:true,tok};
  else{S.F.loading=true;S.F.tok=tok;S.F.stale=false;}
  renderFrameSummary();
  const all=[];let total=0;
  try{
    for(let off=0;;off+=FCHUNK){
      const r=await api(`/api/projects/${pid}/frames?type=${type}&offset=${off}&limit=${FCHUNK}`);
      if(!S.F||S.F.tok!==tok)return;
      total=r.total;all.push(...r.frames);
      if(!keep||off===0&&all.length>=total){S.F.list=all.slice();S.F.total=total;applyFrameView();}
      if(all.length>=total||!r.frames.length)break;
    }
  }catch(e){toast(e.message,true);}
  if(!S.F||S.F.tok!==tok)return;
  S.F.list=all;S.F.total=total;S.F.loading=false;
  applyFrameView();
}
function frameMatches(f){
  if(FV.status==='all')return true;
  if(FV.status==='manual')return f.origin==='manual';
  return fstate(f)===FV.status;
}
function applyFrameView(){
  if(!S.F)return;
  const v=S.F.list.filter(frameMatches);
  v.sort((a,b)=>{const x=(a.date_obs||'')+a.path,y=(b.date_obs||'')+b.path;return (x<y?-1:x>y?1:0)*(FV.asc?1:-1);});
  FV.view=v;
  for(const id of [...FV.sel])if(!S.F.list.some(f=>f.id===id))FV.sel.delete(id);
  renderFrameSummary();layoutGrid(true);
}

    ${bad.map(f=>`<div class="dl off"><span class="ell" title="${esc(f.path)}">${esc(f.name)}</span><span class="m">${esc(f.blocked)}</span><span></span><span></span><button class="lnk" data-keep="${f.id}">behalten</button></div>`).join('')}</div>

// --- Virtualisierung
function setupGrid(){
  teardownGrid();
  const v=$('#view');FV.onScroll=()=>{if(!FV.raf)FV.raf=requestAnimationFrame(()=>{FV.raf=0;renderVisible();});};
  v.addEventListener('scroll',FV.onScroll,{passive:true});
  FV.ro=new ResizeObserver(()=>layoutGrid(false));FV.ro.observe($('#vgrid'));
  FV.nodes=new Map();
}
function teardownGrid(){
  if(FV.onScroll)$('#view').removeEventListener('scroll',FV.onScroll);FV.onScroll=null;
  if(FV.ro)FV.ro.disconnect();FV.ro=null;FV.nodes=new Map();FV.geo=null;
}
function layoutGrid(reset){
  const g=$('#vgrid');if(!g)return;
  const W=g.clientWidth,gap=10,minW=W<700?130:170;
  const cols=Math.max(1,Math.floor((W+gap)/(minW+gap))),tw=(W-(cols-1)*gap)/cols,th=Math.round(tw*2/3)+22,rh=th+gap;
  const rows=Math.ceil(FV.view.length/cols);
  const changed=!FV.geo||FV.geo.cols!==cols||Math.abs(FV.geo.tw-tw)>.5;
  FV.geo={cols,tw,th,rh,gap};
  g.style.height=(rows?rows*rh-gap:0)+'px';
  if(!FV.view.length&&S.F&&!S.F.loading){g.innerHTML=`<div class="empty"><div class="t">Keine Frames</div><div class="x">${FV.status==='all'?'In diesem Projekt gibt es (noch) keine Frames dieser Art.':'Keine Frames mit diesem Status.'}</div></div>`;g.style.height='auto';FV.nodes=new Map();return;}
  if(reset||changed){g.innerHTML='';FV.nodes=new Map();}
  renderVisible();
}
function renderVisible(){
  const g=$('#vgrid'),G=FV.geo;if(!g||!G)return;
  const v=$('#view'),top=g.getBoundingClientRect().top-v.getBoundingClientRect().top;   // Abstand Raster ↔ sichtbarer Bereich
  const r0=Math.max(0,Math.floor((-top)/G.rh)-2),r1=Math.ceil((-top+v.clientHeight)/G.rh)+2;
  const i0=r0*G.cols,i1=Math.min(FV.view.length,r1*G.cols);
  for(const [i,el] of FV.nodes)if(i<i0||i>=i1||FV.view[i]!==el._f){el.remove();FV.nodes.delete(i);}
  const frag=document.createDocumentFragment();
  for(let i=i0;i<i1;i++){
    if(FV.nodes.has(i))continue;
    const f=FV.view[i],el=document.createElement('div');el._f=f;el.dataset.i=i;
    el.className='vt';el.style.width=G.tw+'px';el.style.height=G.th+'px';
    el.style.transform=`translate(${(i%G.cols)*(G.tw+G.gap)}px,${Math.floor(i/G.cols)*G.rh}px)`;
    fillTile(el,f);frag.appendChild(el);FV.nodes.set(i,el);
  }
  g.appendChild(frag);
}
function fillTile(el,f){
  const skip=f.status!=='use',del=f.status==='delete';
  el.classList.toggle('skip',skip);el.classList.toggle('del',del);el.classList.toggle('sel',FV.sel.has(f.id));
  el.title=f.name+(skip?' – aussortiert: '+(f.reason||''):'');
  el.innerHTML=`<div class="ph">${f.thumb_url?`<img loading="lazy" decoding="async" alt="" src="${esc(f.thumb_url)}">`:'<span>noch kein Vorschaubild</span>'}
    <span class="cb" data-cb>${ic('check')}</span>${del?`<span class="mk del">${ic('trash','tiny')} löschen</span>`:f.origin==='manual'?'<span class="mk">manuell</span>':''}
    ${skip?`<span class="why">${esc(f.reason||'aussortiert')}</span>`:''}</div>
    <div class="fx"><span><i class="${skip?'dotno':'dotok'}"></i>${f.date_obs?esc(dm(f.date_obs)+' '+hm(f.date_obs)):esc(f.name)}</span><span class="m">${f.fwhm!=null?'FWHM '+num(f.fwhm,2):f.filter?esc(f.filter):''}</span></div>`;
}
function refreshTiles(){for(const [,el] of FV.nodes)fillTile(el,el._f);}
// Klicks im Raster (ein Listener für alle Kacheln)
document.addEventListener('click',e=>{
  const el=e.target.closest&&e.target.closest('#vgrid .vt');if(!el)return;

    const a=FV.view.findIndex(x=>x.id===FV.anchor);const [s,t]=a<0?[i,i]:[Math.min(a,i),Math.max(a,i)];
    for(let k=s;k<=t;k++)FV.sel.add(FV.view[k].id);
  }else if(e.target.closest('[data-cb]')||e.ctrlKey||e.metaKey||FV.sel.size){
    FV.sel.has(f.id)?FV.sel.delete(f.id):FV.sel.add(f.id);FV.anchor=f.id;
  }else{FV.anchor=f.id;return openLightbox(i);}
  e.preventDefault();refreshTiles();renderSelBar();
});

// Entscheidung: sofort anzeigen (optimistisch), dann speichern; der Plan aktualisiert sich über das Ereignis „project“
async function decide(ids,decision){
  if(!ids.length||!S.P)return;
  const pid=S.P.id,want=new Set(ids);
  // dieselben Frames können als Objekt in der Liste und in der offenen Großansicht stecken (nach einem Nachladen)
  const objs=new Set([...(S.F?S.F.list:[]),...(LB.list||[])].filter(f=>want.has(f.id)));
  const before=[...objs].map(f=>({f,s:f.status,o:f.origin,r:f.reason}));
  for(const {f} of before){
    if(decision==='auto'){f.origin='auto';f.reason=f.status==='use'?'':f.reason;}
    else{f.status=decision;f.origin='manual';f.reason={use:'manuell verwendet',skip:'manuell aussortiert',delete:'zum Löschen vorgemerkt'}[decision];}
  }
  refreshTiles();renderFrameSummary();renderLightbox();
  try{
    await api('/api/projects/'+pid+'/decide',{file_ids:ids,decision});
    if(decision==='auto'&&S.F){S.F.stale=true;soon('frames-auto',()=>loadFrames(true),300);}   // Automatik: echte Bewertung nachladen
    soon('delban',loadDelBanner,250);
    if(ids.length>1)toast(plural(ids.length,'Frame','Frames')+': '+{use:'werden verwendet',skip:'werden nicht verwendet',auto:'wieder auf Automatik',delete:'zum Löschen vorgemerkt'}[decision]);
  }catch(e){
    for(const b of before){b.f.status=b.s;b.f.origin=b.o;b.f.reason=b.r;}
    refreshTiles();renderFrameSummary();renderLightbox();toast(e.message,true);
  }
}

// ---------- Zoom: Mausrad oder zwei Finger, ziehen verschiebt, Doppelklick wechselt Einpassen ↔ 1:1
function makeZoom(host,target,o){
  const Z={s:1,x:0,y:0,max:o.max||8,ptr:new Map(),pan:null,pinch:null};
  const lay=()=>{const r=target.getBoundingClientRect();return {l:r.left-Z.x,t:r.top-Z.y};};
  const apply=()=>{
    if(Z.s<=1.001){Z.s=1;Z.x=0;Z.y=0;}
    target.style.transform=Z.s===1?'':`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
    target.classList.toggle('zoomed',Z.s>1);
    if(o.info){const el=o.info();if(el){el.hidden=Z.s===1;el.textContent=o.label?o.label(Z.s):Math.round(Z.s*100)+' %';}}
    if(o.onChange)o.onChange(Z.s);
  };
  Z.to=(s,cx,cy)=>{s=Math.max(1,Math.min(Z.max,s));const L=lay();
    if(cx==null){const r=host.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;}
    const ux=(cx-L.l-Z.x)/Z.s,uy=(cy-L.t-Z.y)/Z.s;Z.x=cx-L.l-s*ux;Z.y=cy-L.t-s*uy;Z.s=s;apply();};
  Z.reset=()=>{Z.s=1;apply();};
  host.addEventListener('wheel',e=>{if(o.enabled&&!o.enabled())return;e.preventDefault();Z.to(Z.s*Math.exp(-e.deltaY*(e.deltaMode===1?0.05:0.0016)),e.clientX,e.clientY);},{passive:false});
  host.addEventListener('dblclick',e=>{if(o.enabled&&!o.enabled())return;if(e.target.closest('button'))return;e.preventDefault();
    const one=o.oneToOne?o.oneToOne():2;Z.to(Z.s>1.01?1:Math.max(one,1.5),e.clientX,e.clientY);});
  host.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;Z.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(Z.ptr.size===2){const [a,b]=[...Z.ptr.values()];Z.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:Z.s};Z.pan=null;e.stopPropagation();return;}
    if(Z.s>1&&(!o.panOk||o.panOk(e))){Z.pan={x:e.clientX,y:e.clientY,ox:Z.x,oy:Z.y};host.setPointerCapture(e.pointerId);e.stopPropagation();}},true);
  host.addEventListener('pointermove',e=>{if(!Z.ptr.has(e.pointerId))return;Z.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(Z.pinch&&Z.ptr.size===2){const [a,b]=[...Z.ptr.values()];Z.to(Z.pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,Z.pinch.d),(a.x+b.x)/2,(a.y+b.y)/2);e.stopPropagation();return;}
    if(Z.pan){Z.x=Z.pan.ox+e.clientX-Z.pan.x;Z.y=Z.pan.oy+e.clientY-Z.pan.y;apply();e.stopPropagation();}},true);
  const up=e=>{Z.ptr.delete(e.pointerId);if(Z.ptr.size<2)Z.pinch=null;if(!Z.ptr.size)Z.pan=null;};
  host.addEventListener('pointerup',up,true);host.addEventListener('pointercancel',up,true);
  return Z;
}

  else if(!e.repeat&&k==='n'){e.preventDefault();lbDecide('skip');}

const REJ=[['auto','Automatisch (WBPP)'],['percentile','Percentile Clipping'],['winsorized','Winsorized Sigma'],['esd','Generalized ESD'],['linear_fit','Linear Fit'],['rcr','Robust Chauvenet']];
const SETL={

  weighting:['Gewichtung','sel',[['psf_signal','PSF Signal'],['psf_snr','PSF SNR'],['snr','SNR']]],
  local_normalization:['Lokale Normalisierung','bool'],
  distortion_correction:['Verzerrungskorrektur','bool'],
  cosmetic_correction:['Hotpixel entfernen','bool'],
  drizzle:['Drizzle 2×','bool'],
  large_scale_rejection:['Satelliten- und Flugzeugspuren entfernen','bool'],
  fast_integration:['Schnelle Integration','bool'],
  autocrop:['Automatisch zuschneiden','bool'],
  star_detection:['Sternerkennung','ro'],
};
const VERD={good:['gut','ok'],warning:['Hinweis','warn'],critical:['Problem','err']};
const PENDING=new Set();      // Lauf|Einstellung, die gerade gespeichert wird
const OPENRUN=new Map();      // Lauf-Id → Details offen? (sonst: offen, wenn der Lauf an ist)
function renderPlan(box){

  </div>`;
  renderStackBox();

  $$('[data-reset]',box).forEach(b=>b.onclick=()=>{const [rid,key]=splitKey(b.dataset.reset);editPlan({runs:{[rid]:{[key]:null}}},b.dataset.reset);});
}
const splitKey=s=>{const i=s.lastIndexOf('|');return [s.slice(0,i),s.slice(i+1)];};
function runCard(r){
  const nights=r.nights||[];
  const setRows=r.settings.map(s=>{
    const L=SETL[s.key]||[s.key,typeof s.value==='boolean'?'bool':'ro'],k=r.id+'|'+s.key,pend=PENDING.has(k);
    let ctl;
    if(L[1]==='bool')ctl=`<label class="switch"><input type="checkbox" data-set="${esc(k)}" ${s.value?'checked':''} aria-label="${esc(L[0])}"><span></span></label>`;
    else if(L[1]==='sel'){
      // Rejection: die vier üblichen Verfahren; ein anderer gespeicherter Wert bleibt sichtbar
      const base=s.key==='rejection'?L[2].slice(0,4):L[2];
      const opts=base.some(o=>o[0]===s.value)?base:base.concat([L[2].find(o=>o[0]===s.value)||[s.value,String(s.value)]]);
      ctl=`<select data-set="${esc(k)}" aria-label="${esc(L[0])}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===s.value?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;}
    else ctl=`<span class="ro">${s.value&&typeof s.value==='object'?'eigene Werte':esc(String(s.value))}</span>`;
    return `<div class="setrow${pend?' pending':''}"><div class="sn">${esc(L[0])}${s.edited?` <span class="adj">angepasst</span><button class="rst" data-reset="${esc(k)}" title="Automatik: ${esc(autoText(L,s.auto))}">zurück auf Automatik</button>`:''}</div>
      <div class="sc">${ctl}</div><div class="sw">${esc(s.why)}${s.edited?' · Automatik wäre: '+esc(autoText(L,s.auto)):''}</div></div>`;
  }).join('');
  const flats=(r.flats||[]).map(f=>{const v=VERD[f.verdict];return `<div class="calrow"><span class="cl">Flats ${esc(dm(f.night))}</span><span class="cv">${f.file_ids&&f.file_ids.length?plural(f.file_ids.length,'Flat','Flats')+' · ':''}${esc(f.reason)}</span>${v?`<span class="pill ${v[1]}">${v[0]}</span>`:(f.file_ids||[]).length?'':'<span class="pill warn">fehlt</span>'}</div>`;}).join('');
  const cal=(k,l)=>r[k]?`<div class="calrow"><span class="cl">${l}</span><span class="cv">${(r[k].file_ids||[]).length?plural(r[k].file_ids.length,l==='Bias'?'Bias':'Dark',l==='Bias'?'Bias':'Darks')+' · ':''}${esc(r[k].reason||'')}</span><span></span></div>`:'';

const bytes=n=>{if(n==null)return '–';const u=['B','KB','MB','GB','TB'];let i=0;n=+n;while(n>=1000&&i<u.length-1){n/=1000;i++;}return num(n,i>=2&&n<100?1:0)+' '+u[i];};
// relative Zeit für den Verlauf (auch Monate und Jahre)
function agoLong(s){
  if(!s)return '';const t=Date.parse(/Z$|[+-]\d\d:\d\d$/.test(s)?s:s+'Z');if(isNaN(t))return '';
  const d=(t-Date.now())/1000,a=Math.abs(d);
  if(a<60)return 'gerade eben';if(a<3600)return RTF.format(Math.round(d/60),'minute');
  if(a<86400)return RTF.format(Math.round(d/3600),'hour');if(a<86400*30)return RTF.format(Math.round(d/86400),'day');
  if(a<86400*365)return RTF.format(Math.round(d/86400/30.4),'month');return RTF.format(Math.round(d/86400/365),'year');
}
// „letzte Nacht“, „vor 3 Nächten“ (Abenddatum der Nacht, lokal)
function nightsAgo(night){
  const m=String(night||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return '';
  const now=new Date(),ev=new Date(now.getFullYear(),now.getMonth(),now.getDate()-(now.getHours()<12?1:0));
  const n=Math.round((ev-new Date(+m[1],+m[2]-1,+m[3]))/86400000);
  if(n<=0)return 'heute Nacht';if(n===1)return 'letzte Nacht';if(n<31)return 'vor '+n+' Nächten';
  return agoLong(night+'T22:00:00');
}
const QL=[['fwhm','Schärfe (FWHM)'],['noise','Rauschen'],['stars','Sterne'],['ecc','Sternform'],['gradient_pct','Verlauf']];
function qval(k,q){
  const v=q[k];if(v==null)return '–';
  if(k==='fwhm')return num(v,2)+(q.fwhm_unit==='″'?'″':' px');
  if(k==='noise')return num(v,v<10?2:1)+' ADU';
  if(k==='stars')return int(v);if(k==='ecc')return num(v,2);if(k==='gradient_pct')return num(v,1)+' %';if(k==='snr_bg')return num(v,1);
  return String(v);
}
function qualityHtml(s){
  const q=s.quality;
  if(s.status!=='done')return '';
  if(!q)return `<div class="qv pend">${ic('spinner','s14 spin')} Qualität wird gemessen …</div>`;
  if(q.error)return `<div class="qv pend" style="color:var(--warn)">${ic('warn','s14')} Keine Qualitätswerte: ${esc(q.error)}</div>`;
  return `<div class="qv">${QL.map(([k,l])=>`<div><span>${l}</span><b>${esc(qval(k,q))}</b></div>`).join('')}</div>`;
}

const HV={filter:'all',project:'',limit:100};
const HFILT=[['all','Alles'],['data','Neue Daten'],['stack','Stacks'],['change','Änderungen']];
const HKIND={data:['files_discovered','assets_added','folder_added','folder_removed'],stack:['stack_done','stack_failed','stack_cancelled','stack_deleted'],
  change:['frames_decided','plan_edited','project_renamed','project_created','cover_set','backup_restored']};
function dayGroup(at){
  const t=new Date(Date.parse(at)),now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const days=Math.floor((d0-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/86400000);
  if(days<=0)return 'Heute';if(days===1)return 'Gestern';if(days<7)return 'Diese Woche';if(days<14)return 'Letzte Woche';
  return MONTHS[t.getMonth()]+' '+t.getFullYear();
}
function timelineHtml(items,withProject){
  if(!items.length)return `<div class="empty"><div class="t">Noch nichts passiert</div><div class="x">Hier erscheint, was b2stacker findet und tut: neue Aufnahmen je Nacht und Filter, Stacks, deine Entscheidungen.</div></div>`;
  let last='',out='';
  for(const i of items){
    const g=dayGroup(i.at);if(g!==last){out+=`<div class="tlhd">${esc(g)}</div>`;last=g;}
    // heute und gestern: Uhrzeit (bei weniger als einer Stunde „vor 5 Minuten“), sonst relativ
    const t=new Date(Date.parse(i.at)),fresh=Date.now()-t<3600e3;
    const when=fresh||!/^(Heute|Gestern)$/.test(g)?agoLong(i.at):(g==='Gestern'?'gestern ':'')+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    // neue Aufnahmen: dazu, wann sie aufgenommen wurden („letzte Nacht“, „vor 3 Nächten“)
    const det=i.detail&&i.night&&/^Nacht vom /.test(i.detail)?i.detail.replace(/^(Nacht vom [\d.]+)/,'$1 ('+nightsAgo(i.night)+')'):i.detail;
    out+=`<div class="tli" data-kind="${esc(i.kind)}"><span class="tw" title="${esc(ymd(i.at)+' '+hm(i.at))}">${esc(when.charAt(0).toUpperCase()+when.slice(1))}</span>
      <span class="tic ${esc(i.tone)}">${ic(i.icon,'s14')}</span>
      <div class="tx"><div class="tt">${withProject&&i.project_id!=null?`<a class="tp" href="#/p/${i.project_id}/history">${esc(i.project||'?')}</a>`:''}${esc(i.title)}</div>
        ${det?`<div class="td">${esc(det)}</div>`:''}</div></div>`;
  }
  return `<div class="tl">${out}</div>`;
}
async function loadTimeline(pid){
  const q=new URLSearchParams({limit:HV.limit});if(pid!=null)q.set('project',pid);
  let h=[];try{h=await api('/api/history?'+q);}catch(e){toast(e.message,true);}
  return h;
}
